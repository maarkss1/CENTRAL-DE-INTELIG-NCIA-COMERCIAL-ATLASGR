# Regras de alerta do Prometheus local (infrastructure/observability/prometheus.yml, carregado
# pelo container `prometheus` de docker-compose.opensource.yml — stack opcional, ligada via
# `npm run infra:up`). Não há Alertmanager configurado neste repositório (nenhum
# `alertmanager.yml`/serviço em docker-compose.opensource.yml) — os alertas abaixo ficam
# visíveis em Prometheus (`/alerts`) e podem ser consultados pelo datasource Prometheus já
# provisionado no Grafana (`grafana-datasources.yml`), mas não dispara notificação (Slack/e-mail/
# PagerDuty) até que alguém configure um receptor. Isso é decisão de produto/operação (qual canal
# usar), não uma correção de rotina — registrado como pendência abaixo, não fingido como pronto.
#
# Cobertura pedida pela missão do Agente 10 (falha de migração, fila travada, sync Bitrix
# falhando, 5xx acima de limiar, uso de IA fora do orçamento): dividida em dois grupos.
#
# - "ativos-hoje": usam métricas que a aplicação já exporta de fato em /metrics
#   (client.collectDefaultMetrics() em server.ts — só métricas padrão de processo Node.js/V8,
#   nenhuma métrica de negócio custom existe hoje). Funcionam assim que `EXPOSE_METRICS=true` e o
#   Prometheus local está de fato scrapeando a instância certa.
# - "pendente-instrumentacao": a métrica referenciada AINDA NÃO EXISTE no código da aplicação.
#   As regras ficam prontas (não fabricadas "no vácuo" — nome de métrica e labels documentados
#   como contrato) para ativar assim que a instrumentação for adicionada pelo agente dono do
#   domínio (handoffs abertos em .agents/handoffs/onda-4/10-para-*). Até lá, Prometheus
#   simplesmente não encontra a série e a regra fica "unknown"/sem disparar — não é um falso
#   positivo, mas também não é observabilidade real ainda.

groups:
  - name: prospector-atlas.process-health.ativos-hoje
    rules:
      - alert: InstanceDown
        expr: up{job="central-comercial"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instância do Prospector-Atlas não responde ao scrape do Prometheus"
          description: >-
            `up == 0` para o job central-comercial por mais de 2 minutos. Verificar
            /health/live e /health/ready diretamente, depois logs do processo. Ver runbook
            infrastructure/observability/RUNBOOK.md → "Aplicação indisponível".

      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_seconds{job="central-comercial"} > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event loop do Node.js com lag alto (>500ms) por 5min+"
          description: >-
            Indica trabalho síncrono bloqueando o processo (query pesada sem streaming,
            processamento de arquivo grande, loop CPU-bound) — sintoma comum antes de timeouts
            em cascata. Ver runbook → "Latência/timeouts".

      - alert: HighHeapUsageRatio
        expr: >-
          nodejs_heap_size_used_bytes{job="central-comercial"}
          / nodejs_heap_size_total_bytes{job="central-comercial"} > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap V8 acima de 90% do heap total alocado por 10min+"
          description: >-
            Candidato a memory leak ou carga real acima do dimensionado. Cruzar com
            `resources.limits.memory` do Deployment/Rollout (charts/prospector-atlas/values.yaml)
            — se o pod está sendo OOMKilled, ver runbook → "Pod reiniciando (OOMKilled)".

  - name: prospector-atlas.migracao.pendente-instrumentacao
    rules:
      # Requer kube-state-metrics rodando no cluster (não incluído neste repositório — nenhum
      # cluster real está registrado hoje, ver charts/README.md/argocd/README.md). Cobre o Job
      # criado por charts/prospector-atlas/templates/migration-job.yaml (hook pre-upgrade).
      - alert: MigrationJobFailed
        expr: >-
          kube_job_status_failed{job_name=~".*-migrate-.*", namespace=~"production|homolog"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Job de migração Prisma (hook Helm pre-upgrade) falhou"
          description: >-
            O release foi abortado pelo hook — nenhuma versão nova do app está rodando com
            schema desatualizado (garantia mantida), mas o deploy está bloqueado até a causa
            raiz ser corrigida. Ver runbook → "Falha de migração".
          contract_metric_source: kube-state-metrics
          contract_owner: "Agente 10 (cluster real ainda não provisionado)"

  - name: prospector-atlas.filas.pendente-instrumentacao
    rules:
      # bullmq_queue_waiting_jobs/bullmq_queue_active_jobs não existem hoje — nenhum
      # `new client.Gauge(...)` para profundidade de fila em src/lib/queue/**. Nome de métrica é
      # um contrato proposto, não uma constatação de que já existe. Ver handoff
      # .agents/handoffs/onda-4/10-para-07-metricas-fila-orcamento-ia.md.
      - alert: QueueBacklogHigh
        expr: bullmq_queue_waiting_jobs > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fila BullMQ com mais de 500 jobs aguardando por 10min+"
          description: >-
            Fila travada ou worker sem capacidade (ver worker.autoscaling em
            charts/prospector-atlas/values.yaml, desligado por padrão). Ver runbook → "Fila
            travada".
          contract_metric_source: "instrumentação pendente — Agente 07 (src/lib/queue/**)"

      - alert: QueueStalled
        expr: rate(bullmq_queue_completed_jobs[15m]) == 0 and bullmq_queue_waiting_jobs > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Fila com jobs aguardando mas zero jobs completados em 15min — fila travada"
          contract_metric_source: "instrumentação pendente — Agente 07 (src/lib/queue/**)"

  - name: prospector-atlas.bitrix.pendente-instrumentacao
    rules:
      # bitrix_sync_failures_total não existe hoje — nenhuma métrica custom em
      # src/features/integrations/bitrix/**/outboundSync.ts ou src/lib/queue/bitrixSync.worker.ts.
      # Ver handoff .agents/handoffs/onda-4/10-para-06-metricas-sync-bitrix.md.
      - alert: BitrixSyncFailuresHigh
        expr: increase(bitrix_sync_failures_total[15m]) >= 5
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "5+ falhas de sincronização Bitrix em 15min"
          description: >-
            Bloqueador conhecido em /AGENTS.md ("Sincronizações Bitrix que podem falhar
            silenciosamente"). Ver runbook → "Sync Bitrix falhando".
          contract_metric_source: "instrumentação pendente — Agente 06 (src/features/integrations/bitrix/**)"

  - name: prospector-atlas.http-5xx.pendente-instrumentacao
    rules:
      # http_requests_total (por status code) não existe hoje. O caminho mais barato para isto
      # NÃO é criar um Counter custom em toda rota — src/lib/tracing.ts já inicializa
      # getNodeAutoInstrumentations() do OpenTelemetry (auto-instrumenta o Express/HTTP), mas só
      # registra um traceExporter (OTLPTraceExporter), sem MeterProvider/metric exporter. O
      # pipeline "metrics" do otel-collector (infrastructure/observability/otel-collector.yml,
      # já correto e já exportando para Prometheus em :9464) fica sem receber nada até isso ser
      # ligado. Ver handoff .agents/handoffs/onda-4/10-para-01-metricas-http-otel.md.
      - alert: HighErrorRate5xx
        expr: >-
          sum(rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m]))
          / sum(rate(http_server_duration_milliseconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro 5xx acima de 5% nos últimos 5min"
          contract_metric_source: "instrumentação pendente — Agente 01 (src/lib/tracing.ts: metric exporter do OTel)"

  - name: prospector-atlas.orcamento-ia.pendente-instrumentacao
    rules:
      # ai_usage_cost_usd_total / ai_usage_budget_usd não existem hoje como métricas Prometheus —
      # o custo de IA é hoje só um registro em banco (tabela AILog, ver
      # docs/deploy/producao.md seção 1.3 sobre a policy RLS de AILog). Ver handoff
      # .agents/handoffs/onda-4/10-para-07-metricas-fila-orcamento-ia.md.
      - alert: AIBudgetOverrun
        expr: ai_usage_cost_usd_total / ai_usage_budget_usd_total > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Uso de IA acima do orçamento definido pelo Agente 07"
          description: >-
            Bloqueador conhecido: "Ferramentas do Hub de IA inacessíveis" pode ser sintoma de
            corte por orçamento. Ver runbook → "Hub de IA inacessível / orçamento de IA".
          contract_metric_source: "instrumentação pendente — Agente 07 (src/lib/ai/gateway.ts)"
