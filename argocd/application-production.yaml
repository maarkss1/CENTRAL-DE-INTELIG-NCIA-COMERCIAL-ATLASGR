apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prospector-atlas-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/MaarksN/CENTRAL-DE-INTELIGENCIA-COMECIAL-ATLASGR.git'
    targetRevision: main
    path: charts/prospector-atlas
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
