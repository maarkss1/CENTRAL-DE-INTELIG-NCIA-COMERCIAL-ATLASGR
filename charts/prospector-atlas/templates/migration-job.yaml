{{- if .Values.migrations.enabled }}
# Hook pre-install/pre-upgrade: roda `prisma migrate deploy` ANTES do Helm aplicar o
# Deployment/Rollout novo. Se este Job falhar, o hook falha e o `helm upgrade`
# (e, por extensão, o sync do ArgoCD nas Applications em argocd/) é abortado — o
# Deployment/Rollout com a imagem nova nunca chega a ser aplicado contra um schema
# desatualizado ou uma migração quebrada. Implementa, na camada de orquestração de
# cluster, a mesma garantia que `render.yaml` já tem no caminho de deploy real
# (`startCommand: npx prisma migrate deploy && npm run start`) — ver
# /AGENTS.md → bloqueador #5 ("Deploy capaz de iniciar sem aplicar migrações").
#
# CLI do prisma na imagem: RESOLVIDO (ver handoff
# .agents/handoffs/onda-4/10-para-08-prisma-cli-imagem-producao.md, Status: resolvido). O estágio
# final do `Dockerfile` da raiz roda `npm prune --omit=dev` (remove `prisma`, a CLI, de
# devDependencies), mas logo em seguida reinstala só a CLI (`npm install --no-save prisma@...`,
# mesma versão fixada em devDependencies) antes de copiar `node_modules` para o estágio runner —
# confirmado lendo o Dockerfile atual. `npx prisma migrate deploy` neste Job funciona com a
# imagem publicada por `.github/workflows/cd-homolog.yml`/`production.yaml`. Nenhum cluster real
# sincroniza este chart hoje (ver charts/README.md) — o manifest é mantido correto/completo para
# quando o caminho k8s/Helm for ativado de fato.
apiVersion: batch/v1
kind: Job
metadata:
  # sufixo por revisão: cada `helm upgrade` cria um Job novo (nomes de Job são imutáveis em
  # campos como `spec.template`, então reaproveitar o nome quebraria upgrades subsequentes).
  name: {{ include "prospector-atlas.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "prospector-atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # before-hook-creation evita acumular Jobs de tentativas antigas; hook-succeeded remove o
    # Job assim que a migração passa (mantém histórico de um Job falho para investigação caso
    # o hook aborte o release).
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "prospector-atlas.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: prisma-migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.migrations.image.repository | default .Values.image.repository }}:{{ .Values.migrations.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: {{ include "prospector-atlas.fullname" . }}-config
            - secretRef:
                name: {{ include "prospector-atlas.fullname" . }}-secret
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
