apiVersion: v1
kind: Service
metadata:
  name: {{ include "prospector-atlas.fullname" . }}
  labels:
    {{- include "prospector-atlas.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "prospector-atlas.selectorLabels" . | nindent 4 }}
    # Ver deployment.yaml/rollout.yaml — sem isto o Service também elegeria pods do worker
    # (que só expõem a porta "health", não "http"; o Endpoint ficaria sem esse pod para esta
    # porta, mas o selector continuaria semanticamente errado e o pod apareceria nos Endpoints
    # do Service sem porta correspondente).
    app.kubernetes.io/component: web
