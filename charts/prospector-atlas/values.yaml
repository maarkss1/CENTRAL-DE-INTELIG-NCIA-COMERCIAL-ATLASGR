# Default values for prospector-atlas.
replicaCount: 2

# repository aponta para o registro real onde .github/workflows/cd-homolog.yml publica a imagem
# (ghcr.io/${{ github.repository }}, resolvido em minúsculas pelo GHCR) — antes apontava só para
# "prospector-atlas", um nome de imagem sem registro/owner que não corresponde a nada publicado.
image:
  repository: ghcr.io/maarksn/central-de-inteligencia-comecial-atlasgr
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

blueGreen:
  enabled: true
  autoPromotionSeconds: 30 # Time to wait before automatically promoting the green version


serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: prospector-atlas.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: prospector-atlas-tls
      hosts:
        - prospector-atlas.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Job Helm (pre-install/pre-upgrade hook, ver templates/migration-job.yaml) que roda
# `npx prisma migrate deploy` antes de qualquer Deployment/Rollout novo ser aplicado. Se o Job
# falhar, o release inteiro (helm upgrade / sync do ArgoCD) é abortado — nenhuma versão nova do
# app inicia contra um schema desatualizado ou uma migração quebrada (mesma garantia que
# render.yaml já tem no deploy real via Render). Ver o comentário no topo do template para o
# caveat conhecido: a imagem publicada hoje pelo Dockerfile da raiz não contém a CLI `prisma`
# (só @prisma/client) — handoff aberto para o Agente 08 em
# .agents/handoffs/onda-4/10-para-08-prisma-cli-imagem-producao.md.
migrations:
  enabled: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  # Por padrão usa a mesma imagem do app (image.repository/image.tag acima). Só preencha aqui se
  # quiser rodar a migração a partir de uma imagem "migrator" separada que preserve a CLI prisma.
  image:
    repository: ""
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# PodDisruptionBudget do Deployment/Rollout principal e do worker — evita que um drain de nó
# (manutenção, cluster autoscaler removendo nó ocioso) derrube todas as réplicas de uma vez.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  workerMinAvailable: 1

worker:
  enabled: true
  replicaCount: 2
  # Desligado por padrão: sem uma métrica real de profundidade de fila exposta ao Prometheus
  # hoje (ver infrastructure/observability/alert.rules.yml), autoscaling do worker só por
  # CPU/memória é uma aproximação grosseira — fila BullMQ pode crescer com CPU ociosa (worker
  # esperando I/O de rede em chamadas de IA/Bitrix). Ligue explicitamente
  # (worker.autoscaling.enabled=true) se aceitar essa aproximação, ou depois que o Agente 07
  # expuser métrica de profundidade de fila (ver handoff correspondente).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: "production"
  PORT: "3000"
  LITELLM_URL: "http://prospector-atlas-litellm:4000"

secrets:
  # JWT_SECRET: "secret"
  # DATABASE_URL: "postgresql://user:password@db-host:5432/db"
  # LITELLM_KEY: "sk-litellm"
  # REDIS_URL: "redis://redis-host:6379"
  # MEILISEARCH_URL: "http://meilisearch:7700"
  # MEILISEARCH_MASTER_KEY: "masterKey"
