# Default values for prospector-atlas.
replicaCount: 2

image:
  repository: prospector-atlas
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

blueGreen:
  enabled: true
  autoPromotionSeconds: 30 # Time to wait before automatically promoting the green version


serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: prospector-atlas.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: prospector-atlas-tls
      hosts:
        - prospector-atlas.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: "production"
  PORT: "3000"
  LITELLM_URL: "http://prospector-atlas-litellm:4000"

secrets:
  # JWT_SECRET: "secret"
  # DATABASE_URL: "postgresql://user:password@db-host:5432/db"
  # LITELLM_KEY: "sk-litellm"
  # REDIS_URL: "redis://redis-host:6379"
  # MEILISEARCH_URL: "http://meilisearch:7700"
  # MEILISEARCH_MASTER_KEY: "masterKey"
