title = "gitleaks config — Prospector AtlasGR"

# Mantém todas as regras padrão do gitleaks (mesmo comportamento de detecção que o repositório já
# tinha antes deste arquivo existir, ver .github/workflows/ci.yml, job "secret-scan") e só
# acrescenta um allowlist global bem específico — não substitui nem enfraquece nenhuma regra.
[extend]
useDefault = true

# Falso-positivo conhecido: um JWT SINTÉTICO (payload {"sub":"1234567890"}, sem relação com
# nenhuma conta/sessão real) usado como fixture em
# tests/unit/features/bug-reports/bugReport.sanitize.test.ts, para testar a redação de JWT feita
# por bugReport.sanitize.ts. O gitleaks escaneia o diff de CADA commit do histórico — um
# `// gitleaks:allow` inline só suprime a partir do commit em que é adicionado, não retroage aos
# commits anteriores que já introduziram o literal. Allowlist por regex é a forma correta de
# resolver isso sem reescrever histórico: casa com o valor exato do fixture, então não amplia o
# allowlist para nenhum segredo real que venha a aparecer no futuro.
#
# Falso-positivo conhecido #2: a regra `linkedin-client-id` do gitleaks é um heurístico genérico
# — qualquer identificador de exatamente 14 caracteres alfanuméricos logo após algo com "linkedin"
# no nome (`(?i)...linkedin...[:=]...[a-z0-9]{14}`) é sinalizado como possível Client ID. Em
# src/features/prospecting/components/prospecting-hub/tools/LinkedInTool.tsx a linha
# `linkedinUrl: manualKnownUrl || undefined,` bateu nisso por coincidência: "manualKnownUrl" é só
# o nome de uma variável local (o link colado manualmente pelo usuário), não uma credencial.
# Confirmado rodando `gitleaks detect` local (sem --redact) contra o commit
# d42daabe5c94b979e0507e0f574ec551d753bf06 — o "Secret" reportado é literalmente o texto
# "manualKnownUrl".
# Falso-positivo conhecido #3: os 31 arquivos `__next._tree.txt` do export estático do Next.js em
# public/tools/treinamento-atlasgr/**/ são metadado de build gerado automaticamente (route tree
# RSC — buildId, chunk hashes, slugs de rota como "01-bem-vindo-atlasgr"), não código-fonte nem
# segredo. A regra genérica `generic-api-key` do gitleaks casa com o trecho
# `"param":{"type":"d","key":"<slug>",...}` por entropia (baixa, ~3.5-4.0 — bem abaixo do limiar
# típico de credencial real) e derrubava o gate "secret scan" (job obrigatório do CI) em toda
# execução que incluísse esses commits no intervalo escaneado. Path-based, não regex de conteúdo:
# o padrão de "key" varia por página/slug, então uma allowlist de conteúdo teria que ser
# atualizada a cada novo export do treinamento — o caminho do arquivo é o identificador estável.
[allowlist]
description = "Fixtures sintéticas de teste e falsos-positivos confirmados (não são segredos reais)"
paths = [
  '''public/tools/treinamento-atlasgr/.*/__next\._tree\.txt$''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''',
  '''manualKnownUrl''',
]
