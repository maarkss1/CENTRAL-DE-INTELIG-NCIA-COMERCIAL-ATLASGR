apply plugin: 'com.android.application'

android {
    namespace = "br.com.atlasgr.prospector"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.atlasgr.prospector"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Assinatura de release lida só de variáveis de ambiente — nunca de arquivo commitado. Sem
    // keystore/senha versionados neste repositório (AGENTS.md do Agente 09 e regra global de
    // "Segurança e higiene"). Variáveis esperadas no ambiente de build de release (CI ou máquina
    // local de quem assina, nunca no código):
    //   ANDROID_KEYSTORE_PATH      caminho absoluto pro arquivo .jks/.keystore (fora do repo)
    //   ANDROID_KEYSTORE_PASSWORD  senha do keystore
    //   ANDROID_KEY_ALIAS          alias da chave dentro do keystore
    //   ANDROID_KEY_PASSWORD       senha da chave (pode ser igual à do keystore, depende de como
    //                              foi gerado)
    // Sem ANDROID_KEYSTORE_PATH definida, buildTypes.release.signingConfig fica null — o build de
    // release ainda compila (útil pra CI validar que o release não quebra), mas gera um artefato
    // não assinado, nunca cai para um keystore de debug/placeholder. Handoff aberto pro Agente 08
    // para popular esses 4 secrets no ambiente de CI que gerar o release assinado de verdade —
    // `android-build.yml` hoje só roda `assembleDebug` (build de debug já é assinado
    // automaticamente pelo AGP com o keystore de debug padrão, não precisa desse bloco).
    def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig releaseKeystorePath ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
