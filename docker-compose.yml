services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: atlasgr/postgres-intelligence:16
    container_name: atlas_postgres
    environment:
      # Superusuario de bootstrap — usado só pela inicialização do container (criar a extension
      # vector e o papel restrito abaixo). A aplicação NUNCA deve conectar como este usuário
      # (ver N1 em docs/auditoria-divida-tecnica/08-PLANO-DE-SEGURANCA.md: RLS nunca se aplica a
      # superusuário, então conectar como ele torna toda política RLS decorativa).
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      # Valores literais abaixo são só o fallback de desenvolvimento (`${VAR:-default}`) — em
      # qualquer ambiente que não seja a máquina local, defina POSTGRES_PASSWORD/APP_DB_PASSWORD
      # num .env não versionado para sobrescrever o default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospector_pass}
      POSTGRES_DB: ${POSTGRES_DB:-prospectordb}
      # Senha do papel NOSUPERUSER que a aplicação de fato usa (DATABASE_URL). Dev-only — troque
      # em qualquer ambiente que não seja a sua máquina local.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-prospector_app_pass}
    ports:
      - "5434:5432"
    # Padrão do Docker (64MB) é insuficiente para VACUUM/hash join paralelos em tabelas
    # grandes (MarketIntelligenceCompany, dezenas de GB) — "No space left on device" ao
    # redimensionar segmento de memória compartilhada não é falta de espaço em disco.
    shm_size: '1gb'
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
      # Só roda na primeira inicialização de um volume novo (comportamento padrão da imagem
      # oficial do Postgres). Volume já existente: rode scripts/db/bootstrap-app-role.sh manualmente.
      - ./scripts/db/create-app-role.sql:/docker-entrypoint-initdb.d/create-app-role.sql.tpl:ro
      - ./scripts/db/docker-init.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
      - ./scripts/db/02-enable-extensions.sql:/docker-entrypoint-initdb.d/02-enable-extensions.sql:ro
      - ./scripts/db/03-create-langfuse-db.sql:/docker-entrypoint-initdb.d/03-create-langfuse-db.sql:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospector} -d ${POSTGRES_DB:-prospectordb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-prospector_redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - atlas_redisdata:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-prospector_redis_pass} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: atlas_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-atlasgr_meili_master_key}
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - atlas_meilidata:/meili_data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, não "localhost": esse wget resolve "localhost" para ::1 primeiro dentro do
      # container e não cai para IPv4 depois do connection refused, então o healthcheck falhava
      # sempre (FailingStreak crescendo indefinidamente) mesmo com o Meilisearch respondendo 200
      # normalmente em /health — confirmado rodando o mesmo comando manualmente dentro do container.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Storage S3 local. Substitui a dependência de Supabase Storage durante o desenvolvimento.
  # Os defaults abaixo (via ${VAR:-default}) são exclusivamente de desenvolvimento — sobrescreva
  # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD num .env não versionado fora da máquina local. TLS não é
  # configurado aqui de propósito (uso local/dev); não reusar este compose como está para produção.
  minio:
    image: minio/minio:latest
    container_name: atlas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlasgr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlasgr_minio_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - atlas_miniodata:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket esperado pela aplicação de forma idempotente após o MinIO responder.
  minio-init:
    image: minio/mc:latest
    container_name: atlas_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-atlasgr} ${MINIO_ROOT_PASSWORD:-atlasgr_minio_dev_only}; do sleep 2; done;
      mc mb --ignore-existing local/prospector-assets;
      exit 0;
      "
    security_opt:
      - no-new-privileges:true
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: atlas_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # host.docker.internal já resolve nativamente no Docker Desktop (Windows/Mac); o mapeamento
    # explícito abaixo é só para portabilidade caso alguém rode isso num host Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # A imagem do LiteLLM não tem curl/wget instalado (só falha com "executable file not
      # found") — o healthcheck original nunca conseguia nem executar, então o container ficava
      # "unhealthy" pra sempre mesmo respondendo normalmente. Python já vem na imagem (usado pela
      # própria aplicação), então serve de cliente HTTP mínimo aqui. 127.0.0.1, não "localhost",
      # pelo mesmo motivo do healthcheck do Meilisearch acima (evita a resolução para ::1).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: atlas_ollama
    ports:
      - "11434:11434"
    volumes:
      - atlas_ollamadata:/root/.ollama
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Descomente abaixo para habilitar GPU Nvidia na nuvem / host Linux:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  atlas_pgdata:
  atlas_redisdata:
  atlas_meilidata:
  atlas_miniodata:
  atlas_ollamadata:
