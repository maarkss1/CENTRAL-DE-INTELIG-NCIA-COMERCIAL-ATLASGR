services:
  - type: web
    name: prospector-atlas
    runtime: node
    # free por enquanto: o workspace do Render ainda não tem cartão cadastrado, e o
    # Blueprint recusa criar serviços em plano pago (starter) sem forma de pagamento
    # no ambiente. Trocar para starter no dashboard depois de cadastrar o cartão —
    # o free dorme após inatividade e tem menos CPU/RAM, não é para uso real com clientes.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Connection string do Supabase (pooler, porta 6543) — definir manualmente no
      # dashboard do Render; o banco de produção NÃO é um Postgres do Render.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: PROSPECTING_PROVIDER_MODE
        value: hybrid
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BITRIX24_WEBHOOK_URL
        sync: false
      - key: BIRTH_VOICES_WEBHOOK_SECRET
        sync: false
      - key: ENABLE_SEARCH
        value: "false"
      - key: ENABLE_QUEUES
        value: "false"
