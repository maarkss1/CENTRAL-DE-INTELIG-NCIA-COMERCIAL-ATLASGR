services:
  - type: web
    name: prospector-atlas
    runtime: node
    # Plano pago (starter): workspace já tem cartão cadastrado (critério de saída do modo
    # local-first cumprido — ver docs/development/LOCAL_FIRST.md). starter não dorme por
    # inatividade, tem mais CPU/RAM que o free e habilita preDeployCommand (ver abaixo).
    plan: starter
    # Deploy automático a cada push em main — o serviço web não tem mais autoDeployTrigger: off
    # (diferente do bloco worker abaixo, que continua congelado). Confirme no dashboard do Render
    # que "Auto-Deploy" está de fato ligado após o próximo sync do Blueprint.
    autoDeployTrigger: commit
    # --include=dev: NODE_ENV=production (definido abaixo, também injetado no build) faz o
    # `npm ci` pular devDependencies por padrão — mas vite, @vitejs/plugin-react, esbuild e
    # typescript (usados só no build, nunca em runtime) estão todos lá. Sem essa flag o build
    # falha com ERR_MODULE_NOT_FOUND ao carregar vite.config.ts.
    buildCommand: npm ci --include=dev && npm run build
    # preDeployCommand (Render "Pre-Deploy Command") roda numa instância efêmera separada, ANTES
    # da nova instância receber tráfego, com a instância antiga ainda no ar — só disponível em
    # planos pagos ("The pre-deploy command is available for paid web services, private services,
    # and background workers" — https://render.com/docs/deploys). Com o plano starter, a migration
    # sai do startCommand e vai para cá: zero-downtime de verdade, em vez de rodar embutida no
    # startCommand (alternativa usada enquanto o serviço estava em plan: free).
    preDeployCommand: npx prisma migrate deploy
    # O bootstrap de Market Intelligence roda depois das migrations (agora via preDeployCommand) e
    # antes do servidor: sem seed versionado ele sai com status no-seed; com seed oficial ele
    # publica CNPJ_ACTIVE atomicamente.
    startCommand: node scripts/market-intelligence/load-company-seed.mjs && npm run start
    # Bate no endpoint com checagem real de banco (SELECT 1), não só "processo respondeu" — ver
    # server.ts. Corrigido de /api/health (rota inexistente; cai no 404 genérico de /api/*) para
    # /health/ready.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Banco Postgres gerenciado externamente (Neon, projeto prospector-atlas, região
      # aws-us-east-1 — ver docs/deploy/producao.md secao 1). DUAS roles com poderes diferentes,
      # diferente do Supabase (lá uma role só bastava): a role padrão que o Neon cria por
      # provisionamento (prospector_app) sempre vem com BYPASSRLS forçado pela plataforma — não dá
      # pra tirar via SQL nem é segura para tráfego de aplicação. DATABASE_URL usa a role
      # `prospector_runtime` (criada via SQL puro, sem BYPASSRLS — RLS realmente se aplica),
      # dono só de DML (SELECT/INSERT/UPDATE/DELETE), NUNCA DDL.
      - key: DATABASE_URL
        sync: false
      # Obrigatória no Neon (diferente do Supabase, onde era opcional): prisma.config.ts usa
      # DIRECT_URL com prioridade sobre DATABASE_URL para o Prisma CLI (migrate/generate — ver
      # preDeployCommand acima). Aponte para a role `prospector_app` (dona das tabelas, tem DDL) —
      # `prospector_runtime` não tem privilégio para CREATE/ALTER TABLE e a migration falharia.
      - key: DIRECT_URL
        sync: false
      # Obrigatórias em produção (NODE_ENV=production) — src/config/env.ts recusa subir sem elas.
      # Cifra credenciais de integrações em repouso (secretFields.ts) e o índice de busca cega de
      # PII de Contact (piiIndex.ts). Gere cada uma com `openssl rand -base64 32`.
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: PII_BLIND_INDEX_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: PROSPECTING_PROVIDER_MODE
        value: hybrid
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BITRIX24_WEBHOOK_URL
        sync: false
      - key: BIRTH_VOICES_WEBHOOK_SECRET
        sync: false
      # "Entrar com Google" (Better Auth) — sem estas duas o botão simplesmente não funciona
      # (são opcionais no schema, não derrubam o boot), mas o checklist pós-deploy de
      # docs/deploy/producao.md secao 7 cobra login Google funcionando.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Sem ela, /admin/queues (BullBoard) e /metrics ficam permanentemente fail-closed mesmo
      # para ADMIN de tenant — ver .env.example.
      - key: PLATFORM_OPERATOR_TOKEN
        sync: false
      - key: ENABLE_SEARCH
        value: "false"
      - key: ENABLE_QUEUES
        value: "false"
      # Redis é opcional (liga filas BullMQ/rate-limit distribuído — ver src/lib/queue/redis.ts).
      # Defina REDIS_URL (ex.: Render Key Value ou Upstash) e ENABLE_QUEUES=true para habilitar.
      - key: REDIS_URL
        sync: false
      # Storage de objetos (uploads) S3-compatível — ver src/lib/storage/index.ts e
      # docs/deploy/producao.md secao 1.2. Sem estas variáveis o storage de objetos fica inerte
      # (getUploadUrl/getDownloadUrl lançam erro explícito), sem impedir o resto da aplicação de
      # subir.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false

  # Worker dedicado (worker.ts, Onda 6 Agente 16) — processa as filas BullMQ + o cron de
  # cold-leads-scanner, sem Express/SPA/SSE. Preparação de config apenas (handoff
  # .agents/handoffs/onda-6/16-para-08-deploy-worker-service.md): NÃO criar este serviço de
  # verdade no Render nesta rodada — depende de (a) o usuário autorizar o gasto de um segundo
  # serviço pago (worker services do Render não têm plano free) e (b) o handoff
  # `16-para-00-remover-workers-de-server-ts.md` ser aplicado primeiro, senão rodar este serviço
  # ao lado do `prospector-atlas` (web) com ENABLE_QUEUES=true nos dois DUPLICA o processamento de
  # cada fila — os dois processos competiriam pelos mesmos jobs BullMQ.
  # LEGACY/FROZEN: ver .agents/handoffs/onda-6/16-para-00-remover-workers-de-server-ts.md
  # (prerequisito ainda não confirmado como aplicado) e a nota original sobre plano pago
  # (workers do Render não têm free tier) antes de reativar este serviço.
  - type: worker
    name: prospector-atlas-worker
    runtime: node
    autoDeployTrigger: off
    plan: free
    buildCommand: npm ci --include=dev && npm run build:worker
    startCommand: npx prisma migrate deploy && npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      # Mesmo banco do serviço web (Neon) — ver docs/deploy/producao.md secao 1. Não crie uma
      # segunda connection string separada. startCommand roda `prisma migrate deploy` direto (sem
      # preDeployCommand aqui), então DIRECT_URL (role prospector_app, com DDL) é obrigatória —
      # DATABASE_URL sozinha (role prospector_runtime) não tem privilégio pra migrar o schema.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Diferente do serviço web (que tem ENABLE_QUEUES=false por padrão hoje), o worker só existe
      # para processar fila — sem Redis ativo ele sobe e fica "degraded" (ver /health/ready em
      # worker.ts), então isso precisa ser true de verdade quando o serviço for ativado.
      - key: ENABLE_QUEUES
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: ENABLE_SEARCH
        value: "false"
      - key: SDR_COLD_CALL_ENABLED
        value: "false"
      - key: SDR_COLD_CALL_ORGANIZATIONS
        sync: false
      - key: SWARM_SCHEDULER_ENABLED
        value: "false"
      - key: SWARM_SCHEDULER_ORGANIZATIONS
        sync: false
      # Porta interna do health server minimalista de worker.ts (GET /health/live, /health/ready).
      # Sem porta pública exigida pelo Render para `type: worker`, mas configure o probe de
      # readiness do orquestrador (quando disponível) para bater aqui.
      - key: WORKER_HEALTH_PORT
        value: "3006"
      # NOTA (documentado, não incluído automaticamente nesta rodada — ver handoff 16 para
      # inventário completo): antes de ativar este serviço para processar filas de verdade, os
      # jobs também dependem de credenciais de provedor específicas por fila — Bitrix
      # (BITRIX24_WEBHOOK_URL), Birth Voices (BIRTH_VOICES_WEBHOOK_SECRET), Groq
      # (GROQ_API_KEY) para os agentes de IA, e as credenciais de storage
      # (STORAGE_*) para o job de PDF semanal. Copie as mesmas do serviço web acima quando este
      # worker for ativado — omitidas aqui de propósito porque as filas que as usam
      # (SDR_COLD_CALL_ENABLED/SWARM_SCHEDULER_ENABLED) começam desligadas.

# Sem bloco `databases:` de propósito — o Postgres é externo (Neon), não provisionado pelo
# Render. Ver docs/deploy/producao.md secao 1 para o projeto e as connection strings (duas roles:
# prospector_app para DDL/migrations via DIRECT_URL, prospector_runtime para tráfego via
# DATABASE_URL).
