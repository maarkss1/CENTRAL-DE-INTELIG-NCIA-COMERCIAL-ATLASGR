services:
  - type: web
    name: prospector-atlas
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: prospector-atlas-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: PROSPECTING_PROVIDER_MODE
        value: hybrid
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BITRIX24_WEBHOOK_URL
        sync: false
      - key: BIRTH_VOICES_WEBHOOK_SECRET
        sync: false
      - key: ENABLE_SEARCH
        value: "false"
      - key: ENABLE_QUEUES
        value: "false"

databases:
  - name: prospector-atlas-db
    plan: starter
