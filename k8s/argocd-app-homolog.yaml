apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prospector-atlas-homolog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/MaarksN/PROSPECTOR-ATLAS.git' # Substitua se não for este o repositório exato do deploy
    targetRevision: develop
    path: charts/prospector-atlas
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prospector-homolog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
