apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  labels:
    app: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: prospector-api
        image: prospector-atlas:latest
        imagePullPolicy: Never # using local docker image for minikube
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: prospector-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
spec:
  selector:
    app: api-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
