<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propostas Atlas — Selecionar Modelo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
:root{
  --atlas-orange:#FF5618; --atlas-orange-2:#FF8008; --atlas-yellow:#FFC500; --atlas-dark:#333333;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Montserrat',Arial,sans-serif;
  background:#eee;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:30px 16px;
}
.hub-card{
  width:100%;max-width:560px;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.18);
}
.hub-header{
  position:relative;background:var(--atlas-orange);color:#fff;padding:38px 36px 30px;overflow:hidden;text-align:center;
}
.hub-header-diagonal{
  position:absolute;inset:0;background:var(--atlas-orange-2);
  clip-path:polygon(62% 0,100% 0,100% 100%,34% 100%);z-index:0;
}
.hub-header > *{position:relative;z-index:1;}
.hub-logo{height:44px;margin-bottom:14px;}
.hub-title{font-size:19px;font-weight:800;letter-spacing:.3px;margin:0 0 4px;}
.hub-subtitle{font-size:12.5px;opacity:.92;}
.hub-body{padding:32px 36px 36px;}
.hub-field{margin-bottom:20px;}
.hub-label{display:block;font-size:12.5px;font-weight:700;color:#333;margin-bottom:7px;letter-spacing:.2px;}
.hub-input{
  width:100%;border:1.6px solid #e4d9d3;border-radius:8px;padding:11px 13px;
  font-family:'Montserrat',Arial,sans-serif;font-size:13.5px;color:#222;background:#fffaf8;
  outline:none;transition:border-color .15s;
}
.hub-input:focus{border-color:var(--atlas-orange);background:#fff;}
.hub-logo-row{display:flex;align-items:center;gap:14px;}
.hub-upload-btn{
  display:inline-flex;align-items:center;gap:8px;border:1.6px dashed #e4a97c;border-radius:8px;
  padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--atlas-orange);background:#fff7f2;
  cursor:pointer;transition:background .15s;
}
.hub-upload-btn:hover{background:#ffece0;}
.hub-upload-btn input{display:none;}
.hub-logo-preview{
  height:46px;width:46px;border-radius:8px;object-fit:contain;background:#f3f3f3;
  border:1px solid #eee;display:none;padding:3px;
}
.hub-select{
  width:100%;border:1.6px solid #e4d9d3;border-radius:8px;padding:11px 13px;
  font-family:'Montserrat',Arial,sans-serif;font-size:13.5px;color:#222;background:#fffaf8 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23FF5618" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 13px center/16px;
  appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;
}
.hub-select:focus{border-color:var(--atlas-orange);}
.hub-open-btn{
  width:100%;background:var(--atlas-orange);color:#fff;border:none;border-radius:8px;
  padding:14px;font-size:14.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;margin-top:6px;
  transition:background .15s,transform .15s;
}
.hub-open-btn:hover{background:#e04710;transform:translateY(-1px);}
.hub-hint{font-size:11px;color:#999;margin-top:9px;text-align:center;}
</style>
</head>

    img.onload = function(){
      var maxW = 220;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      logoDataUrl = canvas.toDataURL('image/png');
      var prev = document.getElementById('hubLogoPreview');
      prev.src = logoDataUrl;
      prev.style.display = 'inline-block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function abrirProposta(){
  var nome = document.getElementById('hubNome').value.trim();
  var cnpj = document.getElementById('hubCnpj').value.trim();
  var arquivo = document.getElementById('hubSelect').value;
  if(logoDataUrl){
    sessionStorage.setItem('atlasLogoDataUrl', logoDataUrl);
  } else {
    sessionStorage.removeItem('atlasLogoDataUrl');
  }
  var url = arquivo + '?';
  var qs = [];
  if(nome) qs.push('nome=' + encodeURIComponent(nome));
  if(cnpj) qs.push('cnpj=' + encodeURIComponent(cnpj));
  url += qs.join('&');
  window.open(url, '_blank');
}
</script>
