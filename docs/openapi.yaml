  /copiloto-ia/conversations/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Copiloto IA]
      summary: Cancela a conversa (qualquer estado → CANCELLED)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /copiloto-ia/conversations/{id}/consent:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Copiloto IA]
      summary: >-
