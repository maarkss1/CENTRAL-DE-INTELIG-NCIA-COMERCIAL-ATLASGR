    get:
      tags: [Bitrix24]
      summary: >-
        Histórico real de sincronização Bitrix24 (webhook de entrada + push/pull automático ou
        manual), tenant-scoped. Backing real do Monitor de Webhooks — corrigido na Onda 1/Roadmap
        v2 (Agente 06); antes o painel chamava um endpoint inexistente e caía para eventos
        fabricados. Ver `.agents/runs/roadmap-v2-onda-1.md`.
      parameters:
        - name: take
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
  /bitrix/extractions:
    get:
