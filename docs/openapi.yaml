                  success: { type: boolean }

  /google/calendar/upcoming:
    get:
      tags: [Google]
      summary: Próximos eventos do Google Calendar conectado
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Cookie de sessão emitido pelo Better Auth no login. Rotas protegidas passam por
        `authenticateToken` (valida a sessão) e `requireTenant` (resolve o organizationId).
        Endpoints marcados com roles (ex. `[ADMIN, GESTOR]`) também exigem `requireRole`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Corpo da requisição inválido (schema Zod rejeitou os dados)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado (ou não pertence ao tenant autenticado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Papel do usuário não tem permissão suficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Limite de requisições excedido (rate limiting por IP/tenant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }

    DataEnvelope:
      type: object
      description: Envelope de resposta genérico usado pela maioria dos endpoints
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta: { type: object, description: 'Presente em listagens paginadas (page, limit, total, etc.)' }

    AIPendingAction:
      type: object
      required: [id, entity, action, payload, riskLevel, approved, executed, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        entity: { type: string, example: Lead }
        action:
          type: string
          enum: [send_email, swarm_recommendation, create_follow_up]
        payload:
          type: object
          additionalProperties: true
        agentRole:
          type: string
          nullable: true
          enum: [SDR, BDR, CLOSER, CRM, OPS, SUPERVISOR]
        riskLevel: { type: string, enum: [low, medium, high] }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        idempotencyKey: { type: string, nullable: true }
        approved: { type: boolean }
        approvedAt: { type: string, format: date-time, nullable: true }
        discardedAt: { type: string, format: date-time, nullable: true }
        executed: { type: boolean }
        executedAt: { type: string, format: date-time, nullable: true }
        executionError: { type: string, nullable: true }
        attempts: { type: integer, minimum: 0 }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        organizationId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── Enums de domínio (espelham src/lib/zod.ts) ──
    CompanyStatus:
      type: string
      enum: [Ativo, Inativo, Em análise]
    LeadStatus:
      type: string
      enum:
        - Lead Recebido
        - Cadência Iniciada
        - Qualificação (SDR)
        - Reunião Agendada
        - Lead Desqualificado
        - Convertido em Oportunidade
        - Nova Oportunidade
        - Proposta Enviada
        - Call/Visita Agendada
        - Negócios Perdidos
        - Negócios Ganhos
    ActivityType:
      type: string
      enum: [Ligação, WhatsApp, E-mail, Reunião, Follow-up, Visita, Tarefa]
    ActivityStatus:
      type: string
      enum: [Pendente, Em andamento, Concluída, Cancelada]
    LeadTemperature:
      type: string
      enum: [Frio, Morno, Quente]
    ContactStatus:
      type: string
      enum: [Ativo, Inativo]

    # ── Auth (Better Auth) ──
    SignUpEmailRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        organizationId:
          type: string
          nullable: true
          description: Reflete o registerSchema do projeto (src/lib/zod.ts); a lib Better Auth também aceita campos adicionais próprios.

    SignInEmailRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    AuthSessionResponse:
      type: object
      description: Formato do Better Auth — não segue o envelope `{success,data}` do resto da API.
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
            role: { type: string, description: 'ADMIN | GESTOR | VENDEDOR | VISUALIZADOR' }
            organizationId: { type: string }
        session:
          type: object
          properties:
            id: { type: string }
            expiresAt: { type: string, format: date-time }

    # ── Company ──
    CompanyInput:
      type: object
      required: [legalName, tradeName]
      properties:
        legalName: { type: string }
        tradeName: { type: string }
        cnpj: { type: string, nullable: true }
        stateRegistration: { type: string, nullable: true }
        segment: { type: string, nullable: true }
        cnae: { type: string, nullable: true }
        size: { type: string, nullable: true }
        employeeCount: { type: integer, nullable: true }
        estimatedRevenue: { type: number, nullable: true }
        website: { type: string, nullable: true }
        linkedin: { type: string, nullable: true }
        instagram: { type: string, nullable: true }
        phones: { type: array, items: { type: string }, default: [] }
        emails: { type: array, items: { type: string }, default: [] }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        zipCode: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/CompanyStatus' }]
          default: Ativo
        tags: { type: array, items: { type: string }, default: [] }
        observations: { type: string, nullable: true }
    CompanyInputPartial:
      allOf:
        - $ref: '#/components/schemas/CompanyInput'
      description: Todos os campos de CompanyInput são opcionais em PUT (`.partial()` no schema Zod)
    Company:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/CompanyInput'
    CompanyResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Company' }
    CompanyListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Company' } }
        meta: { type: object }

    # ── Contact ──
    ContactInput:
      type: object
      required: [name, companyId]
      properties:
        name: { type: string }
        role: { type: string, nullable: true }
        department: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        whatsapp: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        linkedin: { type: string, nullable: true }
        birthDate: { type: string, nullable: true }
        observations: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/ContactStatus' }]
          default: Ativo
        companyId: { type: string }
    ContactInputPartial:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
      description: Todos os campos são opcionais em PUT (`.partial()`)
    Contact:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/ContactInput'
    ContactResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Contact' }
    ContactListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        meta: { type: object }

    # ── Lead ──
    LeadInput:
      type: object
      properties:
        status:
          allOf: [{ $ref: '#/components/schemas/LeadStatus' }]
          default: Lead Recebido
        source: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        temperature:
          allOf: [{ $ref: '#/components/schemas/LeadTemperature' }]
          type: string
          nullable: true
        score: { type: integer, nullable: true }
        owner: { type: string, nullable: true }
        companyId: { type: string, nullable: true }
        contactId: { type: string, nullable: true }
        pic:
          type: string
          nullable: true
          enum: [PIC1_Expansao, PIC2_Risco, PIC3_Transicao]
          description: Perfil de Cliente Ideal do Playbook de Pré-Vendas Atlas
        qualification:
          type: object
          nullable: true
          description: Checklist de qualificação do SDR (Playbook Comercial AtlasGR, seção 4.2) — objeto livre
    LeadInputPartial:
      allOf:
        - $ref: '#/components/schemas/LeadInput'
      description: Todos os campos são opcionais em PUT (`.partial()`)
    Lead:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/LeadInput'
    LeadResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Lead' }
    LeadListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Lead' } }
        meta: { type: object }

    # ── Activity ──
    ActivityInput:
      type: object
      required: [type, owner, date, leadId]
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        owner: { type: string }
        date: { type: string, format: date }
        time: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/ActivityStatus' }]
          default: Pendente
        observations: { type: string, nullable: true }
        leadId: { type: string }
    ActivityInputPartial:
      allOf:
        - $ref: '#/components/schemas/ActivityInput'
      description: Todos os campos são opcionais em PUT (`.partial()`)
    Activity:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/ActivityInput'
    ActivityResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Activity' }
    ActivityListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        meta: { type: object, description: 'Ausente quando a resposta é o modo agenda (from/to)' }

    # ── Note ──
    NoteInput:
      type: object
      required: [content, author]
      properties:
        content: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
    Note:
      allOf:
        - type: object
          properties:
            id: { type: string }
            leadId: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/NoteInput'
    NoteResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Note' }
    NoteListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Note' } }

    # ── Automation ──
    AutomationInput:
      type: object
      description: Formato exato (campos de gatilho/ação) definido em automation.service.ts; consulte GET /api/automations/options para os valores válidos de trigger/action.
      properties:
        name: { type: string }
        trigger: { type: string }
        action: { type: string }
        active: { type: boolean }
        config: { type: object }

    # ── Agent / conversas ──
    ConversationRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 8000 }
        tool:
          type: string
          enum: [copilot, groq, roleplay, objections, qualification, playbook]
        history:
          type: array
          maxItems: 12
          default: []
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 6000 }
    ConversationResponse:
      type: object
      properties:
        success: { type: boolean }
        reply: { type: string }
        model: { type: string }
        mode: { type: string }

    SwarmMissionRequest:
      type: object
      required: [mission]
      properties:
        mission: { type: string, minLength: 1, maxLength: 4000 }
        sessionId: { type: string, maxLength: 200 }
        leadId:
          type: string
          maxLength: 200
          description: Quando presente, permite ao agente SDR do enxame buscar o contexto real do lead no CRM.
