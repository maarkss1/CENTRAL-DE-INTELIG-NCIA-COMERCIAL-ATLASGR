        '404': { $ref: '#/components/responses/NotFound' }

  /copiloto-ia/conversations/{id}/ready:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Copiloto IA]
      summary: Marca a conversa como pronta (transcrição/análise concluídas — PROCESSING → READY)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /copiloto-ia/conversations/{id}/fail:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Copiloto IA]
      summary: Marca a conversa como falha (ex. erro de transcrição — qualquer estado → FAILED)
      responses:
