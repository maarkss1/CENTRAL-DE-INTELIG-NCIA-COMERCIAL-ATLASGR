      summary: Remove um membro da equipe (somente ADMIN)
      responses:
        '200':
          description: Removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

