  /intelligence/agents/sdr/status/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Intelligence]
      summary: Status de uma execução em background do agente SDR de qualificação
      description: >-
        Não segue o DataEnvelope genérico (formato próprio). AI-003 (onda 31): 3 estados possíveis —
        `pending` (nenhum registro ainda, execução em andamento ou não iniciada), `completed`
        (concluída com sucesso, `messages` presente) e `failed` (bloqueio de guardrail LGPD ou erro
        na execução do agente, `error` presente). Antes, `failed` não existia — qualquer falha
        anterior à persistência do resultado deixava a sessão presa em `pending` para sempre.
      responses:
        '200':
          description: Execução concluída (com sucesso ou com falha) — ver `status` no corpo.
          content:
            application/json:
              schema:
                type: object
                required: [status, sessionId]
                properties:
                  status: { type: string, enum: [completed, failed] }
                  sessionId: { type: string }
                  messages: { description: 'Presente quando status=completed.' }
                  error: { type: string, nullable: true, description: 'Presente quando status=failed.' }
        '202':
          description: Ainda não há registro para esta sessão (pendente ou nunca iniciada).
          content:
            application/json:
              schema:
                type: object
                required: [status, sessionId]
                properties:
                  status: { type: string, enum: [pending] }
                  sessionId: { type: string }

  /intelligence/report/latest:
    get:
      tags: [Intelligence]
      summary: Último relatório executivo gerado via IA para o tenant
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /intelligence/win-loss-analysis:
    post:
      tags: [Intelligence]
      summary: Dispara a análise de ganho/perda via IA sob demanda
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Análise enfileirada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: >-
        Stream Server-Sent Events de notificações em tempo real do usuário autenticado. Endpoint
        inline (não um router dedicado) — não segue o envelope `{success,data}` padrão, é um
        stream contínuo `text/event-stream`.
      responses:
        '200':
          description: Stream de eventos SSE, uma conexão por sessão de usuário
          content:
            text/event-stream:
              schema: { type: string }

  /events:
    get:
      tags: [Analytics]
      summary: >-
        Stream Server-Sent Events de eventos comerciais em tempo real do tenant autenticado
        (ADMIN, GESTOR, CLOSER, SDR) — não segue o envelope `{success,data}` padrão, é um stream
        contínuo `text/event-stream` filtrado por `organizationId`.
      responses:
        '200':
          description: Stream de eventos SSE, uma conexão por sessão de usuário
          content:
            text/event-stream:
              schema: { type: string }

  /automations/stagnation-scan:
    post:
      tags: [Automations]
      summary: >-
        Dispara manualmente a varredura de leads estagnados/frios (mesma lógica do cron diário) —
        somente ADMIN, varredura cross-tenant administrativa
      responses:
        '202': { description: Varredura iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /whatsapp/conversations:
    get:
      tags: [WhatsApp]
      summary: Lista as conversas de WhatsApp do tenant com sinais de intenção detectados
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /whatsapp/signals:
    get:
      tags: [WhatsApp]
      summary: Sinais de conversa detectados (conversation intelligence) para o tenant
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /google/disconnect:
    post:
      tags: [Google]
      summary: Desconecta a integração Google (revoga tokens armazenados) do tenant
      responses:
        '200':
          description: Desconectado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /google/calendar/upcoming:
    get:
      tags: [Google]
      summary: Próximos eventos do Google Calendar conectado
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Cookie de sessão emitido pelo Better Auth no login. Rotas protegidas passam por
        `authenticateToken` (valida a sessão) e `requireTenant` (resolve o organizationId).
        Endpoints marcados com roles (ex. `[ADMIN, GESTOR]`) também exigem `requireRole`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Corpo da requisição inválido (schema Zod rejeitou os dados)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado (ou não pertence ao tenant autenticado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Papel do usuário não tem permissão suficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Limite de requisições excedido (rate limiting por IP/tenant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: |
        Envelope de erro padrão, emitido pelo middleware global
        `src/shared/middlewares/errorHandler.ts` (último middleware da cadeia — ver `server.ts`).
        `success`/`error` existem desde a primeira versão da API; `code`, `requestId` e `retryable`
        foram adicionados depois como extensão aditiva (nenhum campo antigo foi removido) para
        cobrir o checklist de contratos do produto. `details` só aparece em alguns casos
        (ex.: `issues` do Zod em erro de validação).
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string, description: 'Mensagem de erro legível, já existente antes da extensão de contrato.' }
        message: { type: string, description: 'Reservado no envelope de resposta; não é populado hoje por `errorHandler.ts`.' }
        details:
          description: 'Detalhe estruturado do erro quando disponível (ex.: `issues` do ZodError).'
        code:
          type: string
          description: |
            Código estável de erro, derivado do status HTTP e do tipo de erro já lançado no
            código (ZodError, `AppError`, `Prisma.PrismaClientKnownRequestError`). Pensado para o
            consumidor decidir programaticamente sem parsear `error`.
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - GONE
            - UNSUPPORTED_MEDIA_TYPE
            - UNPROCESSABLE_ENTITY
            - RATE_LIMITED
            - INTERNAL_ERROR
            - BAD_GATEWAY
            - SERVICE_UNAVAILABLE
            - TIMEOUT
            - BAD_REQUEST
        requestId:
          type: string
          description: |
            Mesmo id de correlação devolvido no header `x-request-id` (ver
            `src/shared/middlewares/observability.ts`) — não é gerado de novo aqui, é o mesmo
            valor reaproveitado. Ausente quando o erro ocorre antes de `observabilityMiddleware`
            rodar na cadeia de middlewares (ex.: falha em rota de auth/webhook montada antes dele).
        retryable:
          type: boolean
          description: |
            `true` para 5xx e timeouts (408/504) — falha transitória do servidor/upstream, repetir
            a mesma requisição pode funcionar. `false` para os demais 4xx (validação, autenticação,
            autorização, conflito, não encontrado) — o pedido em si precisa mudar antes de repetir.

    DataEnvelope:
      type: object
      description: Envelope de resposta genérico usado pela maioria dos endpoints
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta: { type: object, description: 'Presente em listagens paginadas (page, limit, total, etc.)' }

    AIPendingAction:
      type: object
      required: [id, entity, action, payload, riskLevel, approved, executed, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        entity: { type: string, example: Lead }
        action:
          type: string
          enum: [send_email, swarm_recommendation, create_follow_up]
        payload:
          type: object
          additionalProperties: true
        agentRole:
          type: string
          nullable: true
          enum: [SDR, BDR, CLOSER, CRM, OPS, SUPERVISOR]
        riskLevel: { type: string, enum: [low, medium, high] }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        idempotencyKey: { type: string, nullable: true }
        approved: { type: boolean }
        approvedAt: { type: string, format: date-time, nullable: true }
        approvedBy: { type: string, nullable: true, description: 'Id do usuário (User.id) que aprovou — onda 39, trilha de aprovação.' }
        discardedAt: { type: string, format: date-time, nullable: true }
        discardedBy: { type: string, nullable: true, description: 'Id do usuário (User.id) que descartou — onda 39, trilha de aprovação.' }
        executed: { type: boolean }
        executedAt: { type: string, format: date-time, nullable: true }
        executionError: { type: string, nullable: true }
        attempts: { type: integer, minimum: 0 }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        organizationId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── Enums de domínio (espelham src/lib/zod.ts) ──
    CompanyStatus:
      type: string
      enum: [Ativo, Inativo, Em análise]
    LeadStatus:
      type: string
      enum:
        - Lead Recebido
        - Cadência Iniciada
        - Qualificação (SDR)
        - Reunião Agendada
        - Lead Desqualificado
        - Convertido em Oportunidade
        - Nova Oportunidade
        - Proposta Enviada
        - Call/Visita Agendada
        - Piloto VTECH
        - Piloto Atlas Profile
        - Piloto Atlas Profile - Concluído
        - Piloto Atlas Profile - Cancelado
        - Piloto Logística
        - Piloto Logístico - Concluído
        - Piloto Logístico - Cancelado
        - Negócios Perdidos
        - Negócios Ganhos
    ActivityType:
      type: string
      enum: [Ligação, WhatsApp, E-mail, Reunião, Follow-up, Visita, Tarefa]
    ActivityStatus:
      type: string
      enum: [Pendente, Em andamento, Concluída, Cancelada]
    LeadTemperature:
      type: string
      enum: [Frio, Morno, Quente]
    ContactStatus:
      type: string
      enum: [Ativo, Inativo]

    # ── Auth (Better Auth) ──
    SignUpEmailRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        organizationId:
          type: string
          nullable: true
          description: Reflete o registerSchema do projeto (src/lib/zod.ts); a lib Better Auth também aceita campos adicionais próprios.

    SignInEmailRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    AuthSessionResponse:
      type: object
      description: Formato do Better Auth — não segue o envelope `{success,data}` do resto da API.
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
            role: { type: string, description: 'ADMIN | GESTOR | VENDEDOR | VISUALIZADOR' }
            organizationId: { type: string }
        session:
          type: object
          properties:
            id: { type: string }
            expiresAt: { type: string, format: date-time }

    # ── Company ──
    CompanyInput:
      type: object
      required: [legalName, tradeName]
      properties:
        legalName: { type: string }
        tradeName: { type: string }
        cnpj: { type: string, nullable: true }
        stateRegistration: { type: string, nullable: true }
        segment: { type: string, nullable: true }
        cnae: { type: string, nullable: true }
        size: { type: string, nullable: true }
        employeeCount: { type: integer, nullable: true }
        estimatedRevenue: { type: number, nullable: true }
        website: { type: string, nullable: true }
        linkedin: { type: string, nullable: true }
        instagram: { type: string, nullable: true }
        phones: { type: array, items: { type: string }, default: [] }
        emails: { type: array, items: { type: string }, default: [] }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        zipCode: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/CompanyStatus' }]
          default: Ativo
        tags: { type: array, items: { type: string }, default: [] }
        observations: { type: string, nullable: true }
    CompanyInputPartial:
      allOf:
        - $ref: '#/components/schemas/CompanyInput'
      description: Todos os campos de CompanyInput são opcionais em PUT (`.partial()` no schema Zod)
    Company:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/CompanyInput'
    CompanyResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Company' }
    CompanyListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Company' } }
        meta: { type: object }

    # ── Contact ──
    ContactInput:
      type: object
      required: [name, companyId]
      properties:
        name: { type: string }
        role: { type: string, nullable: true }
        department: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        whatsapp: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        linkedin: { type: string, nullable: true }
        birthDate: { type: string, nullable: true }
        observations: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/ContactStatus' }]
          default: Ativo
        companyId: { type: string }
    ContactInputPartial:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
      description: Todos os campos são opcionais em PUT (`.partial()`)
    Contact:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/ContactInput'
    ContactResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Contact' }
    ContactListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        meta: { type: object }

    # ── Lead ──
    LeadInput:
      type: object
      properties:
        status:
          allOf: [{ $ref: '#/components/schemas/LeadStatus' }]
          default: Lead Recebido
        source: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        temperature:
          allOf: [{ $ref: '#/components/schemas/LeadTemperature' }]
          type: string
          nullable: true
        score: { type: integer, nullable: true }
        owner: { type: string, nullable: true }
        companyId: { type: string, nullable: true }
        contactId: { type: string, nullable: true }
        funnel: { type: string, enum: [Lead, Negocio] }
        title: { type: string, maxLength: 180, nullable: true }
        amount: { type: number, minimum: 0, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3 }
        probability: { type: integer, minimum: 0, maximum: 100, nullable: true }
        expectedCloseAt: { type: string, nullable: true }
        pipelineId: { type: string, nullable: true }
        pipelineStageId: { type: string, nullable: true }
        customFields: { type: object, nullable: true, additionalProperties: true }
        pic:
          type: string
          nullable: true
          enum: [PIC1_Expansao, PIC2_Risco, PIC3_Transicao]
          description: Perfil de Cliente Ideal do Playbook de Pré-Vendas Atlas
        qualification:
          type: object
          nullable: true
          description: Checklist de qualificação do SDR (Playbook Comercial AtlasGR, seção 4.2) — objeto livre
    LeadInputPartial:
      allOf:
        - $ref: '#/components/schemas/LeadInput'
      description: Todos os campos são opcionais em PUT (`.partial()`)
    Lead:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/LeadInput'
    LeadResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Lead' }
    LeadListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Lead' } }
        meta: { type: object }

    # ── Activity ──
    ActivityInput:
      type: object
      required: [type, owner, date, leadId]
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        owner: { type: string }
        date: { type: string, format: date }
        time: { type: string, nullable: true }
        status:
          allOf: [{ $ref: '#/components/schemas/ActivityStatus' }]
          default: Pendente
        observations: { type: string, nullable: true }
        leadId: { type: string }
    ActivityInputPartial:
      allOf:
        - $ref: '#/components/schemas/ActivityInput'
      description: Todos os campos são opcionais em PUT (`.partial()`)
    Activity:
      allOf:
        - type: object
          properties:
            id: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/ActivityInput'
    ActivityResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Activity' }
    ActivityListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        meta: { type: object, description: 'Ausente quando a resposta é o modo agenda (from/to)' }

    # ── Note ──
    NoteInput:
      type: object
      required: [content, author]
      properties:
        content: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
    Note:
      allOf:
        - type: object
          properties:
            id: { type: string }
            leadId: { type: string }
            organizationId: { type: string }
            createdAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/NoteInput'
    NoteResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Note' }
    NoteListResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Note' } }

    # ── Automation ──
    AutomationInput:
      type: object
      description: Formato exato (campos de gatilho/ação) definido em automation.service.ts; consulte GET /api/automations/options para os valores válidos de trigger/action.
      properties:
        name: { type: string }
        trigger: { type: string }
        action: { type: string }
        active: { type: boolean }
        config: { type: object }

    # ── Agent / conversas ──
    ConversationRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 8000 }
        tool:
          type: string
          enum: [copilot, groq, roleplay, objections, qualification, playbook]
        history:
          type: array
          maxItems: 12
          default: []
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 6000 }
    ConversationResponse:
      type: object
      properties:
        success: { type: boolean }
        reply: { type: string }
        model: { type: string }
        mode: { type: string }

    SwarmMissionRequest:
      type: object
      required: [mission]
      properties:
        mission: { type: string, minLength: 1, maxLength: 4000 }
        sessionId: { type: string, maxLength: 200 }
        leadId:
          type: string
          maxLength: 200
          description: Quando presente, permite ao agente SDR do enxame buscar o contexto real do lead no CRM.
