  # ───────────────────────────── Copiloto IA ─────────────────────────────
  # Assistente de reunião com captura de áudio, transcrição (Whisper), extração de insights/
  # objeções/concorrentes, sugestões de campo de CRM e writeback real no Bitrix24. Restrito a
  # ADMIN/GESTOR/CLOSER/SDR (`COPILOTO_IA_ROLES`); configurar mapeamento de campo e disparar
  # writeback são restritos a ADMIN/GESTOR (`COPILOTO_IA_MANAGEMENT_ROLES`) — ver
  # copilotoIa.routes.ts.
  /copiloto-ia/conversations:
    post:
      tags: [Copiloto IA]
      summary: Cria uma nova conversa (reunião/ligação) para captura e análise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, enum: [MEET, CALL, WHATSAPP, MANUAL, OTHER] }
                title: { type: string }
                externalMeetingId: { type: string }
                leadId: { type: string }
                companyId: { type: string }
                contactId: { type: string }
      responses:
        '201': { description: Conversa criada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Copiloto IA]
      summary: Lista conversas do tenant, filtráveis por status/lead/empresa/contato
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [SCHEDULED, CAPTURING, PROCESSING, READY, FAILED, CANCELLED] } }
        - { name: leadId, in: query, schema: { type: string } }
        - { name: companyId, in: query, schema: { type: string } }
        - { name: contactId, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

