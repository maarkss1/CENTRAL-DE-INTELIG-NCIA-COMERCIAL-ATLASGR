openapi: 3.0.3
info:
  title: Prospector AtlasGR API
  version: "1.0.0"
  description: |
    Documentação da API do Prospector AtlasGR (CRM comercial + prospecção + IA).

    **Autenticação**: a maioria das rotas exige uma sessão válida do Better Auth,
    enviada via cookie de sessão (`better-auth.session_token`) definido por
    `POST /api/auth/sign-in/email` ou pelo fluxo social (`/api/auth/sign-in/social`).
    As rotas `/api/auth/*` são geridas pela biblioteca `better-auth` e não são
    implementadas manualmente neste projeto — os schemas de request abaixo
    (`SignUpEmailRequest`, `SignInEmailRequest`) refletem os campos aceitos pela
    lib, mas o contrato completo (inclusive `/api/auth/sign-in/social`,
    `/api/auth/sign-out`, `/api/auth/get-session`, etc.) é o padrão do Better Auth.

    **Multi-tenant**: toda rota autenticada (exceto `/api/auth/*`) roda sob
    `requireTenant`, que resolve o `organizationId` da sessão. Recursos operacionais
    são filtrados pelo tenant. O catálogo público oficial de Market Intelligence é
    global e somente leitura para tenants autenticados; ele nunca é misturado à
    entidade `Company` do CRM.

    **Envelope de resposta**: a maior parte dos endpoints devolve
    `{ "success": true, "data": ... }` (e opcionalmente `meta` para paginação) em
    caso de sucesso, ou `{ "success": false, "error": "..." }` em caso de falha.
    Alguns endpoints legados de `/api/intelligence` fogem do padrão e devolvem
    `{ "result": ... }` diretamente — isso está anotado endpoint a endpoint.

    **Fora do escopo deste documento (não são recursos REST descritos como `paths` abaixo, mas
    existem em produção — ver `server.ts`)**:
    - `GET /metrics` — métricas Prometheus (`prom-client`), texto plano, sem autenticação própria.
      Só existe quando `EXPOSE_METRICS=true`.
    - `GET /api-docs` — esta própria documentação (Swagger UI), servida a partir deste arquivo.
      Montada fora de produção por padrão, ou em qualquer ambiente com `EXPOSE_API_DOCS=true`.
    - `/admin/queues` — painel Bull Board de monitoramento de filas (HTML, não JSON). Exige sessão
      válida **e** papel `ADMIN` (`authenticateToken, requireTenant, requireRole(['ADMIN'])`).
      Expõe jobs de todas as organizações (as filas são globais, não por tenant) — risco residual
      documentado em `docs/security/SECURITY_GUIDE.md`.
  contact:
    name: AtlasGR
    email: comercial@atlasgr.com.br

servers:
  - url: /api
    description: Caminho base relativo (mesma origem do frontend)

tags:
  - name: Auth
    description: Cadastro/login/sessão (Better Auth)
  - name: Companies
    description: Empresas do CRM
  - name: Market Intelligence
    description: Universo empresarial oficial, versionado e separado das empresas do CRM
  - name: Contacts
    description: Contatos vinculados a empresas
  - name: Leads
    description: Oportunidades/leads do funil comercial
  - name: Activities
    description: Agenda e atividades vinculadas a leads
  - name: Notes
    description: Anotações vinculadas a um lead
  - name: Prospecting
    description: Descoberta de candidatos (Apollo/IA), enriquecimento de CNPJ e promoção para o CRM
  - name: Intelligence
    description: Geração de conteúdo via IA, toolkit de 20 funções, ações pendentes e configuração de modelo
  - name: Agent
    description: Copiloto de vendas conversacional, TTS e orquestração de agentes (swarm/SDR)
  - name: Prompts
    description: Overrides de prompt por tenant
  - name: Analytics
    description: Métricas agregadas do CRM/pipeline
  - name: Knowledge
    description: Base de conhecimento (RAG) — ingestão e busca híbrida
  - name: Notifications
    description: Notificações in-app do usuário
  - name: Feature Flags
    description: Catálogo de feature flags e override por organização (ligar/desligar funcionalidade sem deploy)
  - name: Bug Reports
    description: Relatos de problema enviados pelo botão flutuante "Reportar problema"
  - name: Automations
    description: Regras de automação (gatilho → ação)
  - name: Usage
    description: Consumo de IA/billing por organização
  - name: Cadence
    description: >-
      Opt-out unificado por canal e execuções de cadência multicanal (e-mail/WhatsApp/voz) —
      leitura para `CadenceHub.tsx`, ver `src/features/cadence/AGENTS.md`
  - name: WhatsApp
    description: Integração WhatsApp (Baileys) por tenant
  - name: Google
    description: Integração Google (OAuth Calendar/Gmail)
  - name: Birth Voice
    description: SDR de voz (Birth Voices Hub) — discagem, campanha fria e lista de bloqueio
  - name: CRM 360
    description: Cockpit CRM — pipelines, quadro Kanban, itens de negócio, produtos e documentos
  - name: Comercial Inteligente
    description: >-
      BI executivo (forecast, aging, perdas, qualidade de CRM, indicadores antecedentes) — módulo
      restrito a ADMIN/GESTOR (`COMMERCIAL_INTELLIGENCE_ROLES`)
  - name: LGPD
    description: >-
      Direitos do titular de dados pessoais (Lei 13.709/2018, Art. 18) — portabilidade e
      eliminação/anonimização
  - name: Equipe
    description: Gestão de usuários da organização — restrito a ADMIN (exceto listagem de atribuíveis)
  - name: Bitrix24
    description: Conexão, sincronização e extração de dados com o Bitrix24 (CRM externo)
  - name: 3CX
    description: Integração com o PABX 3CX (discagem e eventos de chamada)
  - name: Copiloto IA
    description: >-
      Copiloto de IA em tempo real para ligações/reuniões comerciais — captura de áudio,
      transcrição, insights, sugestões de campo de CRM (com writeback opcional ao Bitrix), deal
      health score e avaliação de coaching pós-conversa — restrito a ADMIN/GESTOR/CLOSER/SDR
      (config. de mapeamento e writeback restritos a ADMIN/GESTOR)
  - name: Mesa de Tratamento
    description: Fila de tratamento de leads do Bitrix24 com ranqueamento por prioridade e temperatura
  - name: Playbook
    description: >-
      Matriz de Qualificação (SPIN/BANT/MEDDPICC) e Matriz de Objeções, editáveis por
      organização — consumidas pelas telas do Playbook e pelo Chatbook (assistente, roleplay)
  - name: Webhooks
    description: >-
      Endpoints de entrada de provedores externos, montados ANTES do `express.json()` global —
      corpo cru, autenticidade provada por HMAC ou segredo comparado em tempo constante, nunca por
      sessão de usuário

security:
  - sessionCookie: []

paths:
  /market-intelligence/companies:
    get:
      tags: [Market Intelligence]
      summary: Pesquisa empresas do snapshot CNPJ publicado
      description: Filtros, ordenação e paginação são executados no PostgreSQL. pageSize máximo 200.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cnpj, in: query, schema: { type: string } }
        - { name: razaoSocial, in: query, schema: { type: string, minLength: 2 } }
        - { name: nomeFantasia, in: query, schema: { type: string, minLength: 2 } }
        - { name: cnae, in: query, schema: { type: string } }
        - { name: cnaeScope, in: query, schema: { type: string, enum: [principal, all], default: all } }
        - { name: municipio, in: query, schema: { type: string } }
        - { name: municipioIbge, in: query, schema: { type: string, pattern: '^\d{7}$' } }
        - { name: uf, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: situacaoCadastral, in: query, schema: { type: string, enum: [ATIVA, SUSPENSA, INAPTA, BAIXADA, NULA] } }
        - { name: icpMinimo, in: query, schema: { type: string, enum: [MUITO_ALTO, ALTO, MEDIO, BAIXO, FORA_DO_ICP] } }
        - { name: matrizFilial, in: query, schema: { type: string, enum: [MATRIZ, FILIAL] } }
        - { name: rntrc, in: query, schema: { type: boolean } }
        - { name: porte, in: query, schema: { type: string } }
        - { name: simples, in: query, schema: { type: string, enum: [SIM, NAO, NAO_INFORMADO] } }
        - { name: mei, in: query, schema: { type: string, enum: [SIM, NAO, NAO_INFORMADO] } }
        - { name: capitalSocialMin, in: query, schema: { type: number, minimum: 0 } }
        - { name: capitalSocialMax, in: query, schema: { type: number, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [razaoSocial, nomeFantasia, capitalSocial, icpScore, dataInicioAtividade] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { description: Página de empresas e metadados da competência }
        '400': { description: Filtro inválido }
        '503': { description: Nenhum snapshot READY publicado }
  /market-intelligence/companies/{cnpj}:
    get:
      tags: [Market Intelligence]
      summary: Abre o detalhe empresarial de um CNPJ
      parameters:
        - name: cnpj
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Identificação, CNAE, endereço, contato público, ICP, RNTRC e proveniência }
        '400': { description: CNPJ inválido }
        '404': { description: CNPJ ausente no snapshot publicado }
  /market-intelligence/companies/{cnpj}/approve-to-pipeline:
    parameters:
      - name: cnpj
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Market Intelligence]
      summary: >-
        Promove uma empresa do catálogo público de Market Intelligence para o pipeline comercial
        do tenant (cria/vincula `Company` no CRM) — Agente 18, achado de auditoria: endpoint real,
        sem entrada aqui.
      responses:
        '201':
          description: Empresa aprovada e promovida ao pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400': { description: CNPJ inválido }
  /market-intelligence/data-quality-report:
    get:
      tags: [Market Intelligence]
      summary: >-
        Relatório único de qualidade/proveniência de dados de Account Intelligence do tenant
        (cálculo real contra o banco, não documento estático — ver
        src/features/market-intelligence/server/dataQualityReport.service.ts)
      description: >-
        Consolida sinais já reais e computáveis que antes só existiam dispersos: cobertura de
        contas com AccountIntelligenceSnapshot, distribuição de sourceStatus (crm/enrichment) do
        snapshot mais recente por conta, idade desse snapshot (média/mín/máx) e obsolescência,
        cobertura de IntelligenceEvidence/AccountSignal por tipo, e taxa de DecisionMaker/
        EconomicRelationship verificados vs. não verificados. Cada seção da resposta traz
        `available: boolean` e `reason` quando a população subjacente está vazia — nenhum campo
        numérico é fabricado quando o dado não existe.
      responses:
        '200': { description: Relatório de qualidade de dados agregado do tenant autenticado }

  # ───────────────────────────── Mesa de Tratamento ─────────────────────────────
  /mesa-tratamento/queue:
    get:
      tags: [Mesa de Tratamento]
      summary: Retorna a fila de leads atribuídos para tratamento com ranqueamento por prioridade
      responses:
        '200':
          description: Fila de leads recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  /mesa-tratamento/lead/{id}/register:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Mesa de Tratamento]
      summary: >-
        Registra o resultado de um contato de tratamento (Agente 18, achado de auditoria:
        endpoint real, sem entrada aqui). CLOSER/SDR só registra em leads que são seus. Exige
        Bitrix24 conectado e o lead já vinculado ao Bitrix (`bitrixLeadId`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome:
                  type: string
                  enum: [contato, reuniao_agendada, reuniao_realizada, retorno, convertido, sem_fit, dados_invalidos, revisao]
                note: { type: string }
                bitrixStatusId: { type: string }
                lossReasonId:
                  type: string
                  description: Obrigatório quando `outcome` é `sem_fit` ou `dados_invalidos`
                nextActionTitle: { type: string }
                nextActionWhen: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: Campo obrigatório ausente, ou Bitrix24 não conectado
        '403':
          description: Lead não pertence ao usuário (CLOSER/SDR)
        '404':
          description: Lead não encontrado

  # ───────────────────────────── Auth (better-auth) ─────────────────────────────
  /auth/sign-up/email:
    post:
      tags: [Auth]
      summary: Cadastro por e-mail/senha (Better Auth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpEmailRequest'
      responses:
        '200':
          description: Usuário criado e sessão iniciada (cookie de sessão setado na resposta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/sign-in/email:
    post:
      tags: [Auth]
      summary: Login por e-mail/senha (Better Auth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInEmailRequest'
      responses:
        '200':
          description: Sessão iniciada (cookie de sessão setado na resposta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Credenciais inválidas
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/get-session:
    get:
      tags: [Auth]
      summary: Retorna a sessão atual (via cookie), se houver
      responses:
        '200':
          description: Sessão ativa ou `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'

  /auth/sign-out:
    post:
      tags: [Auth]
      summary: Encerra a sessão atual
      responses:
        '200':
          description: Sessão encerrada

  /auth-extra/welcome-email:
    post:
      tags: [Auth]
      summary: Envia o e-mail de boas-vindas após troca de senha obrigatória
      description: >-
        Disparado pelo próprio usuário logo após trocar com sucesso a senha
        temporária/padrão (não requer ADMIN). Best-effort de propósito: a troca de senha já
        aconteceu e o acesso já está liberado quando isto roda, então uma falha de envio
        (SMTP não configurado, provedor fora do ar) é só registrada em log — a resposta é
        sempre `200 { success: true }`, nunca bloqueia ou reverte o acesso do usuário.
      responses:
        '200':
          description: Sempre retornado, independente de o e-mail ter sido enviado de fato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ───────────────────────────── Companies ─────────────────────────────
  /companies:
    get:
      tags: [Companies]
      summary: Lista empresas do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
    post:
      tags: [Companies]
      summary: Cria uma empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Companies]
      summary: Busca empresa por id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Companies]
      summary: Atualiza parcialmente uma empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInputPartial'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Companies]
      summary: Remove uma empresa (somente ADMIN/GESTOR)
      responses:
        '204':
          description: Removida
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies/{id}/enrich:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Companies]
      summary: Reenriquece uma empresa existente (Receita Federal + heurísticas de domínio/e-mail)
      responses:
        '200':
          description: Empresa enriquecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

  # ───────────────────────────── Contacts ─────────────────────────────
  /contacts:
    get:
      tags: [Contacts]
      summary: Lista contatos (paginado, com busca opcional)
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Busca textual (nome/e-mail/telefone)
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
    post:
      tags: [Contacts]
      summary: Cria um contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Contacts]
      summary: Busca contato por id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Contacts]
      summary: Atualiza parcialmente um contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInputPartial'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
    delete:
      tags: [Contacts]
      summary: Remove um contato (somente ADMIN/GESTOR)
      responses:
        '204':
          description: Removido
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{id}/enrich:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Contacts]
      summary: Enriquece a empresa vinculada ao contato (Receita Federal + Google Negócios + Apollo)
      responses:
        '200':
          description: Resultado do enriquecimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Leads ─────────────────────────────
  /leads:
    get:
      tags: [Leads]
      summary: Lista leads do tenant (paginado/filtrável — filtros aplicados no controller)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
    post:
      tags: [Leads]
      summary: Cria um lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'

  /leads/export/csv:
    get:
      tags: [Leads]
      summary: >-
        Exporta os leads do tenant em CSV, incluindo dados pessoais dos contatos vinculados
        (somente ADMIN/GESTOR — exportação bulk de dado pessoal, minimização de acesso por LGPD)
      responses:
        '200':
          description: Arquivo CSV
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'

  /leads/export/bitrix24:
    post:
      tags: [Leads]
      summary: Exporta leads selecionados para o Bitrix24 (somente ADMIN/GESTOR)
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Resultado da exportação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leads/batch-update:
    post:
      tags: [Leads]
      summary: >-
        Atualiza em lote (status/owner/tags) um conjunto de leads (Agente 18, achado de auditoria:
        endpoint real, sem entrada aqui).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadIds, updates]
              properties:
                leadIds: { type: array, items: { type: string }, minItems: 1 }
                updates:
                  type: object
                  properties:
                    status: { type: string }
                    owner: { type: string }
                    tags: { type: array, items: { type: string } }
                    addTags: { type: array, items: { type: string } }
                    removeTags: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: leadIds ou updates ausente/inválido

  /leads/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Leads]
      summary: Busca lead por id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Leads]
      summary: Atualiza parcialmente um lead (status do funil, qualificação, PIC, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadInputPartial'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'
    delete:
      tags: [Leads]
      summary: Remove um lead (somente ADMIN/GESTOR)
      responses:
        '204':
          description: Removido
        '403':
          $ref: '#/components/responses/Forbidden'

  /leads/{id}/enrich:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Leads]
      summary: Reenriquece um lead já prospectado
      responses:
        '200':
          description: Lead enriquecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'

  /leads/{leadId}/notes:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Notes]
      summary: Lista as notas de um lead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
    post:
      tags: [Notes]
      summary: Cria uma nota no lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'

  /leads/{leadId}/notes/{noteId}:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Notes]
      summary: Remove uma nota
      responses:
        '204':
          description: Removida

  # ───────────────────────────── Activities ─────────────────────────────
  /activities:
    get:
      tags: [Activities]
      summary: Lista atividades — modo "agenda" (range de datas) ou lista paginada
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Junto com `to`, retorna todas as atividades no intervalo (grade do Calendário, sem paginação)
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: leadId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActivityStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ActivityType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
    post:
      tags: [Activities]
      summary: Cria uma atividade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'

  /activities/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Activities]
      summary: Atualiza parcialmente uma atividade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInputPartial'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
    delete:
      tags: [Activities]
      summary: Remove uma atividade
      responses:
        '204':
          description: Removida

  /activities/templates:
    get:
      tags: [Activities]
      summary: >-
        Lista os modelos de follow-up pré-definidos (Agente 18, achado de auditoria: endpoint
        real, sem entrada aqui).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /activities/feed.ics:
    get:
      tags: [Activities]
      summary: >-
        Feed iCalendar (`.ics`) da agenda de atividades do usuário/organização, para assinatura
        em app de calendário externo (Agente 18, achado de auditoria: endpoint real, sem entrada
        aqui).
      parameters:
        - name: owner
          in: query
          description: 'Nome do responsável a filtrar (padrão: usuário autenticado)'
          schema: { type: string }
      responses:
        '200':
          description: Arquivo iCalendar
          content:
            text/calendar:
              schema: { type: string }

  /activities/{id}/snooze:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Activities]
      summary: >-
        Adia (snooze) uma atividade por um intervalo pré-definido (Agente 18, achado de auditoria:
        endpoint real, sem entrada aqui).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration: { type: string, enum: ['2h', tomorrow, next_week], default: tomorrow }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Calendar & Booking ─────────────────────────────
  /calendar/booking-links:
    get:
      tags: [Activities]
      summary: Lista todos os links de agendamento público da organização
      responses:
        '200':
          description: Lista de links de agendamento
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [Activities]
      summary: Cria um novo link público de agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title]
              properties:
                slug:
                  type: string
                title:
                  type: string
                description:
                  type: string
                durationMin:
                  type: integer
      responses:
        '201':
          description: Link criado

  /calendar/booking-links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Activities]
      summary: Ativa ou desativa um link de agendamento existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Link atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Link não encontrado ou sem permissão
    delete:
      tags: [Activities]
      summary: Desativa ou remove um link de agendamento
      responses:
        '200':
          description: Removido

  /calendar/book/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Activities]
      summary: Retorna detalhes públicos de um link de agendamento (host, horários disponíveis)
      responses:
        '200':
          description: Detalhes do link de agendamento
    post:
      tags: [Activities]
      summary: Realiza um agendamento público de reunião com o consultor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, date, time]
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                company:
                  type: string
                date:
                  type: string
                time:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Reunião agendada com sucesso

  # ───────────────────────────── Prospecting ─────────────────────────────
  /prospecting/apollo/reconnect:
    post:
      tags: [Prospecting]
      summary: Revalida a conexão técnica com a Apollo (API key), sem consumir créditos
      responses:
        '200':
          description: Status da conexão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /prospecting/discover:
    post:
      tags: [Prospecting]
      summary: Descoberta de candidatos via IA a partir de um ICP (Perfil de Cliente Ideal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Critérios de busca (ProspectCriteria) — formato livre, definido em prospecting.service.ts
      responses:
        '200':
          description: Lista de candidatos descobertos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/enrich-cnpj:
    post:
      tags: [Prospecting]
      summary: Consulta em tempo real (sem persistir) de um CNPJ na Receita Federal via BrasilAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cnpj]
              properties:
                cnpj: { type: string }
      responses:
        '200':
          description: Dados do CNPJ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/enrich:
    post:
      tags: [Prospecting]
      summary: >-
        Enriquecimento web de uma URL via scraper Crawlee — ainda não implementado. Responde
        501 (não fabrica dados de sucesso; ver achado MEDIUM da auditoria de release-readiness).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          description: Scraper (Crawlee) ainda não implementado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }

  /prospecting/promote:
    post:
      tags: [Prospecting]
      summary: Promove um candidato (IA ou CNPJ) para o CRM — cria Company + Contact + Lead e enriquece automaticamente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tradeName, source]
              properties:
                tradeName: { type: string }
                source: { type: string }
                savedSearchId: { type: string, nullable: true, description: 'Id da SavedSearch cujo candidato está sendo promovido, quando aplicável (onda 40 — rastreabilidade busca→lead).' }
      responses:
        '201':
          description: Recursos criados no CRM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/reject:
    post:
      tags: [Prospecting]
      summary: >-
        Marca um candidato da Descoberta como "não é esse perfil" — passa a ser excluído de
        buscas futuras deste tenant (Agente 18, achado de auditoria: endpoint real, sem entrada
        aqui).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: Candidato marcado como rejeitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }

  /prospecting/companies/{id}/enrich-cascade:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Prospecting]
      summary: >-
        Enriquecimento em cascata de uma empresa (Apollo → Hunter → Google Places), Agente 18,
        achado de auditoria: endpoint real, sem entrada aqui. Com `async: true` no corpo e fila
        disponível, enfileira o job em vez de rodar de forma síncrona.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                async: { type: boolean, default: false }
      responses:
        '200':
          description: Resultado do enriquecimento (síncrono)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '202':
          description: Enfileirado (modo assíncrono)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  jobId: { type: string }

  /prospecting/saved-searches:
    get:
      tags: [Prospecting]
      summary: >-
        Lista as buscas salvas de prospecção da organização autenticada (Agente 18, achado de
        auditoria: endpoint real, sem entrada aqui).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Prospecting]
      summary: >-
        Cria uma busca salva de prospecção, com agendamento opcional (Agente 18, achado de
        auditoria: endpoint real, sem entrada aqui).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                criteria: { type: object }
                schedule: { type: string, enum: [daily, weekly] }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: name ausente

  /prospecting/saved-searches/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Prospecting]
      summary: >-
        Remove uma busca salva de prospecção da organização autenticada (Agente 18, achado de
        auditoria: endpoint real, sem entrada aqui).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }

  /prospecting/saved-searches/{id}/run:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Prospecting]
      summary: >-
        Executa manualmente (fora do agendamento) uma busca salva de prospecção (Agente 18,
        achado de auditoria: endpoint real, sem entrada aqui).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Busca salva não encontrada

  /prospecting/searches/{searchId}:
    parameters:
      - name: searchId
        in: path
        required: true
        schema: { type: string }
        description: >-
          Search-ID (cuid) de uma execução real de busca de prospecção, devolvido em
          `data.searchId` pelas respostas de /prospecting/discover e
          /prospecting/saved-searches/{id}/run.
    get:
      tags: [Prospecting]
      summary: >-
        Onda 42 (dossiê CPI, DEC-13, opção A): consulta uma EXECUÇÃO de busca específica pelo
        Search-ID — critério usado, providers chamados (em ordem, com resultado e custo de cada
        um), total de resultados, status e timestamps. Sempre escopado ao tenant autenticado.
      responses:
        '200':
          description: Execução de busca encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Execução de busca não encontrada (ou pertence a outro tenant)

  /prospecting/decision-makers:
    post:
      tags: [Prospecting]
      summary: Busca decisores (contatos-chave) para uma empresa específica, por domínio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                criteria: { type: object }
      responses:
        '200':
          description: Decisores encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/icebreaker:
    post:
      tags: [Prospecting]
      summary: Gera um quebra-gelo comercial sob demanda a partir de recortes públicos reais da empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName]
              properties:
                companyName: { type: string }
      responses:
        '200':
          description: Texto do quebra-gelo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      icebreaker: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/status:
    get:
      tags: [Prospecting]
      summary: Status de configuração das ferramentas standalone de prospecção (Google Places, Apollo, Hunter, GitHub, Notícias, YouTube) — só booleano, nunca a chave
      responses:
        '200':
          description: Status de configuração por provedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /prospecting/tools/google-places:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — descoberta de empresas só via Google Places (New) Text Search, sem Apollo/OpenStreetMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Mesmo formato de /prospecting/discover (ProspectCriteria)
      responses:
        '200':
          description: Candidatos encontrados via Google Places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/apollo:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — descoberta de empresas só via Apollo Organization Search, sem Google Places/OpenStreetMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Mesmo formato de /prospecting/discover (ProspectCriteria)
      responses:
        '200':
          description: Candidatos encontrados via Apollo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/hunter:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — descoberta de pessoas só via Hunter.io Domain Search, sem Apollo People Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                limit: { type: integer }
      responses:
        '200':
          description: Contatos encontrados via Hunter.io
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/hunter/verify-email:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — verifica/encontra o e-mail de UMA pessoa já identificada, via Hunter.io Email Finder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, fullName]
              properties:
                domain: { type: string }
                fullName: { type: string }
      responses:
        '200':
          description: E-mail encontrado (ou null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/github:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — busca organizações no GitHub (Search API pública, gratuita, sem chave)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                limit: { type: integer }
      responses:
        '200':
          description: Organizações encontradas no GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/github/profile:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — perfil completo de UMA organização do GitHub já identificada, para salvar no CRM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string }
      responses:
        '200':
          description: Perfil da organização (ou null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/news:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — menções recentes de imprensa sobre uma empresa via GDELT, gratuito e sem chave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName]
              properties:
                companyName: { type: string }
      responses:
        '200':
          description: Menções encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/youtube:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — metadados públicos (oEmbed) de UM vídeo do YouTube já conhecido, gratuito e sem chave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '200':
          description: Metadados do vídeo (ou null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ───────────────────────────── Intelligence ─────────────────────────────
  /intelligence/chatbook/history:
    get:
      tags: [Intelligence]
      summary: >-
        Histórico de mensagens do Chatbook (assistente conversacional) do usuário, por marca
        (Agente 18, achado de auditoria: endpoint real, sem entrada aqui).
      parameters:
        - name: brand
          in: query
          required: true
          schema: { type: string, enum: [atlasgr, totaltrac] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: brand ausente ou inválido

  /intelligence/studio/stream:
    post:
      tags: [Intelligence]
      summary: >-
        Streaming (SSE) do Chatbook — mesma entrada de `/intelligence/studio`, mas só o `kind`
        "assistant" (texto livre), transmitido em chunks (Agente 18, achado de auditoria:
        endpoint real, sem entrada aqui). Grava o turno de usuário+assistente no histórico ao
        final da resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brandKey, inputs]
              properties:
                brandKey: { type: string, enum: [atlasgr, totaltrac] }
                inputs:
                  type: object
                  properties:
                    question: { type: string }
      responses:
        '200':
          description: 'Stream `text/event-stream`, terminando em `event: end`'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: brandKey ausente

  /intelligence/studio:
    post:
      tags: [Intelligence]
      summary: Gera um artefato de IA Studio (e-mail, matriz B2B, roteiro de treinamento etc. — union discriminada por `kind`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, brand, inputs]
              description: Discriminated union por `kind` (email, b2b_matrix, training_script, ...) — ver studio.service.ts
              properties:
                kind: { type: string }
                brand: { type: object }
                inputs: { type: object }
      responses:
        '200':
          description: 'Artefato gerado. Observação: este endpoint não usa o envelope `{success,data}` padrão, e sim `{ "result": ... }`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: object }

  /intelligence:
    post:
      tags: [Intelligence]
      summary: Gera conteúdo comercial via IA para uma ferramenta específica (e-mail, script, matriz, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool: { type: string, maxLength: 80 }
                leadId: { type: string, maxLength: 100 }
                competitor: { type: string, maxLength: 200 }
                tone: { type: string, maxLength: 80 }
                objective: { type: string, maxLength: 100 }
                personaFallback: { type: string, maxLength: 200 }
                brandId: { type: string, enum: [atlasgr, totaltrac], default: atlasgr }
      responses:
        '200':
          description: 'Conteúdo gerado. Observação: devolve `{ "result": ... }`, não o envelope padrão.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string }
        '400':
          description: Ferramenta inválida ou concorrente ausente

  /intelligence/qualify:
    post:
      tags: [Intelligence]
      summary: Enfileira a qualificação assíncrona de um lead (worker de IA via BullMQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadId]
              properties:
                leadId: { type: string }
                companyInfo:
                  type: string
                  description: Opcional — quando ausente, o worker busca os dados reais da empresa no CRM.
      responses:
        '202':
          description: Job enfileirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  jobId: { type: string }
        '400':
          description: leadId ausente

  /intelligence/agents/sdr/qualify:
    post:
      tags: [Intelligence]
      summary: Dispara o agente SDR de qualificação para um lead (execução assíncrona em background)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [leadId]
              properties:
                leadId: { type: string }
                sessionId: { type: string }
      responses:
        '202':
          description: Agente iniciado em background
        '400':
          description: leadId ausente

  /intelligence/search:
    get:
      tags: [Intelligence]
      summary: Busca vetorial (RAG) sobre a base de conhecimento do tenant
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: 'Resultados da busca vetorial (`{ results: [...] }`, sem o envelope padrão)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object } }
        '400':
          description: Query ausente ou longa demais

  /intelligence/pending:
    get:
      tags: [Intelligence]
      summary: Lista ações de IA pendentes de aprovação humana (AIPendingAction)
      responses:
        '200':
          description: 'Lista de ações pendentes (array puro, sem envelope)'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AIPendingAction' }

  /intelligence/pending/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Intelligence]
      summary: Aprova e executa uma ação de IA pendente (e-mail, nota de recomendação ou follow-up)
      responses:
        '200':
          description: Ação aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /intelligence/pending/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Intelligence]
      summary: Descarta uma ação de IA pendente preservando o registro de auditoria
      responses:
        '204':
          description: Descartada
        '404':
          $ref: '#/components/responses/NotFound'

  /intelligence/ai-settings:
    get:
      tags: [Intelligence]
      summary: Lista a configuração de provider/modelo/temperatura por ferramenta de IA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    put:
      tags: [Intelligence]
      summary: >-
        Salva a configuração de provider/modelo/temperatura por ferramenta de IA (somente ADMIN —
        mais restrito que o padrão ADMIN/GESTOR usado no resto da API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  items:
                    type: object
                    required: [toolKey, provider, model, temperature]
                    properties:
                      toolKey: { type: string }
                      provider: { type: string }
                      model:
                        type: string
                        enum: [local-llama3, local-llama3-fast, qwen-coder, deepseek-coder]
                      temperature: { type: number, minimum: 0, maximum: 2 }
      responses:
        '200':
          description: Configuração salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /intelligence/report:
    post:
      tags: [Intelligence]
      summary: Gera uma leitura executiva em Markdown a partir de métricas já calculadas (ex. `/api/analytics/overview`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metrics]
              properties:
                metrics: { type: object }
                brandId: { type: string, enum: [atlasgr, totaltrac], default: atlasgr }
      responses:
        '200':
          description: 'Relatório em Markdown (`{ "result": "..." }`, sem envelope padrão)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string }

  /intelligence/report/stream:
    post:
      tags: [Intelligence]
      summary: >-
        Mesma leitura executiva de `/intelligence/report`, em streaming (SSE) em vez de resposta
        única (Agente 18, achado de auditoria: endpoint real, sem entrada aqui).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metrics]
              properties:
                metrics: { type: object }
                brandId: { type: string, enum: [atlasgr, totaltrac], default: atlasgr }
      responses:
        '200':
          description: 'Stream `text/event-stream`, terminando em `event: end`'
          content:
            text/event-stream:
              schema:
                type: string

  /intelligence/toolkit/execute:
    post:
      tags: [Intelligence]
      summary: Executa uma das 20 funções do AI Toolkit (summarizeLead, generateEmailDraft, scoreLeadQuality, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [functionName, args]
              properties:
                functionName:
                  type: string
                  description: Nome de uma função do toolkit (ver src/lib/ai/features.ts)
                args:
                  type: array
                  items: { type: string }
                  description: Argumentos de texto — a aridade exata varia por função
                piiValues:
                  type: array
                  description: >-
                    Opcional. Valores de PII conhecidos pelo chamador (ex.: nome do contato de um
                    lead) a minimizar no texto antes de ir ao provedor de IA externo e restaurar na
                    resposta — mesmo padrão usado nos demais endpoints de IA. Sem isso, o texto em
                    `args` vai integralmente ao provedor externo, já que estas funções recebem
                    texto livre sem um campo estruturado de PII.
                  items:
                    type: object
                    required: [token, value]
                    properties:
                      token: { type: string, description: 'Placeholder que substitui o valor, ex.: "[NOME_DO_CONTATO]"' }
                      value: { type: string, nullable: true }
      responses:
        '200':
          description: Resultado da função
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: Função desconhecida ou aridade de argumentos incorreta

  # ───────────────────────────── Agent (copiloto/voz/swarm) ─────────────────────────────
  /agent/chat:
    post:
      tags: [Agent]
      summary: Copiloto de vendas conversacional (modo padrão/objeções)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/groq:
    post:
      tags: [Agent]
      summary: Assistente de consulta rápida (sem contexto de base interna)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/roleplay:
    post:
      tags: [Agent]
      summary: Simulação de comprador B2B para treino de objeções
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/qualification:
    post:
      tags: [Agent]
      summary: Gera de 4 a 6 perguntas de qualificação (SPIN/BANT) para o vendedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/tts:
    post:
      tags: [Agent]
      summary: Converte texto em áudio (Voicebox TTS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Áudio WAV
          content:
            audio/wav:
              schema:
                type: string
                format: binary

  /agent/swarm/mission:
    post:
      tags: [Agent]
      summary: Executa uma missão síncrona do enxame de agentes (supervisor + sub-agentes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwarmMissionRequest'
      responses:
        '200':
          description: Mensagens produzidas pelo enxame
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /agent/swarm/stream:
    post:
      tags: [Agent]
      summary: Executa uma missão do enxame de agentes com streaming (Server-Sent Events)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwarmMissionRequest'
      responses:
        '200':
          description: 'Stream `text/event-stream` de eventos da missão, terminando em `event: end`'
          content:
            text/event-stream:
              schema:
                type: string

  /agent/swarm/learn:
    post:
      tags: [Agent]
      summary: Roda o agente de aprendizado contínuo, refletindo sobre ações recentes do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, organizationId]
              properties:
                userId: { type: string }
                organizationId: { type: string }
      responses:
        '200':
          description: Diretrizes aprendidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  learnedGuidelines: { type: string }

  /agent/swarm/learn/history:
    get:
      tags: [Agent]
      summary: >-
        Histórico versionado do perfil de estilo aprendido pelo LearningAgent (todas as versões +
        qual está ativa) do (tenant, usuário) autenticado — GOV-13, onda 39. Ver
        `.agents/handoffs/onda-39/13-para-07-rota-rollback-learning-profile.md`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      activeVersion: { type: integer }
                      lastAuditLogAt: { type: string, nullable: true, format: date-time }
                      versions:
                        type: array
                        items:
                          type: object
                          properties:
                            version: { type: integer }
                            guidelines: { type: string }
                            createdAt: { type: string, format: date-time }
                            metrics: { type: object }

  /agent/swarm/learn/rollback:
    post:
      tags: [Agent]
      summary: >-
        Reverte o perfil de estilo aprendido do (tenant, usuário) autenticado para uma versão
        anterior já existente no histórico — nunca apaga nem sobrescreve versões, só move o
        ponteiro ativo. GOV-13, onda 39.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetVersion]
              properties:
                targetVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Rollback aplicado (ou já era a versão ativa)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
                      activeVersion: { type: integer }
                      guidelines: { type: string }
        '400':
          description: 'Corpo inválido (`targetVersion` ausente ou menor que 1)'
        '404':
          description: Versão pedida não existe no histórico deste perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }

  /agent/swarm/slo:
    get:
      tags: [Agent]
      summary: >-
        Snapshot de SLO (latência/sucesso/custo) do enxame de agentes nos últimos N dias (Agente
        18, achado de auditoria: endpoint real, sem entrada aqui — a rota nunca tinha sido
        registrada, ver `.agents/handoffs/onda-7/13-para-07-rota-slo-swarm.md`). Não usa o
        envelope `{success,data}` padrão — devolve o snapshot diretamente.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400':
          description: 'Query inválida (`days` fora do intervalo 1-90)'

  /agent/evaluation-metrics:
    get:
      tags: [Agent]
      summary: >-
        Snapshot das 9 dimensões de avaliação (harness AI-006) do enxame de agentes nos últimos N
        dias (Agente 18, achado de auditoria: endpoint real, sem entrada aqui). Não usa o envelope
        `{success,data}` padrão — devolve o snapshot diretamente.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400':
          description: 'Query inválida (`days` fora do intervalo 1-90)'

  /agent/golden-dataset/summary:
    get:
      tags: [Agent]
      summary: >-
        Resumo do Golden Dataset versionado (AI-005) e validação dos casos de uso de ferramentas
        (Agente 18, achado de auditoria: endpoint real, sem entrada aqui). Não usa o envelope
        `{success,data}` padrão.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { type: object }
                  toolUseValidation: { type: object }

  # ───────────────────────────── Prompts ─────────────────────────────
  /prompts:
    get:
      tags: [Prompts]
      summary: Lista os prompts (overrides) do tenant autenticado
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Prompts]
      summary: Cria um novo prompt override (somente ADMIN/GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                category: { type: string }
                variables: { type: object }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /prompts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Prompts]
      summary: Atualiza as variáveis de um prompt existente do tenant (somente ADMIN/GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables: { type: object }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Analytics ─────────────────────────────
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Visão geral usada pelo LiveStatsWidget (home) e pelo relatório executivo por IA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Dashboard completo da tela de Analytics, numa única requisição
      parameters:
        - name: months
          in: query
          schema: { type: integer, minimum: 3, maximum: 24, default: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /analytics/cohort:
    get:
      tags: [Analytics]
      summary: >-
        Análise de retenção por cohort mensal, tenant-scoped (`AnalyticsUseCases.cohortAnalysis`).
        Corrigido na Onda 2/Roadmap v2 (Agente 04) — antes devolvia uma lista fixa de exemplo
        ("Fake data just for the prototype"); ver
        `.agents/runs/roadmap-v2-onda-2.md`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [cohorts]
                    properties:
                      cohorts:
                        type: array
                        items:
                          type: object
                          properties:
                            month: { type: string, example: '2026-07' }
                            total: { type: integer, example: 200 }
                            month1: { type: integer, example: 90 }
                            month2: { type: integer, example: 80 }

  /analytics/export/csv:
    get:
      tags: [Analytics]
      summary: >-
        Exporta o mesmo relatório de cohort (`/analytics/cohort`) em CSV real. Renomeado de
        `/analytics/export/pdf` na Onda 2/Roadmap v2 (Agente 04) — a rota antiga devolvia um
        `Buffer` fixo (`PDF_FAKE_CONTENT_FOR_NOW`) sob `Content-Type: application/pdf`, nunca um
        PDF válido; CSV é o formato honesto já usado pelo mesmo padrão de export em
        `commercial-intelligence` (sem biblioteca de geração de PDF disponível no projeto). Ver
        `.agents/runs/roadmap-v2-onda-2.md`.
      responses:
        '200':
          description: Arquivo CSV (`text/csv`) com o mesmo conteúdo de `/analytics/cohort`
          content:
            text/csv:
              schema: { type: string }

  # ───────────────────────────── Knowledge ─────────────────────────────
  /knowledge:
    get:
      tags: [Knowledge]
      summary: Lista os documentos da base de conhecimento do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Knowledge]
      summary: Ingesta um documento a partir de texto colado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                content: { type: string, minLength: 1, maxLength: 400000 }
      responses:
        '201':
          description: Documento criado e indexado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /knowledge/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Knowledge]
      summary: Retorna um documento completo, com conteúdo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Knowledge]
      summary: Edita título e/ou conteúdo do documento (reindexa se o conteúdo mudou)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                content: { type: string, maxLength: 400000 }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Knowledge]
      summary: >-
        Remove um documento (somente ADMIN/GESTOR — mais restrito que os demais endpoints deste
        router, que aceitam também VENDEDOR)
      responses:
        '204':
          description: Removido
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge/upload:
    post:
      tags: [Knowledge]
      summary: Ingesta um documento a partir de um arquivo (base64) — .txt, .md, .csv, .json ou .docx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, data]
              properties:
                fileName: { type: string, minLength: 1, maxLength: 255 }
                data: { type: string, description: Conteúdo do arquivo em base64 }
                title: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Documento criado e indexado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /knowledge/search:
    post:
      tags: [Knowledge]
      summary: Busca híbrida (vetorial + texto) na base de conhecimento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 500 }
                limit: { type: integer, minimum: 1, maximum: 25 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /knowledge/{id}/reembed:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Knowledge]
      summary: Regera vetores/embeddings que faltaram na ingestão original
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /knowledge/editor-assist:
    post:
      tags: [Knowledge]
      summary: >-
        Assistente de redação via IA (expandir/resumir/reescrever focando em dores) para o editor
        de documentos da base de conhecimento (Agente 18, achado de auditoria: endpoint real, sem
        entrada aqui). Não usa o envelope `{success,data}` padrão, e sim `{ "success", "result" }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, text]
              properties:
                action: { type: string, enum: [expand, concise, pain] }
                text: { type: string, minLength: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  result: { type: string }

  /knowledge/generate-faq:
    post:
      tags: [Knowledge]
      summary: >-
        Gera um FAQ via IA a partir de um documento já ingerido na base de conhecimento (Agente
        18, achado de auditoria: endpoint real, sem entrada aqui).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Documento não encontrado

  # ───────────────────────────── Notifications ─────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: Lista notificações do usuário autenticado
      parameters:
        - name: unread
          in: query
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { type: object } }
                      unread: { type: integer }

  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Notifications]
      summary: Marca uma notificação como lida
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marca todas as notificações do usuário como lidas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      count: { type: integer }

  /notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Notifications]
      summary: Remove uma notificação
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Feature Flags ─────────────────────────────
  /feature-flags:
    get:
      tags: [Feature Flags]
      summary: Lista os flags resolvidos (default global + override da própria organização já aplicado)
      description: Qualquer papel autenticado pode ler.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: bug_report_module }
                        description: { type: string }
                        enabled: { type: boolean }
                        isOverridden: { type: boolean }

  /feature-flags/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Feature Flags]
      summary: Liga/desliga o flag para a própria organização do ADMIN autenticado
      description: Restrito a ADMIN. Nunca altera o default global do catálogo, só o override do tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Feature Flags]
      summary: Remove o override da organização, revertendo ao default global
      description: Restrito a ADMIN.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Bug Reports ─────────────────────────────
  /bug-reports:
    post:
      tags: [Bug Reports]
      summary: Registra um relato de problema (botão flutuante "Reportar problema")
      description: |
        Qualquer papel autenticado pode reportar. Limitado por organização
        (`BUG_REPORT_RATE_LIMIT_MAX`, default 10/15min). O campo `context` é
        sanitizado no backend (redação de token/segredo, truncamento) antes de
        persistir — ver `src/features/bug-reports/domain/bugReport.sanitize.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 5000 }
                severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: MEDIUM }
                context:
                  type: object
                  description: Capturado automaticamente pelo frontend (URL, user agent, viewport, últimos logs)
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, example: OPEN }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Bug Reports]
      summary: Lista os relatos da própria organização
      description: Restrito a ADMIN/GESTOR.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, TRIAGED, RESOLVED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bug-reports/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Bug Reports]
      summary: Atualiza o status de triagem de um relato (OPEN → TRIAGED → RESOLVED)
      description: Restrito a ADMIN/GESTOR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, TRIAGED, RESOLVED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Automations ─────────────────────────────
  /automations/options:
    get:
      tags: [Automations]
      summary: Lista os gatilhos e ações disponíveis, para montar os selects da tela
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      triggers: { type: array, items: { type: string } }
                      actions: { type: array, items: { type: string } }

  /automations:
    get:
      tags: [Automations]
      summary: Lista as automações do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Automations]
      summary: Cria uma automação (gatilho → ação)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /automations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Automations]
      summary: Atualiza parcialmente uma automação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationInput'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Automations]
      summary: Remove uma automação
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'

  /automations/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Automations]
      summary: >-
        Histórico de versões da regra (Onda 42, dossiê CPI DEC-14 opção A): estado atual mais uma
        linha de tempo de edições anteriores (quem/quando trocou, e o diff textual campo a campo
        até o estado seguinte), mais recente primeiro. Restrito a ADMIN/GESTOR — revela histórico
        de configuração comercial da automação.
      responses:
        '200':
          description: >-
            OK. `data` é `{ automationId, current: { name, enabled, trigger, conditions, action,
            actionConfig }, currentUpdatedAt, history: [{ id, editedAt, editedByUserId,
            editedByEmail, changeReason: 'update'|'delete', snapshot: {...}, diffToNext: [{ field,
            before, after }] }] }`. `history` vazio quando a regra nunca foi editada desde a
            criação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /automations/{id}/dry-run:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Automations]
      summary: >-
        Simula a regra contra uma amostra dos dados reais e atuais da organização, sem executar
        nenhuma ação de verdade (Onda 42, dossiê CPI DEC-14 opção A) — nenhum e-mail, atividade ou
        ligação é disparado. Restrito a ADMIN/GESTOR — lê uma amostra de leads/atividades reais da
        organização.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  description: Tamanho da amostra de registros candidatos. Padrão 25, teto 100.
                  minimum: 1
                  maximum: 100
      responses:
        '200':
          description: >-
            OK. `data` é `{ automationId, automationName, trigger, action, enabled, generatedAt,
            sampleSize, matchedCount, wouldFireCount, methodologyNote, records: [{ entity:
            'Lead'|'Activity', entityId, label, outcome: { action, wouldFire, blockedReason?,
            details } }] }`. `wouldFire` reflete o mesmo critério de bloqueio do motor real
            (janela comercial, opt-out, config inválida etc.) sem produzir nenhum efeito colateral.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Usage / Billing ─────────────────────────────
  /usage:
    get:
      tags: [Usage]
      summary: Consumo de IA da organização (custo, tokens, chamadas) numa janela de dias
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /gamification/coaching/weekly:
    post:
      tags: [Gamification]
      summary: >-
        Gera o coaching semanal por IA do vendedor autenticado, a partir de dados reais de
        atividades e negócios (Piloto 007, .claude/PILOTS.md) — nunca de outro vendedor, o nome
        usado vem sempre da sessão autenticada.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: >-
                    Função de vendas informada manualmente pelo próprio usuário (opcional, não
                    persistida) — não existe campo de função de vendas no cadastro do usuário.
                  enum:
                    - SDR / Hunter
                    - Closer / Executivo de Contas
                    - Account Manager / Farmer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Cadence ─────────────────────────────
  /cadence/opt-outs:
    get:
      tags: [Cadence]
      summary: Lista os registros de opt-out (por canal ou global) da organização autenticada
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /cadence/templates:
    get:
      tags: [Cadence]
      summary: >-
        Lista os modelos de jornada de cadência pré-definidos (Agente 18, achado de auditoria:
        endpoint real, sem entrada aqui — `CADENCE_JOURNEY_TEMPLATES`, catálogo estático no
        código, não por tenant).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /cadence/sequences:
    get:
      tags: [Cadence]
      summary: >-
        Lista as sequências de cadência ativas da organização autenticada (Agente 18, achado de
        auditoria: endpoint real, sem entrada aqui).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Cadence]
      summary: >-
        Cria uma sequência de cadência (1 a 10 toques) para a organização autenticada (Agente 18,
        achado de auditoria: endpoint real, sem entrada aqui). Restrito a
        ADMIN/GESTOR/CLOSER/SDR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, touches]
              properties:
                name: { type: string, maxLength: 160 }
                touches:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [order, channel, delayHoursFromPrevious]
                    properties:
                      order: { type: integer, minimum: 1 }
                      channel: { type: string, enum: [email, whatsapp, voice] }
                      delayHoursFromPrevious: { type: integer, minimum: 0, maximum: 720 }
                      maxAttempts: { type: integer, minimum: 1, maximum: 5 }
                      templateRef: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: Sequência inválida (ver regras de `validateSequence`)

  /cadence/sequences/from-template/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Cadence]
      summary: >-
        Cria uma sequência de cadência a partir de um modelo de jornada pré-definido (Agente 18,
        achado de auditoria: endpoint real, sem entrada aqui). Restrito a
        ADMIN/GESTOR/CLOSER/SDR.
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Modelo de jornada não encontrado

  /cadence/sequences/{id}/deactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Cadence]
      summary: >-
        Desativa uma sequência de cadência da organização autenticada. Restrito a
        ADMIN/GESTOR/CLOSER/SDR.
      responses:
        '200':
          description: Sequência desativada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Sequência não encontrada nesta organização

  /cadence/runs:
    get:
      tags: [Cadence]
      summary: Lista as execuções de cadência (ativas/pausadas/encerradas) da organização autenticada
      parameters:
        - name: status
          in: query
          description: 'Filtro opcional por status, separado por vírgula (ex.: Active,Paused)'
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Cadence]
      summary: >-
        Inicia uma execução de cadência para um lead a partir de uma sequência (Agente 18, achado
        de auditoria: endpoint real, sem entrada aqui — pré-requisito para o runtime de
        `cadenceRun.worker.ts` ter efeito prático). Restrito a ADMIN/GESTOR/CLOSER/SDR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadId, sequenceId]
              properties:
                leadId: { type: string }
                sequenceId: { type: string }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Lead ou sequência não encontrados nesta organização
        '409':
          description: Este lead já tem uma cadência ativa em andamento

  /cadence/runs/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cadence]
      summary: >-
        Pausa manualmente uma execução de cadência ativa (CYC-009). Idempotente: pausar um run que
        não está `active` devolve o run inalterado, nunca lança erro.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Execução não encontrada nesta organização

  /cadence/runs/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cadence]
      summary: >-
        Retoma manualmente uma execução de cadência pausada (CYC-009). Idempotente: retomar um run
        que não está `paused` devolve o run inalterado, nunca lança erro. Nunca reabre um run já
        `stopped` (opt-out/resposta/parada manual são definitivos por design).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Execução não encontrada nesta organização

  /cadence/runs/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cadence]
      summary: >-
        Para manualmente uma execução de cadência (CYC-009) — diferente de pausar, é definitivo
        (`stopReason: manual-stop`), nunca retomável.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Execução não encontrada nesta organização

  /cadence/leads/{leadId}/schedule-meeting:
    post:
      tags: [Cadence]
      summary: >-
        Confirma manualmente um horário de reunião com o lead (CYC-004) — só aceita confirmação
        verificável (`evidenceType: manual-verified`, nunca inferência de IA sobre o texto de uma
        mensagem). Cria uma Note de evidência real e um `CadenceCalendarEvent`. A criação do evento
        real no Google Calendar é um stub de transporte nesta rodada (nenhum provedor externo
        chamado ainda) — o `googleEventId` devolvido é sintético.
      parameters:
        - name: leadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposedStart, proposedEnd]
              properties:
                proposedStart: { type: string, format: date-time }
                proposedEnd: { type: string, format: date-time }
      responses:
        '201':
          description: Reunião confirmada e agendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Lead não encontrado nesta organização
        '422':
          description: Confirmação não verificável (horário no passado, ou fim antes do início)

  # ───────────────────────────── WhatsApp ─────────────────────────────
  /whatsapp/messages:
    get:
      tags: [WhatsApp]
      summary: Histórico de mensagens persistidas (de um lead, ou as mais recentes do tenant)
      parameters:
        - name: leadId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /whatsapp/connect:
    post:
      tags: [WhatsApp]
      summary: Inicia a sessão do WhatsApp do tenant e gera QR Code
      responses:
        '200':
          description: Solicitação de conexão enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /whatsapp/status:
    get:
      tags: [WhatsApp]
      summary: Status da sessão do WhatsApp do tenant (conectado/desconectado/QR Code)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /whatsapp/disconnect:
    post:
      tags: [WhatsApp]
      summary: Desconecta a sessão do WhatsApp do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /whatsapp/send:
    post:
      tags: [WhatsApp]
      summary: Envia uma mensagem pela sessão do tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, text]
              properties:
                number: { type: string }
                text: { type: string }
      responses:
        '200':
          description: Enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  # ───────────────────────────── Google ─────────────────────────────
  /google/auth-url:
    get:
      tags: [Google]
      summary: Gera a URL de autenticação OAuth do Google
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  url: { type: string }

  /google/callback:
    get:
      tags: [Google]
      summary: >-
        Processa o callback OAuth do Google. Observação de contrato (corrigida em 2026-08-15,
        Onda 8): este endpoint NUNCA devolve JSON — sempre um redirect 302 para o frontend
        (`/app?google=connected` em sucesso, `/app?google=error&message=...` em falha).
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: >-
            Redireciona para `/app?google=connected` (sucesso) ou `/app?google=error&message=...`
            (falha) — nunca um corpo JSON, mesmo em erro.

  /google/status:
    get:
      tags: [Google]
      summary: Status da integração Google
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Birth Voice (SDR de voz) ─────────────────────────────
  /integrations/birth-voice/cold-call/status:
    get:
      tags: [Birth Voice]
      summary: Status da campanha de prospecção fria (discagem automática) para o tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

