  # ───────────────────────────── LGPD (direitos do titular) ─────────────────────────────
  /lgpd/titular/{contactId}/export:
    parameters:
      - name: contactId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [LGPD]
      summary: >-
        Portabilidade de dados do titular (LGPD Art. 18 V) — exporta todos os dados pessoais
        vinculados ao contato. Base legal: exercício de direito do titular.
      responses:
        '200':
          description: Dados do titular (formato definido em `lgpdService.exportContactData`)
          content:
            application/json:
              schema: { type: object }

  /lgpd/titular/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [LGPD]
      summary: >-
        Eliminação/anonimização do titular (LGPD Art. 18 VI) — irreversível. Somente ADMIN/GESTOR.
        Base legal: exercício de direito do titular. `organizationId` vem exclusivamente da sessão
        autenticada, nunca de header do cliente (mitiga anonimização cross-tenant).
      responses:
        '200':
          description: Titular anonimizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { type: object }
        '403':
          $ref: '#/components/responses/Forbidden'

  /lgpd/audit-logs:
    get:
      tags: [LGPD]
      summary: >-
        Lista os logs de auditoria de segurança/LGPD da organização autenticada (Agente 18, achado
        de auditoria: endpoint real, sem entrada aqui). Somente ADMIN/GESTOR.
      parameters:
        - name: limit
          in: query
          description: Máximo de registros (padrão 50, teto 100)
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  logs: { type: array, items: { type: object } }
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────────────────────────── Equipe ─────────────────────────────
  /team/assignable:
    get:
      tags: [Equipe]
      summary: >-
        Nome/id dos membros da organização, para reatribuir lead/atividade — qualquer usuário
        autenticado (não exige ADMIN; sem e-mail nem papel no retorno, por design)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      owners: { type: array, items: { type: object } }

  /team:
    get:
      tags: [Equipe]
      summary: Lista os membros da organização com papel e e-mail (somente ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Equipe]
      summary: Cria um novo usuário na organização com senha temporária (somente ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string }
      responses:
        '201':
          description: >-
            Criado. A senha temporária só existe nesta resposta — nunca é persistida em texto
            puro nem devolvida de novo depois.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      member: { type: object }
                      tempPassword: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /team/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Equipe]
      summary: Reseta a senha de um membro da equipe (somente ADMIN)
      responses:
        '200':
          description: >-
            Nova senha temporária (mesma regra de não persistência/reexibição do POST /team acima)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      member: { type: object }
                      tempPassword: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /team/{id}/unlock:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Equipe]
      summary: Desbloqueia um membro da equipe travado por excesso de tentativas de login (somente ADMIN)
      responses:
        '200':
          description: Desbloqueado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      member: { type: object }
        '403':
          $ref: '#/components/responses/Forbidden'

  /team/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Equipe]
      summary: Remove um membro da equipe (somente ADMIN)
      responses:
        '200':
          description: Removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

