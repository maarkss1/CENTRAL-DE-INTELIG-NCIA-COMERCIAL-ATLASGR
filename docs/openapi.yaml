openapi: 3.0.3
info:
  title: Prospector AtlasGR API
  version: "1.0.0"
  description: |
    Documentação da API do Prospector AtlasGR (CRM comercial + prospecção + IA).

    **Autenticação**: a maioria das rotas exige uma sessão válida do Better Auth,
    enviada via cookie de sessão (`better-auth.session_token`) definido por
    `POST /api/auth/sign-in/email` ou pelo fluxo social (`/api/auth/sign-in/social`).
    As rotas `/api/auth/*` são geridas pela biblioteca `better-auth` e não são
    implementadas manualmente neste projeto — os schemas de request abaixo
    (`SignUpEmailRequest`, `SignInEmailRequest`) refletem os campos aceitos pela
    lib, mas o contrato completo (inclusive `/api/auth/sign-in/social`,
    `/api/auth/sign-out`, `/api/auth/get-session`, etc.) é o padrão do Better Auth.

    **Multi-tenant**: toda rota autenticada (exceto `/api/auth/*`) roda sob
    `requireTenant`, que resolve o `organizationId` da sessão. Recursos operacionais
    são filtrados pelo tenant. O catálogo público oficial de Market Intelligence é
    global e somente leitura para tenants autenticados; ele nunca é misturado à
    entidade `Company` do CRM.

    **Envelope de resposta**: a maior parte dos endpoints devolve
    `{ "success": true, "data": ... }` (e opcionalmente `meta` para paginação) em
    caso de sucesso, ou `{ "success": false, "error": "..." }` em caso de falha.
    Alguns endpoints legados de `/api/intelligence` fogem do padrão e devolvem
    `{ "result": ... }` diretamente — isso está anotado endpoint a endpoint.

    **Fora do escopo deste documento (não são recursos REST descritos como `paths` abaixo, mas
    existem em produção — ver `server.ts`)**:
    - `GET /metrics` — métricas Prometheus (`prom-client`), texto plano, sem autenticação própria.
      Só existe quando `EXPOSE_METRICS=true`.
    - `GET /api-docs` — esta própria documentação (Swagger UI), servida a partir deste arquivo.
      Montada fora de produção por padrão, ou em qualquer ambiente com `EXPOSE_API_DOCS=true`.
    - `/admin/queues` — painel Bull Board de monitoramento de filas (HTML, não JSON). Exige sessão
      válida **e** papel `ADMIN` (`authenticateToken, requireTenant, requireRole(['ADMIN'])`).
      Expõe jobs de todas as organizações (as filas são globais, não por tenant) — risco residual
      documentado em `docs/security/SECURITY_GUIDE.md`.
  contact:
    name: AtlasGR
    email: comercial@atlasgr.com.br

servers:
  - url: /api
    description: Caminho base relativo (mesma origem do frontend)

tags:
  - name: Auth
    description: Cadastro/login/sessão (Better Auth)
  - name: Companies
    description: Empresas do CRM
  - name: Market Intelligence
    description: Universo empresarial oficial, versionado e separado das empresas do CRM
  - name: Contacts
    description: Contatos vinculados a empresas
  - name: Leads
    description: Oportunidades/leads do funil comercial
  - name: Activities
    description: Agenda e atividades vinculadas a leads
  - name: Notes
    description: Anotações vinculadas a um lead
  - name: Prospecting
    description: Descoberta de candidatos (Apollo/IA), enriquecimento de CNPJ e promoção para o CRM
  - name: Intelligence
    description: Geração de conteúdo via IA, toolkit de 20 funções, ações pendentes e configuração de modelo
  - name: Agent
    description: Copiloto de vendas conversacional, TTS e orquestração de agentes (swarm/SDR)
  - name: Prompts
    description: Overrides de prompt por tenant
  - name: Analytics
    description: Métricas agregadas do CRM/pipeline
  - name: Knowledge
    description: Base de conhecimento (RAG) — ingestão e busca híbrida
  - name: Notifications
    description: Notificações in-app do usuário
  - name: Feature Flags
    description: Catálogo de feature flags e override por organização (ligar/desligar funcionalidade sem deploy)
  - name: Bug Reports
    description: Relatos de problema enviados pelo botão flutuante "Reportar problema"
  - name: Automations
    description: Regras de automação (gatilho → ação)
  - name: Usage
    description: Consumo de IA/billing por organização
  - name: Cadence
    description: >-
      Opt-out unificado por canal e execuções de cadência multicanal (e-mail/WhatsApp/voz) —
      leitura para `CadenceHub.tsx`, ver `src/features/cadence/AGENTS.md`
  - name: WhatsApp
    description: Integração WhatsApp (Baileys) por tenant
  - name: Google
    description: Integração Google (OAuth Calendar/Gmail)
  - name: Birth Voice
    description: SDR de voz (Birth Voices Hub) — discagem, campanha fria e lista de bloqueio
  - name: CRM 360
    description: Cockpit CRM — pipelines, quadro Kanban, itens de negócio, produtos e documentos
  - name: Comercial Inteligente
    description: >-
      BI executivo (forecast, aging, perdas, qualidade de CRM, indicadores antecedentes) — módulo
      restrito a ADMIN/GESTOR (`COMMERCIAL_INTELLIGENCE_ROLES`)
  - name: LGPD
    description: >-
      Direitos do titular de dados pessoais (Lei 13.709/2018, Art. 18) — portabilidade e
      eliminação/anonimização
  - name: Equipe
    description: Gestão de usuários da organização — restrito a ADMIN (exceto listagem de atribuíveis)
  - name: Bitrix24
    description: Conexão, sincronização e extração de dados com o Bitrix24 (CRM externo)
  - name: 3CX
    description: Integração com o PABX 3CX (discagem e eventos de chamada)
  - name: Mesa de Tratamento
    description: Fila de tratamento de leads do Bitrix24 com ranqueamento por prioridade e temperatura
  - name: Webhooks
    description: >-
      Endpoints de entrada de provedores externos, montados ANTES do `express.json()` global —
      corpo cru, autenticidade provada por HMAC ou segredo comparado em tempo constante, nunca por
      sessão de usuário

security:
  - sessionCookie: []

paths:
  /market-intelligence/companies:
    get:
      tags: [Market Intelligence]
      summary: Pesquisa empresas do snapshot CNPJ publicado
      description: Filtros, ordenação e paginação são executados no PostgreSQL. pageSize máximo 200.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cnpj, in: query, schema: { type: string } }
        - { name: razaoSocial, in: query, schema: { type: string, minLength: 2 } }
        - { name: nomeFantasia, in: query, schema: { type: string, minLength: 2 } }
        - { name: cnae, in: query, schema: { type: string } }
        - { name: cnaeScope, in: query, schema: { type: string, enum: [principal, all], default: all } }
        - { name: municipio, in: query, schema: { type: string } }
        - { name: municipioIbge, in: query, schema: { type: string, pattern: '^\d{7}$' } }
        - { name: uf, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: situacaoCadastral, in: query, schema: { type: string, enum: [ATIVA, SUSPENSA, INAPTA, BAIXADA, NULA] } }
        - { name: icpMinimo, in: query, schema: { type: string, enum: [MUITO_ALTO, ALTO, MEDIO, BAIXO, FORA_DO_ICP] } }
        - { name: matrizFilial, in: query, schema: { type: string, enum: [MATRIZ, FILIAL] } }
        - { name: rntrc, in: query, schema: { type: boolean } }
        - { name: porte, in: query, schema: { type: string } }
        - { name: simples, in: query, schema: { type: string, enum: [SIM, NAO, NAO_INFORMADO] } }
        - { name: mei, in: query, schema: { type: string, enum: [SIM, NAO, NAO_INFORMADO] } }
        - { name: capitalSocialMin, in: query, schema: { type: number, minimum: 0 } }
        - { name: capitalSocialMax, in: query, schema: { type: number, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [razaoSocial, nomeFantasia, capitalSocial, icpScore, dataInicioAtividade] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { description: Página de empresas e metadados da competência }
        '400': { description: Filtro inválido }
        '503': { description: Nenhum snapshot READY publicado }
  /market-intelligence/companies/{cnpj}:
    get:
      tags: [Market Intelligence]
      summary: Abre o detalhe empresarial de um CNPJ
      parameters:
        - name: cnpj
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Identificação, CNAE, endereço, contato público, ICP, RNTRC e proveniência }
        '400': { description: CNPJ inválido }
        '404': { description: CNPJ ausente no snapshot publicado }
  /market-intelligence/territories:
    get:
      tags: [Market Intelligence]
      summary: Agrega a base empresarial real e o RNTRC territorial por município
      parameters:
        - { name: uf, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: municipioIbge, in: query, schema: { type: string, pattern: '^\d{7}$' } }
      responses:
        '200': { description: Hierarquia Brasil, região, UF e município com contagens empresariais e indicador RNTRC municipal rotulado separadamente }
  /market-intelligence/rankings:
    get:
      tags: [Market Intelligence]
      summary: Ranking municipal por indicador disponível
      parameters:
        - { name: metric, in: query, schema: { type: string, enum: [EMPRESAS_ATIVAS, EMPRESAS_ICP, RNTRC_EMPRESARIAL, RNTRC_TERRITORIAL] } }
        - { name: uf, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Ranking sem score fabricado }
  /market-intelligence/sources:
    get:
      tags: [Market Intelligence]
      summary: Lista fontes, competências, hashes e status dos snapshots
      responses:
        '200': { description: Histórico de importações e snapshot ativo }

  # ───────────────────────────── Mesa de Tratamento ─────────────────────────────
  /mesa-tratamento/queue:
    get:
      tags: [Mesa de Tratamento]
      summary: Retorna a fila de leads atribuídos para tratamento com ranqueamento por prioridade
      responses:
        '200':
          description: Fila de leads recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object

  # ───────────────────────────── Auth (better-auth) ─────────────────────────────
  /auth/sign-up/email:
    post:
      tags: [Auth]
      summary: Cadastro por e-mail/senha (Better Auth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpEmailRequest'
      responses:
        '200':
          description: Usuário criado e sessão iniciada (cookie de sessão setado na resposta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/sign-in/email:
    post:
      tags: [Auth]
      summary: Login por e-mail/senha (Better Auth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInEmailRequest'
      responses:
        '200':
          description: Sessão iniciada (cookie de sessão setado na resposta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Credenciais inválidas
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/get-session:
    get:
      tags: [Auth]
      summary: Retorna a sessão atual (via cookie), se houver
      responses:
        '200':
          description: Sessão ativa ou `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'

  /auth/sign-out:
    post:
      tags: [Auth]
      summary: Encerra a sessão atual
      responses:
        '200':
          description: Sessão encerrada

  /auth-extra/welcome-email:
    post:
      tags: [Auth]
      summary: Envia o e-mail de boas-vindas após troca de senha obrigatória
      description: >-
        Disparado pelo próprio usuário logo após trocar com sucesso a senha
        temporária/padrão (não requer ADMIN). Best-effort de propósito: a troca de senha já
        aconteceu e o acesso já está liberado quando isto roda, então uma falha de envio
        (SMTP não configurado, provedor fora do ar) é só registrada em log — a resposta é
        sempre `200 { success: true }`, nunca bloqueia ou reverte o acesso do usuário.
      responses:
        '200':
          description: Sempre retornado, independente de o e-mail ter sido enviado de fato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ───────────────────────────── Companies ─────────────────────────────
  /companies:
    get:
      tags: [Companies]
      summary: Lista empresas do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
    post:
      tags: [Companies]
      summary: Cria uma empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Companies]
      summary: Busca empresa por id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Companies]
      summary: Atualiza parcialmente uma empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInputPartial'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Companies]
      summary: Remove uma empresa (somente ADMIN/GESTOR)
      responses:
        '204':
          description: Removida
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies/{id}/enrich:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Companies]
      summary: Reenriquece uma empresa existente (Receita Federal + heurísticas de domínio/e-mail)
      responses:
        '200':
          description: Empresa enriquecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

  # ───────────────────────────── Contacts ─────────────────────────────
  /contacts:
    get:
      tags: [Contacts]
      summary: Lista contatos (paginado, com busca opcional)
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Busca textual (nome/e-mail/telefone)
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
    post:
      tags: [Contacts]
      summary: Cria um contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Contacts]
      summary: Busca contato por id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Contacts]
      summary: Atualiza parcialmente um contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInputPartial'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
    delete:
      tags: [Contacts]
      summary: Remove um contato (somente ADMIN/GESTOR)
      responses:
        '204':
          description: Removido
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{id}/enrich:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Contacts]
      summary: Enriquece a empresa vinculada ao contato (Receita Federal + Google Negócios + Apollo)
      responses:
        '200':
          description: Resultado do enriquecimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Leads ─────────────────────────────
  /leads:
    get:
      tags: [Leads]
      summary: Lista leads do tenant (paginado/filtrável — filtros aplicados no controller)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
    post:
      tags: [Leads]
      summary: Cria um lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadInput'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'

  /leads/export/csv:
    get:
      tags: [Leads]
      summary: >-
        Exporta os leads do tenant em CSV, incluindo dados pessoais dos contatos vinculados
        (somente ADMIN/GESTOR — exportação bulk de dado pessoal, minimização de acesso por LGPD)
      responses:
        '200':
          description: Arquivo CSV
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'

  /leads/export/bitrix24:
    post:
      tags: [Leads]
      summary: Exporta leads selecionados para o Bitrix24 (somente ADMIN/GESTOR)
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Resultado da exportação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leads/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Leads]
      summary: Busca lead por id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Leads]
      summary: Atualiza parcialmente um lead (status do funil, qualificação, PIC, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadInputPartial'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'
    delete:
      tags: [Leads]
      summary: Remove um lead (somente ADMIN/GESTOR)
      responses:
        '204':
          description: Removido
        '403':
          $ref: '#/components/responses/Forbidden'

  /leads/{id}/enrich:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Leads]
      summary: Reenriquece um lead já prospectado
      responses:
        '200':
          description: Lead enriquecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadResponse'

  /leads/{leadId}/notes:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Notes]
      summary: Lista as notas de um lead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
    post:
      tags: [Notes]
      summary: Cria uma nota no lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'

  /leads/{leadId}/notes/{noteId}:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Notes]
      summary: Remove uma nota
      responses:
        '204':
          description: Removida

  # ───────────────────────────── Activities ─────────────────────────────
  /activities:
    get:
      tags: [Activities]
      summary: Lista atividades — modo "agenda" (range de datas) ou lista paginada
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Junto com `to`, retorna todas as atividades no intervalo (grade do Calendário, sem paginação)
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: leadId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActivityStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ActivityType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
    post:
      tags: [Activities]
      summary: Cria uma atividade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'

  /activities/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Activities]
      summary: Atualiza parcialmente uma atividade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInputPartial'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
    delete:
      tags: [Activities]
      summary: Remove uma atividade
      responses:
        '204':
          description: Removida

  # ───────────────────────────── Prospecting ─────────────────────────────
  /prospecting/apollo/reconnect:
    post:
      tags: [Prospecting]
      summary: Revalida a conexão técnica com a Apollo (API key), sem consumir créditos
      responses:
        '200':
          description: Status da conexão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /prospecting/discover:
    post:
      tags: [Prospecting]
      summary: Descoberta de candidatos via IA a partir de um ICP (Perfil de Cliente Ideal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Critérios de busca (ProspectCriteria) — formato livre, definido em prospecting.service.ts
      responses:
        '200':
          description: Lista de candidatos descobertos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/enrich-cnpj:
    post:
      tags: [Prospecting]
      summary: Consulta em tempo real (sem persistir) de um CNPJ na Receita Federal via BrasilAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cnpj]
              properties:
                cnpj: { type: string }
      responses:
        '200':
          description: Dados do CNPJ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/promote:
    post:
      tags: [Prospecting]
      summary: Promove um candidato (IA ou CNPJ) para o CRM — cria Company + Contact + Lead e enriquece automaticamente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tradeName, source]
              properties:
                tradeName: { type: string }
                source: { type: string }
      responses:
        '201':
          description: Recursos criados no CRM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/decision-makers:
    post:
      tags: [Prospecting]
      summary: Busca decisores (contatos-chave) para uma empresa específica, por domínio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                criteria: { type: object }
      responses:
        '200':
          description: Decisores encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/icebreaker:
    post:
      tags: [Prospecting]
      summary: Gera um quebra-gelo comercial sob demanda a partir de recortes públicos reais da empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName]
              properties:
                companyName: { type: string }
      responses:
        '200':
          description: Texto do quebra-gelo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      icebreaker: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/status:
    get:
      tags: [Prospecting]
      summary: Status de configuração das ferramentas standalone de prospecção (Google Places, Apollo, Hunter) — só booleano, nunca a chave
      responses:
        '200':
          description: Status de configuração por provedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /prospecting/tools/google-places:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — descoberta de empresas só via Google Places (New) Text Search, sem Apollo/OpenStreetMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Mesmo formato de /prospecting/discover (ProspectCriteria)
      responses:
        '200':
          description: Candidatos encontrados via Google Places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/apollo:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — descoberta de empresas só via Apollo Organization Search, sem Google Places/OpenStreetMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Mesmo formato de /prospecting/discover (ProspectCriteria)
      responses:
        '200':
          description: Candidatos encontrados via Apollo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/hunter:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — descoberta de pessoas só via Hunter.io Domain Search, sem Apollo People Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                limit: { type: integer }
      responses:
        '200':
          description: Contatos encontrados via Hunter.io
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /prospecting/tools/hunter/verify-email:
    post:
      tags: [Prospecting]
      summary: Ferramenta standalone — verifica/encontra o e-mail de UMA pessoa já identificada, via Hunter.io Email Finder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, fullName]
              properties:
                domain: { type: string }
                fullName: { type: string }
      responses:
        '200':
          description: E-mail encontrado (ou null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ───────────────────────────── Intelligence ─────────────────────────────
  /intelligence/studio:
    post:
      tags: [Intelligence]
      summary: Gera um artefato de IA Studio (e-mail, matriz B2B, roteiro de treinamento etc. — union discriminada por `kind`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, brand, inputs]
              description: Discriminated union por `kind` (email, b2b_matrix, training_script, ...) — ver studio.service.ts
              properties:
                kind: { type: string }
                brand: { type: object }
                inputs: { type: object }
      responses:
        '200':
          description: 'Artefato gerado. Observação: este endpoint não usa o envelope `{success,data}` padrão, e sim `{ "result": ... }`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: object }

  /intelligence:
    post:
      tags: [Intelligence]
      summary: Gera conteúdo comercial via IA para uma ferramenta específica (e-mail, script, matriz, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool: { type: string, maxLength: 80 }
                leadId: { type: string, maxLength: 100 }
                competitor: { type: string, maxLength: 200 }
                tone: { type: string, maxLength: 80 }
                objective: { type: string, maxLength: 100 }
                personaFallback: { type: string, maxLength: 200 }
                brandId: { type: string, enum: [atlasgr, totaltrac], default: atlasgr }
      responses:
        '200':
          description: 'Conteúdo gerado. Observação: devolve `{ "result": ... }`, não o envelope padrão.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string }
        '400':
          description: Ferramenta inválida ou concorrente ausente

  /intelligence/qualify:
    post:
      tags: [Intelligence]
      summary: Enfileira a qualificação assíncrona de um lead (worker de IA via BullMQ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadId]
              properties:
                leadId: { type: string }
                companyInfo:
                  type: string
                  description: Opcional — quando ausente, o worker busca os dados reais da empresa no CRM.
      responses:
        '202':
          description: Job enfileirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  jobId: { type: string }
        '400':
          description: leadId ausente

  /intelligence/agents/sdr/qualify:
    post:
      tags: [Intelligence]
      summary: Dispara o agente SDR de qualificação para um lead (execução assíncrona em background)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [leadId]
              properties:
                leadId: { type: string }
                sessionId: { type: string }
      responses:
        '202':
          description: Agente iniciado em background
        '400':
          description: leadId ausente

  /intelligence/search:
    get:
      tags: [Intelligence]
      summary: Busca vetorial (RAG) sobre a base de conhecimento do tenant
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: 'Resultados da busca vetorial (`{ results: [...] }`, sem o envelope padrão)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object } }
        '400':
          description: Query ausente ou longa demais

  /intelligence/pending:
    get:
      tags: [Intelligence]
      summary: Lista ações de IA pendentes de aprovação humana (AIPendingAction)
      responses:
        '200':
          description: 'Lista de ações pendentes (array puro, sem envelope)'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AIPendingAction' }

  /intelligence/pending/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Intelligence]
      summary: Aprova e executa uma ação de IA pendente (e-mail, nota de recomendação ou follow-up)
      responses:
        '200':
          description: Ação aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /intelligence/pending/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Intelligence]
      summary: Descarta uma ação de IA pendente preservando o registro de auditoria
      responses:
        '204':
          description: Descartada
        '404':
          $ref: '#/components/responses/NotFound'

  /intelligence/ai-settings:
    get:
      tags: [Intelligence]
      summary: Lista a configuração de provider/modelo/temperatura por ferramenta de IA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    put:
      tags: [Intelligence]
      summary: >-
        Salva a configuração de provider/modelo/temperatura por ferramenta de IA (somente ADMIN —
        mais restrito que o padrão ADMIN/GESTOR usado no resto da API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  items:
                    type: object
                    required: [toolKey, provider, model, temperature]
                    properties:
                      toolKey: { type: string }
                      provider: { type: string }
                      model:
                        type: string
                        enum: [local-llama3, local-llama3-fast, qwen-coder, deepseek-coder]
                      temperature: { type: number, minimum: 0, maximum: 2 }
      responses:
        '200':
          description: Configuração salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /intelligence/report:
    post:
      tags: [Intelligence]
      summary: Gera uma leitura executiva em Markdown a partir de métricas já calculadas (ex. `/api/analytics/overview`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metrics]
              properties:
                metrics: { type: object }
                brandId: { type: string, enum: [atlasgr, totaltrac], default: atlasgr }
      responses:
        '200':
          description: 'Relatório em Markdown (`{ "result": "..." }`, sem envelope padrão)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string }

  /intelligence/toolkit/execute:
    post:
      tags: [Intelligence]
      summary: Executa uma das 20 funções do AI Toolkit (summarizeLead, generateEmailDraft, scoreLeadQuality, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [functionName, args]
              properties:
                functionName:
                  type: string
                  description: Nome de uma função do toolkit (ver src/lib/ai/features.ts)
                args:
                  type: array
                  items: { type: string }
                  description: Argumentos de texto — a aridade exata varia por função
                piiValues:
                  type: array
                  description: >-
                    Opcional. Valores de PII conhecidos pelo chamador (ex.: nome do contato de um
                    lead) a minimizar no texto antes de ir ao provedor de IA externo e restaurar na
                    resposta — mesmo padrão usado nos demais endpoints de IA. Sem isso, o texto em
                    `args` vai integralmente ao provedor externo, já que estas funções recebem
                    texto livre sem um campo estruturado de PII.
                  items:
                    type: object
                    required: [token, value]
                    properties:
                      token: { type: string, description: 'Placeholder que substitui o valor, ex.: "[NOME_DO_CONTATO]"' }
                      value: { type: string, nullable: true }
      responses:
        '200':
          description: Resultado da função
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: Função desconhecida ou aridade de argumentos incorreta

  # ───────────────────────────── Agent (copiloto/voz/swarm) ─────────────────────────────
  /agent/chat:
    post:
      tags: [Agent]
      summary: Copiloto de vendas conversacional (modo padrão/objeções)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/groq:
    post:
      tags: [Agent]
      summary: Assistente de consulta rápida (sem contexto de base interna)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/roleplay:
    post:
      tags: [Agent]
      summary: Simulação de comprador B2B para treino de objeções
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/qualification:
    post:
      tags: [Agent]
      summary: Gera de 4 a 6 perguntas de qualificação (SPIN/BANT) para o vendedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /agent/tts:
    post:
      tags: [Agent]
      summary: Converte texto em áudio (Voicebox TTS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Áudio WAV
          content:
            audio/wav:
              schema:
                type: string
                format: binary

  /agent/swarm/mission:
    post:
      tags: [Agent]
      summary: Executa uma missão síncrona do enxame de agentes (supervisor + sub-agentes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwarmMissionRequest'
      responses:
        '200':
          description: Mensagens produzidas pelo enxame
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /agent/swarm/stream:
    post:
      tags: [Agent]
      summary: Executa uma missão do enxame de agentes com streaming (Server-Sent Events)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwarmMissionRequest'
      responses:
        '200':
          description: 'Stream `text/event-stream` de eventos da missão, terminando em `event: end`'
          content:
            text/event-stream:
              schema:
                type: string

  /agent/swarm/learn:
    post:
      tags: [Agent]
      summary: Roda o agente de aprendizado contínuo, refletindo sobre ações recentes do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, organizationId]
              properties:
                userId: { type: string }
                organizationId: { type: string }
      responses:
        '200':
          description: Diretrizes aprendidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  learnedGuidelines: { type: string }

  # ───────────────────────────── Prompts ─────────────────────────────
  /prompts:
    get:
      tags: [Prompts]
      summary: Lista os prompts (overrides) do tenant autenticado
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Prompts]
      summary: Cria um novo prompt override (somente ADMIN/GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                category: { type: string }
                variables: { type: object }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /prompts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Prompts]
      summary: Atualiza as variáveis de um prompt existente do tenant (somente ADMIN/GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables: { type: object }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Analytics ─────────────────────────────
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Visão geral usada pelo LiveStatsWidget (home) e pelo relatório executivo por IA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Dashboard completo da tela de Analytics, numa única requisição
      parameters:
        - name: months
          in: query
          schema: { type: integer, minimum: 3, maximum: 24, default: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Knowledge ─────────────────────────────
  /knowledge:
    get:
      tags: [Knowledge]
      summary: Lista os documentos da base de conhecimento do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Knowledge]
      summary: Ingesta um documento a partir de texto colado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                content: { type: string, minLength: 1, maxLength: 400000 }
      responses:
        '201':
          description: Documento criado e indexado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /knowledge/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Knowledge]
      summary: Retorna um documento completo, com conteúdo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Knowledge]
      summary: Edita título e/ou conteúdo do documento (reindexa se o conteúdo mudou)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                content: { type: string, maxLength: 400000 }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Knowledge]
      summary: >-
        Remove um documento (somente ADMIN/GESTOR — mais restrito que os demais endpoints deste
        router, que aceitam também VENDEDOR)
      responses:
        '204':
          description: Removido
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge/upload:
    post:
      tags: [Knowledge]
      summary: Ingesta um documento a partir de um arquivo (base64) — .txt, .md, .csv, .json ou .docx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, data]
              properties:
                fileName: { type: string, minLength: 1, maxLength: 255 }
                data: { type: string, description: Conteúdo do arquivo em base64 }
                title: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Documento criado e indexado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /knowledge/search:
    post:
      tags: [Knowledge]
      summary: Busca híbrida (vetorial + texto) na base de conhecimento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 500 }
                limit: { type: integer, minimum: 1, maximum: 25 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /knowledge/{id}/reembed:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Knowledge]
      summary: Regera vetores/embeddings que faltaram na ingestão original
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Notifications ─────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: Lista notificações do usuário autenticado
      parameters:
        - name: unread
          in: query
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { type: object } }
                      unread: { type: integer }

  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Notifications]
      summary: Marca uma notificação como lida
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marca todas as notificações do usuário como lidas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      count: { type: integer }

  /notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    delete:
      tags: [Notifications]
      summary: Remove uma notificação
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Feature Flags ─────────────────────────────
  /feature-flags:
    get:
      tags: [Feature Flags]
      summary: Lista os flags resolvidos (default global + override da própria organização já aplicado)
      description: Qualquer papel autenticado pode ler.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: bug_report_module }
                        description: { type: string }
                        enabled: { type: boolean }
                        isOverridden: { type: boolean }

  /feature-flags/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Feature Flags]
      summary: Liga/desliga o flag para a própria organização do ADMIN autenticado
      description: Restrito a ADMIN. Nunca altera o default global do catálogo, só o override do tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Feature Flags]
      summary: Remove o override da organização, revertendo ao default global
      description: Restrito a ADMIN.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Bug Reports ─────────────────────────────
  /bug-reports:
    post:
      tags: [Bug Reports]
      summary: Registra um relato de problema (botão flutuante "Reportar problema")
      description: |
        Qualquer papel autenticado pode reportar. Limitado por organização
        (`BUG_REPORT_RATE_LIMIT_MAX`, default 10/15min). O campo `context` é
        sanitizado no backend (redação de token/segredo, truncamento) antes de
        persistir — ver `src/features/bug-reports/bugReport.sanitize.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 5000 }
                severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: MEDIUM }
                context:
                  type: object
                  description: Capturado automaticamente pelo frontend (URL, user agent, viewport, últimos logs)
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, example: OPEN }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Bug Reports]
      summary: Lista os relatos da própria organização
      description: Restrito a ADMIN/GESTOR.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, TRIAGED, RESOLVED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bug-reports/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Bug Reports]
      summary: Atualiza o status de triagem de um relato (OPEN → TRIAGED → RESOLVED)
      description: Restrito a ADMIN/GESTOR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, TRIAGED, RESOLVED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Automations ─────────────────────────────
  /automations/options:
    get:
      tags: [Automations]
      summary: Lista os gatilhos e ações disponíveis, para montar os selects da tela
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      triggers: { type: array, items: { type: string } }
                      actions: { type: array, items: { type: string } }

  /automations:
    get:
      tags: [Automations]
      summary: Lista as automações do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Automations]
      summary: Cria uma automação (gatilho → ação)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationInput'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /automations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Automations]
      summary: Atualiza parcialmente uma automação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationInput'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Automations]
      summary: Remove uma automação
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Usage / Billing ─────────────────────────────
  /usage:
    get:
      tags: [Usage]
      summary: Consumo de IA da organização (custo, tokens, chamadas) numa janela de dias
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Cadence ─────────────────────────────
  /cadence/opt-outs:
    get:
      tags: [Cadence]
      summary: Lista os registros de opt-out (por canal ou global) da organização autenticada
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /cadence/runs:
    get:
      tags: [Cadence]
      summary: Lista as execuções de cadência (ativas/pausadas/encerradas) da organização autenticada
      parameters:
        - name: status
          in: query
          description: 'Filtro opcional por status, separado por vírgula (ex.: Active,Paused)'
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /cadence/runs/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cadence]
      summary: >-
        Pausa manualmente uma execução de cadência ativa (CYC-009). Idempotente: pausar um run que
        não está `active` devolve o run inalterado, nunca lança erro.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Execução não encontrada nesta organização

  /cadence/runs/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cadence]
      summary: >-
        Retoma manualmente uma execução de cadência pausada (CYC-009). Idempotente: retomar um run
        que não está `paused` devolve o run inalterado, nunca lança erro. Nunca reabre um run já
        `stopped` (opt-out/resposta/parada manual são definitivos por design).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Execução não encontrada nesta organização

  /cadence/runs/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Cadence]
      summary: >-
        Para manualmente uma execução de cadência (CYC-009) — diferente de pausar, é definitivo
        (`stopReason: manual-stop`), nunca retomável.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Execução não encontrada nesta organização

  /cadence/leads/{leadId}/schedule-meeting:
    post:
      tags: [Cadence]
      summary: >-
        Confirma manualmente um horário de reunião com o lead (CYC-004) — só aceita confirmação
        verificável (`evidenceType: manual-verified`, nunca inferência de IA sobre o texto de uma
        mensagem). Cria uma Note de evidência real e um `CadenceCalendarEvent`. A criação do evento
        real no Google Calendar é um stub de transporte nesta rodada (nenhum provedor externo
        chamado ainda) — o `googleEventId` devolvido é sintético.
      parameters:
        - name: leadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposedStart, proposedEnd]
              properties:
                proposedStart: { type: string, format: date-time }
                proposedEnd: { type: string, format: date-time }
      responses:
        '201':
          description: Reunião confirmada e agendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '404':
          description: Lead não encontrado nesta organização
        '422':
          description: Confirmação não verificável (horário no passado, ou fim antes do início)

  # ───────────────────────────── WhatsApp ─────────────────────────────
  /whatsapp/messages:
    get:
      tags: [WhatsApp]
      summary: Histórico de mensagens persistidas (de um lead, ou as mais recentes do tenant)
      parameters:
        - name: leadId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /whatsapp/connect:
    post:
      tags: [WhatsApp]
      summary: Inicia a sessão do WhatsApp do tenant e gera QR Code
      responses:
        '200':
          description: Solicitação de conexão enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /whatsapp/status:
    get:
      tags: [WhatsApp]
      summary: Status da sessão do WhatsApp do tenant (conectado/desconectado/QR Code)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /whatsapp/disconnect:
    post:
      tags: [WhatsApp]
      summary: Desconecta a sessão do WhatsApp do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /whatsapp/send:
    post:
      tags: [WhatsApp]
      summary: Envia uma mensagem pela sessão do tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, text]
              properties:
                number: { type: string }
                text: { type: string }
      responses:
        '200':
          description: Enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  # ───────────────────────────── Google ─────────────────────────────
  /google/auth-url:
    get:
      tags: [Google]
      summary: Gera a URL de autenticação OAuth do Google
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  url: { type: string }

  /google/callback:
    get:
      tags: [Google]
      summary: >-
        Processa o callback OAuth do Google. Observação de contrato (corrigida em 2026-08-15,
        Onda 8): este endpoint NUNCA devolve JSON — sempre um redirect 302 para o frontend
        (`/app?google=connected` em sucesso, `/app?google=error&message=...` em falha).
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: >-
            Redireciona para `/app?google=connected` (sucesso) ou `/app?google=error&message=...`
            (falha) — nunca um corpo JSON, mesmo em erro.

  /google/status:
    get:
      tags: [Google]
      summary: Status da integração Google
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  # ───────────────────────────── Birth Voice (SDR de voz) ─────────────────────────────
  /integrations/birth-voice/cold-call/status:
    get:
      tags: [Birth Voice]
      summary: Status da campanha de prospecção fria (discagem automática) para o tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'

  /integrations/birth-voice/call/{leadId}:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Birth Voice]
      summary: Dispara uma ligação do SDR de voz para o lead informado
      responses:
        '202':
          description: Ligação iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '422':
          description: Lead sem telefone válido
        '409':
          description: Número em lista de bloqueio (opt-out)
        '503':
          description: Integração Birth Voices Hub não configurada

  /integrations/birth-voice/suppressions:
    get:
      tags: [Birth Voice]
      summary: Lista os números em bloqueio (opt-out) de discagem para o tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
    post:
      tags: [Birth Voice]
      summary: Bloqueia manualmente um número (opt-out registrado por outro canal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                reason: { type: string, maxLength: 500 }
                leadId: { type: string }
      responses:
        '201':
          description: Bloqueado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '422':
          description: Telefone fora de um formato brasileiro discável

  # ═══════════════════════════════════════════════════════════════════════════════════
  # Endpoints adicionados em 2026-08-15 (Onda 8, Agente 18) para fechar a deriva medida
  # entre este documento e as rotas reais (`server.ts` + routers). Ver tabela de deriva
  # no relatório da Onda 8 — 6 routers de negócio inteiros e ~13 endpoints avulsos
  # existiam em código sem nenhuma documentação aqui.
  # ═══════════════════════════════════════════════════════════════════════════════════

  # ───────────────────────────── CRM 360 (Cockpit CRM) ─────────────────────────────
  /crm/overview:
    get:
      tags: [CRM 360]
      summary: Resumo do cockpit CRM (contadores por etapa, valor em pipeline)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }

  /crm/pipelines:
    get:
      tags: [CRM 360]
      summary: Lista os pipelines/etapas configurados do funil de negócio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }

  /crm/board:
    get:
      tags: [CRM 360]
      summary: Leads agrupados por etapa, para o quadro Kanban do cockpit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }

  /crm/records/{id}/stage:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [CRM 360]
      summary: Move um registro (lead/negócio) para outra etapa do funil (ADMIN/GESTOR/VENDEDOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Formato de `moveCrmRecordSchema` (crm360.schema.ts)
      responses:
        '200':
          description: Movido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/leads/{id}/convert:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [CRM 360]
      summary: Converte um lead qualificado em negócio/oportunidade (ADMIN/GESTOR/VENDEDOR)
      responses:
        '200':
          description: Convertido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/products:
    get:
      tags: [CRM 360]
      summary: Lista os produtos/serviços cadastrados para composição de negócio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
    post:
      tags: [CRM 360]
      summary: Cria um produto/serviço (ADMIN/GESTOR/VENDEDOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Formato de `crmProductSchema` (crm360.schema.ts)
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/deals/{leadId}/items:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [CRM 360]
      summary: Lista os itens (produtos/serviços) compostos num negócio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
    post:
      tags: [CRM 360]
      summary: Adiciona um item ao negócio (ADMIN/GESTOR/VENDEDOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Formato de `crmDealItemSchema` (crm360.schema.ts)
      responses:
        '201':
          description: Adicionado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/deals/{leadId}/items/{id}:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [CRM 360]
      summary: Remove um item do negócio (somente ADMIN/GESTOR)
      responses:
        '204':
          description: Removido
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/documents:
    get:
      tags: [CRM 360]
      summary: Lista os documentos (propostas, contratos) vinculados a negócios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
    post:
      tags: [CRM 360]
      summary: Cria um documento vinculado a um negócio (ADMIN/GESTOR/VENDEDOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Formato de `crmDocumentSchema` (crm360.schema.ts)
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/documents/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [CRM 360]
      summary: Atualiza o status de um documento (ex. enviado/assinado) — ADMIN/GESTOR/VENDEDOR
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [CRM 360]
      summary: >-
        Edita o conteúdo de um documento comercial (CYC-005) — ADMIN/GESTOR/VENDEDOR. Cada chamada
        cria uma nova `CrmCommercialDocumentVersion` (histórico imutável, nunca sobrescrito).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Formato de `crmDocumentUpdateSchema` (crm360.schema.ts)
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/documents/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [CRM 360]
      summary: Lista o histórico de versões de um documento comercial (CYC-005), mais recente primeiro
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }

  /crm/documents/{id}/request-signature:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [CRM 360]
      summary: >-
        Solicita assinatura eletrônica real de um documento (CYC-006, onda 28) — provedor
        `'govbr'`, stub de transporte (ver `GovBrSignatureProviderPort.ts`). `signerEmail`/
        `signerName` são opcionais: caem no e-mail/nome do Contact vinculado ao documento quando
        ausentes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                signerEmail: { type: string, format: email }
                signerName: { type: string }
      responses:
        '201':
          description: Solicitação criada e enviada ao provedor (stub)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Documento não encontrado nesta organização
        '422':
          description: Documento sem e-mail de assinante (nem contato vinculado, nem signerEmail no body)

  /public/proposals/{token}/view:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
        description: publicToken opaco do documento comercial — é a credencial, não há autenticação de sessão nesta rota
    get:
      tags: [CRM 360]
      summary: >-
        Visualização pública de uma proposta (CYC-005) — sem `authenticateToken`/`requireTenant`,
        montada fora do bloco autenticado (mesmo lugar dos webhooks de integração). Registra a
        visualização real (`viewCount`/`firstViewedAt`/`lastViewedAt`) e avança o status de
        `Enviado` para `Visualizado` na primeira abertura do link — nunca regride um status já mais
        avançado (ex.: Aceito).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataEnvelope' }
        '404':
          description: Token inexistente ou documento excluído

