      summary: Lista as conexões 3CX configuradas para o tenant
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
  /integrations/3cx/connect:
    post:
      tags: [3CX]
      summary: Cria uma nova conexão com o PABX 3CX (somente ADMIN/GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Criada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/3cx/connections/{connectionId}/test:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [3CX]
      summary: Testa a conexão 3CX (somente ADMIN/GESTOR)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/3cx/disconnect/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [3CX]
      summary: Desconecta a conexão 3CX (somente ADMIN/GESTOR)
      responses:
        '200': { description: Desconectada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/3cx/call:
    post:
      tags: [3CX]
      summary: Dispara uma ligação via 3CX (ADMIN/GESTOR/VENDEDOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Ligação iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── Webhooks (corpo cru) ─────────────────────────────
  # Montados em server.ts ANTES do express.json() global — corpo não é JSON parseado pelo
  # middleware padrão, e a autenticidade não vem de sessão de usuário. Ver env vars citadas em
  # cada um (fail-closed: sem o segredo configurado, o endpoint rejeita toda requisição).
  /integrations/birth-voice:
    post:
      tags: [Webhooks]
      summary: >-
        Webhook de resultado de chamada do Birth Voices Hub. Corpo cru (`express.raw`), assinatura
        HMAC no header `x-birthvoices-signature` sobre os bytes crus, segredo
        `BIRTH_VOICES_WEBHOOK_SECRET`. Mesmo prefixo de path que `/integrations/birth-voice/*`
        (endpoints autenticados da tag Birth Voice) — este router é montado ANTES e só intercepta
        o path exato do webhook, os demais sub-paths caem no router autenticado.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Processado
        '401':
          description: Assinatura HMAC inválida
        '503':
          description: BIRTH_VOICES_WEBHOOK_SECRET não configurado (fail-closed)

  /integrations/3cx/webhook:
    post:
      tags: [Webhooks]
      summary: >-
        Webhook de evento de chamada do PABX 3CX (Call Flow). Corpo cru (`express.raw`),
        assinatura HMAC no header `x-3cx-signature`, segredo `THREECX_WEBHOOK_SECRET`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Processado
        '401':
          description: Assinatura HMAC inválida
        '503':
          description: THREECX_WEBHOOK_SECRET não configurado (fail-closed)

  /webhooks/voice-result:
    post:
      tags: [Webhooks]
      summary: >-
        Webhook de resultado de ligação de voz (Bland AI). JSON parseado com parser próprio (não
        depende do `express.json()` global, montado antes dele), segredo comparado em tempo
        constante no header `x-atlasgr-webhook-secret` vs `ATLASGR_WEBHOOK_SECRET`, idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Processado
        '401':
          description: Segredo inválido
        '503':
          description: ATLASGR_WEBHOOK_SECRET não configurado (fail-closed)

  /webhooks/email/webhook:
    post:
      tags: [Webhooks]
      summary: >-
        Webhook de e-mail de ENTRADA (CYC-003, onda 26) — stub de transporte: aceita diretamente o
        payload que um provedor real de inbound-parse (SendGrid/Postmark/Mailgun) entregaria depois
        de resolver `organizationId`, já que este projeto não tem hoje uma caixa de e-mail dedicada
        por tenant (ver `src/features/integrations/email/emailReply.webhook.ts`). Corpo cru
        (`express.raw`, não depende do `express.json()` global), assinatura HMAC em
        `x-email-inbound-signature` comparada em tempo constante contra
        `EMAIL_INBOUND_WEBHOOK_SECRET`, idempotente por `providerMessageId`. Auto-respostas/bounce
        (`isGenuineLeadReply`) nunca viram `EmailMessage`/`ConversationSignal`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, providerMessageId, fromEmail]
              properties:
                organizationId: { type: string }
                leadId: { type: string, description: 'Dica direta de lead — resolvido por e-mail do contato quando ausente.' }
                providerMessageId: { type: string }
                inReplyTo: { type: string, nullable: true }
                fromEmail: { type: string }
                toEmail: { type: string }
                subject: { type: string, nullable: true }
                body: { type: string }
                autoSubmittedHeader: { type: string, nullable: true }
                receivedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Processado (outcome ignored-auto-reply | duplicate | lead-not-found | recorded)
        '400':
          description: Corpo inválido ou campos obrigatórios ausentes
        '401':
          description: Assinatura HMAC inválida
        '503':
          description: EMAIL_INBOUND_WEBHOOK_SECRET não configurado (fail-closed)

  /webhooks/signature/webhook:
    post:
      tags: [Webhooks]
      summary: >-
        Webhook de status de assinatura eletrônica de ENTRADA (CYC-006, onda 28). O ENVIO da
        solicitação é um stub (nenhuma credencial de integrador gov.br configurada, ver
        `src/features/cadence/infra/GovBrSignatureProviderPort.ts`), mas este webhook de entrada já
        é real. Corpo cru (`express.raw`), assinatura HMAC em `x-signature-webhook-signature`
        comparada em tempo constante contra `SIGNATURE_INBOUND_WEBHOOK_SECRET`. Idempotente/seguro
        contra reentrega e entrega fora de ordem: `isValidSignatureTransition` rejeita qualquer
        transição que não seja permitida pelo fluxo real de assinatura, nunca reverte um estado
        terminal (`signed`/`declined`/`expired`/`cancelled`) já aplicado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerRequestId, status]
              properties:
                provider: { type: string, example: govbr }
                providerRequestId: { type: string }
                status: { type: string, enum: [created, sent, viewed, signed, declined, expired, cancelled] }
                evidenceRef: { type: string, nullable: true, description: 'URL/id do certificado de assinatura devolvido pelo provedor.' }
      responses:
        '200':
          description: Processado (outcome applied | ignored, com reason not-found | invalid-transition quando ignored)
        '400':
          description: Corpo inválido, ou status ausente/fora do vocabulário aceito
        '401':
          description: Assinatura HMAC inválida
        '503':
          description: SIGNATURE_INBOUND_WEBHOOK_SECRET não configurado (fail-closed)

  /integrations/bitrix:
    post:
      tags: [Webhooks]
      summary: >-
        Webhook de entrada do Bitrix24 ("исходящий вебхук") — leads/eventos criados no Bitrix
        chegam aqui. Corpo form-encoded (`express.urlencoded`, não JSON — é como o Bitrix24 envia
        webhooks de saída). Autenticidade por segredo por conexão (`auth.application_token`)
        comparado em tempo constante, identificado por `:connectionId` na URL real (ex.
        `/api/integrations/bitrix/:connectionId`) — a URL completa, incluindo o id da conexão, é a
        credencial.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object }
      responses:
        '200':
          description: Processado
        '401':
          description: Segredo da conexão inválido ou conexão não encontrada

  # ─────────────── Endpoints avulsos ausentes em routers já documentados ───────────────
  /leads/import/bitrix24:
    get:
      tags: [Leads]
      summary: Lista leads do Bitrix24 candidatos à importação direta (view a partir do módulo de Leads)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /leads/enrich-batch:
