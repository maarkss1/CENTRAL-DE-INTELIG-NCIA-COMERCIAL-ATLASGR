        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Bitrix24]
      summary: Remove uma regra de sincronização (somente ADMIN/GESTOR)
      responses:
        '204': { description: Removida }
        '403': { $ref: '#/components/responses/Forbidden' }
