  /bitrix/leads/{leadId}/export:
    parameters:
      - name: leadId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Bitrix24]
      summary: >-
        Exporta (ou reexporta) um lead do CRM para o Bitrix24 imediatamente (Agente 18, achado de
        auditoria: endpoint real, sem entrada aqui).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                connectionId: { type: string }
                statusId: { type: string }
                assignedById: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bitrix/leads/export-batch:
    post:
      tags: [Bitrix24]
      summary: >-
        Exporta leads em lote para o Bitrix24 sob demanda (Agente 18, achado de auditoria:
        endpoint real, sem entrada aqui). Sem `leadIds` no corpo, exporta todos os leads
        elegíveis da organização.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                leadIds: { type: array, items: { type: string } }
                connectionId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      exportedCount: { type: integer }
                      skippedCount: { type: integer }
                      total: { type: integer }
