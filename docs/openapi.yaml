      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /prospecting/cold-email:
    post:
      tags: [Prospecting]
      summary: Gera/envia um e-mail frio para um candidato prospectado
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /intelligence/agents/sdr/status/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Intelligence]
      summary: Status de uma execução em background do agente SDR de qualificação
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /intelligence/report/latest:
    get:
      tags: [Intelligence]
      summary: Último relatório executivo gerado via IA para o tenant
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /intelligence/win-loss-analysis:
    post:
      tags: [Intelligence]
      summary: Dispara a análise de ganho/perda via IA sob demanda
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Análise enfileirada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: >-
        Stream Server-Sent Events de notificações em tempo real do usuário autenticado. Endpoint
        inline (não um router dedicado) — não segue o envelope `{success,data}` padrão, é um
        stream contínuo `text/event-stream`.
      responses:
        '200':
          description: Stream de eventos SSE, uma conexão por sessão de usuário
          content:
            text/event-stream:
              schema: { type: string }

  /automations/stagnation-scan:
    post:
      tags: [Automations]
      summary: >-
        Dispara manualmente a varredura de leads estagnados/frios (mesma lógica do cron diário) —
        somente ADMIN, varredura cross-tenant administrativa
      responses:
        '202': { description: Varredura iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /whatsapp/conversations:
    get:
      tags: [WhatsApp]
