      summary: >-
        Lista as extrações históricas do Bitrix24 (somente ADMIN/GESTOR — uma extração pode trazer
        todo o dado histórico da conta)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Bitrix24]
      summary: Inicia uma nova extração histórica do Bitrix24 (somente ADMIN/GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
