        Gera um playbook de mentoria via IA a partir das métricas do filtro atual (Agente 18,
        achado de auditoria: endpoint real, sem entrada aqui; somente ADMIN/GESTOR, mesmo
        limitador de IA dedicado dos demais endpoints `ai/*` deste módulo).
      responses:
