# Stack de produção self-hosted no Oracle Cloud Infrastructure (OCI).
#
# Stack mínimo do MVP (sempre sobe com `docker compose up -d`, sem flags extras):
#   app (monólito Node/Express + frontend Vite) + postgres + caddy (reverse proxy/TLS).
#
# `redis` e `worker` são OPT-IN via Compose profile `queues` — decisão de produto registrada em
# `render.yaml` (ENABLE_QUEUES=false no serviço web) e em `docs/deploy/oracle-cloud.md`: nenhuma
# jornada essencial do MVP (auth, CRM, Prospecção, dashboard) depende de fila/Redis — ver
# `src/lib/queue/redis.ts` (REDIS_URL ausente => `queuesEnabled=false`, app sobe normalmente).
# Para habilitar filas/worker mais tarde, quando alguma jornada realmente depender disso:
#   ENABLE_QUEUES=true no .env.production + `docker compose -f docker-compose.oci.yml --profile queues up -d`
#
# Nunca suba `redis`/`worker` ao lado de outro processo que também consuma as mesmas filas
# BullMQ — duplicar consumers reprocessa jobs (ver ADR-004 e docs/ADR/ADR-003, seção A).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlasgr_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://prospector_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@postgres:5432/prospectordb
      # Opcionais por padrão (stack mínimo do MVP): só têm efeito quando o profile `queues` está
      # ativo E o operador define os dois no .env.production (ver cabeçalho deste arquivo e
      # scripts/deploy-oci.sh). Sem eles, `queuesEnabled=false` e a aplicação sobe normalmente.
      - ENABLE_QUEUES=${ENABLE_QUEUES:-false}
      - REDIS_URL=${REDIS_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health/live', (r) => {if (r.statusCode !== 200) process.exit(1);})\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # Worker dedicado (filas BullMQ + cron de negócio) — só sobe com `--profile queues`. Nunca ativar
  # sem `ENABLE_QUEUES=true` também no serviço `app` estar deliberadamente mantido em modo produtor
  # apenas: ver render.yaml (mesmo padrão, mesmo aviso de duplicação de consumo).
  worker:
    profiles: ["queues"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlasgr_worker
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && exec npm run start:worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - ENABLE_QUEUES=true
      - DATABASE_URL=postgresql://prospector_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@postgres:5432/prospectordb
      # Sem valor obrigatório (:?) aqui de propósito: profiles do Compose não isentam serviços da
      # interpolação de variáveis, então um `:?` faria `docker compose config`/`up` falhar mesmo
      # quando o profile `queues` está inativo. scripts/deploy-oci.sh valida REDIS_PASSWORD
      # explicitamente antes de subir este profile.
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
    security_opt:
      - no-new-privileges:true

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: atlasgr/postgres-intelligence:16
    container_name: atlasgr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: ${BOOTSTRAP_DB_PASSWORD:?BOOTSTRAP_DB_PASSWORD must be set}
      POSTGRES_DB: prospectordb
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - oci_pgdata:/var/lib/postgresql/data
      - ./scripts/db/create-app-role.sql:/docker-entrypoint-initdb.d/create-app-role.sql.tpl:ro
      - ./scripts/db/docker-init.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
      - ./scripts/db/02-enable-extensions.sql:/docker-entrypoint-initdb.d/02-enable-extensions.sql:ro
      - ./scripts/db/03-create-langfuse-db.sql:/docker-entrypoint-initdb.d/03-create-langfuse-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospectordb"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Cache/fila — só sobe com `--profile queues` (ver cabeçalho deste arquivo).
  redis:
    profiles: ["queues"]
    image: redis:7-alpine
    container_name: atlasgr_redis
    restart: unless-stopped
    # Sem `:?` de propósito — ver comentário no serviço `worker` acima sobre interpolação e
    # profiles. scripts/deploy-oci.sh recusa subir este profile sem REDIS_PASSWORD definido.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes"]
    volumes:
      - oci_redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: atlasgr_caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@atlasgr.com.br}
    volumes:
      - ./Caddyfile.oci:/etc/caddy/Caddyfile:ro
      - oci_caddy_data:/data
      - oci_caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  oci_pgdata:
  oci_redisdata:
  oci_caddy_data:
  oci_caddy_config:
