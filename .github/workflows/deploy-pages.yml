name: Deploy to GitHub Pages

# Gatilho manual apenas (workflow_dispatch), não automático em push.
#
# Este build publica só o frontend estático (`vite build`) sem o backend Express/Prisma que a
# aplicação real precisa (autenticação, API, banco) — ver server.ts e docs/deploy/producao.md
# (arquitetura "monólito único no Render": o mesmo serviço Express serve API e o estático do
# Vite). Publicado assim, a URL do GitHub Pages carrega a SPA mas nenhuma chamada a `/api/*`
# funciona: não é um ambiente utilizável, só um artefato de build visualmente navegável.
# Rodar em todo push em `main` expunha automaticamente, a cada commit, uma versão pública
# não-funcional do produto sem necessidade real — nenhum outro arquivo do repositório referencia
# a URL do GitHub Pages como ambiente de demo/preview legítimo (varredura feita antes desta
# mudança). Mantido como `workflow_dispatch` para permitir gerar esse artefato estático sob
# demanda (ex.: revisão visual isolada de UI sem precisar do backend), sem publicar
# automaticamente a cada push.
on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Fase Final 1 (Gate Único de Release): antes deste job, este workflow publicava artifact estático
  # sem rodar typecheck/lint/unit. Gate leve — proporcional ao blast radius (SPA estática sem
  # backend funcional, ver comentário no topo do arquivo) — mas não mais zero.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        # Use relative paths for Github Pages deployment
        run: npx vite build --base=./

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
