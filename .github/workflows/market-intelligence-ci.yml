name: Market Intelligence - Quality Gate

on:
  push:
    branches:
      - feat/atlas-national-territory-intelligence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      JWT_SECRET: market-intelligence-ci-placeholder-secret
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Market Intelligence unit tests
        run: npx vitest run tests/unit/market-intelligence

      - name: Build application
        run: npm run build
