name: Market Intelligence - Agregado Municipal

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-intelligence-aggregate.yml'
      - 'public/tools/atlas-market-intelligence/etl_municipal_aggregate.py'
      - 'public/tools/atlas-market-intelligence/data/icp_municipios.json'
      - 'public/tools/atlas-market-intelligence/data/rntrc_municipios.json'
      - 'public/tools/atlas-market-intelligence/data/municipios.json'
      - 'public/tools/atlas-market-intelligence/data/senatran_frota_municipios.json'
      - 'public/tools/atlas-market-intelligence/data/mdfe_origens_municipios.json'
      - 'public/tools/atlas-market-intelligence/data/mdfe_destinos_municipios.json'
      - 'public/tools/atlas-market-intelligence/concorrencia_seed_verificada.csv'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-intelligence-aggregate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Show Python runtime
        run: python3 --version

      - name: Agregar ICP + RNTRC + SENATRAN + IBGE/BCIM em municipios_scored.json
        run: python3 public/tools/atlas-market-intelligence/etl_municipal_aggregate.py

      - name: Validate derived dataset and update manifest.files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('public/tools/atlas-market-intelligence/data')
          data_path = root / 'municipios_scored.json'
          meta_path = root / 'municipios_scored.metadata.json'
          manifest_path = root / 'manifest.json'
          rows = json.loads(data_path.read_text(encoding='utf-8'))
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if not rows:
              raise SystemExit('Agregado municipal vazio')

          seen = set()
          for row in rows:
              code = str(row.get('ibgeCode', ''))
              if not code.isdigit() or len(code) != 7:
                  raise SystemExit(f'codigo IBGE invalido: {code!r}')
              if code in seen:
                  raise SystemExit(f'duplicidade municipal: {code}')
              seen.add(code)

          manifest['files']['municipalities'] = 'municipios_scored.json'
          manifest['generatedAt'] = meta.get('processedAt') or manifest['generatedAt']
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'municipalities': len(rows), 'stats': meta.get('stats')}, ensure_ascii=False, indent=2))
          PY

      - name: Publish compact derived data via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas-market-data-bot"
          git config user.email "130610135+MaarksN@users.noreply.github.com"
          git add \
            public/tools/atlas-market-intelligence/data/municipios_scored.json \
            public/tools/atlas-market-intelligence/data/municipios_scored.metadata.json \
            public/tools/atlas-market-intelligence/data/manifest.json
          if git diff --cached --quiet; then
            echo "No derived-data changes to commit."
            exit 0
          fi
          BRANCH="data/market-intelligence-aggregate-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data(municipios): publica agregado municipal (ICP+RNTRC+SENATRAN+IBGE)"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(municipios): publica agregado municipal (ICP+RNTRC+SENATRAN+IBGE)" \
            --body "Agregado municipal gerado automaticamente pelo workflow \`market-intelligence-aggregate.yml\` (run ${GITHUB_RUN_ID}). \`main\` é protegida e exige PR + check \`build\`, então este bot publica via PR em vez de push direto." \
            --base main --head "$BRANCH")
          echo "Pull request criado: $PR_URL"
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Auto-merge não habilitado ou PR requer aprovação manual — revisar $PR_URL."
