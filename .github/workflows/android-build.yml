name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL de produção que o app Android vai carregar (ex.: https://prospector.atlasgr.com.br)'
        required: true
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # No push automático usamos o secret CAPACITOR_SERVER_URL do repositório;
      # no disparo manual (workflow_dispatch) dá pra sobrescrever pelo input acima.
      CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.CAPACITOR_SERVER_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npx vite build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlasgr-prospector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
