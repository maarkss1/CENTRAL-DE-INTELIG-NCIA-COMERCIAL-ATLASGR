name: Market Intelligence - RNTRC Snapshot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-intelligence-rntrc.yml'
      - 'public/tools/atlas-market-intelligence/etl_rntrc_atlas.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-intelligence-rntrc-${{ github.ref }}
  cancel-in-progress: true

env:
  RNTRC_SOURCE_URL: https://dados.antt.gov.br/dataset/b4a055d1-97a2-46f1-9461-cb17fbc6b6b3/resource/42a9f5fb-494f-4ad8-acc3-e8d836dbf0c3/download/transportadores_rntrc_07_2026.csv
  RNTRC_RESOURCE_PAGE: https://dados.antt.gov.br/dataset/rntrc/resource/42a9f5fb-494f-4ad8-acc3-e8d836dbf0c3

jobs:
  aggregate-rntrc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Show Python runtime
        run: python3 --version

      - name: Download verified official RNTRC Jul/2026
        run: |
          mkdir -p .cache/market-intelligence/raw/rntrc/2026-07
          target="$PWD/.cache/market-intelligence/raw/rntrc/2026-07/transportadores_rntrc_07_2026.csv"
          curl --fail-with-body --location --compressed \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 900 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36' \
            --header 'Accept: text/csv,text/plain;q=0.9,*/*;q=0.8' \
            --header "Referer: $RNTRC_RESOURCE_PAGE" \
            --output "$target" \
            "$RNTRC_SOURCE_URL"

          bytes=$(wc -c < "$target")
          echo "RNTRC raw bytes: $bytes"
          if [ "$bytes" -lt 100000000 ]; then
            echo "::error::RNTRC oficial retornou payload incompatível com o recurso de 151,3 MiB."
            echo "Content diagnosis:"
            file "$target" || true
            head -c 512 "$target" | tr -cd '\11\12\15\40-\176' | head -c 512 || true
            exit 1
          fi

      - name: Aggregate RNTRC by canonical IBGE municipality
        run: |
          raw="$PWD/.cache/market-intelligence/raw/rntrc/2026-07/transportadores_rntrc_07_2026.csv"
          python3 public/tools/atlas-market-intelligence/etl_rntrc_atlas.py \
            --workdir .cache/market-intelligence \
            --resource-url "file://$raw" \
            --competence '2026-07' \
            --output public/tools/atlas-market-intelligence/data/rntrc_municipios.json \
            --metadata public/tools/atlas-market-intelligence/data/rntrc_municipios.metadata.json

      - name: Validate derived dataset and update manifest health
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          official_url = 'https://dados.antt.gov.br/dataset/b4a055d1-97a2-46f1-9461-cb17fbc6b6b3/resource/42a9f5fb-494f-4ad8-acc3-e8d836dbf0c3/download/transportadores_rntrc_07_2026.csv'
          resource_id = '42a9f5fb-494f-4ad8-acc3-e8d836dbf0c3'
          root = Path('public/tools/atlas-market-intelligence/data')
          data_path = root / 'rntrc_municipios.json'
          meta_path = root / 'rntrc_municipios.metadata.json'
          manifest_path = root / 'manifest.json'
          rows = json.loads(data_path.read_text(encoding='utf-8'))
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if not rows:
              raise SystemExit('RNTRC derivado vazio')

          seen = set()
          for row in rows:
              code = str(row.get('ibgeCode', ''))
              if not code.isdigit() or len(code) != 7:
                  raise SystemExit(f'codigo IBGE invalido: {code!r}')
              if code in seen:
                  raise SystemExit(f'duplicidade municipal: {code}')
              seen.add(code)
              for key in ('transporters', 'etc', 'tac', 'ctc', 'etcEquiparada'):
                  value = row.get(key)
                  if not isinstance(value, int) or value < 0:
                      raise SystemExit(f'valor RNTRC invalido em {code}/{key}: {value!r}')
              # etcEquiparada e subconjunto de etc (nao soma separadamente -- ver
              # category_bucket()/etc_equiparada em etl_rntrc_atlas.py); uma linha pode ficar
              # sem categoria reconhecida (bucket=None) e ainda assim contar em transporters,
              # entao a invariante correta e >=, nunca ==.
              if row['etc'] + row['tac'] + row['ctc'] > row['transporters']:
                  raise SystemExit(f'soma de categorias RNTRC excede transporters em {code}')

          stats = meta['stats']
          active = max(int(stats.get('rows_active') or 0), 1)
          unmatched = int(stats.get('rows_unmatched_geography') or 0)
          unmatched_rate = unmatched / active
          status = 'ATUALIZADO' if unmatched_rate <= 0.001 else 'PARCIAL'

          # MI-005: mesmo gate de nao-regressao de competencia/cobertura do CNPJ (ver
          # market-intelligence-cnpj.yml) -- comparado contra o que ja esta publicado, antes
          # de dataset.update() sobrescrever.
          previous = next((d for d in manifest['datasets'] if d['id'] == 'rntrc'), None)
          prev_competence = previous.get('competence') if previous else None
          if prev_competence and prev_competence not in ('MANUAL_NAO_INFORMADA',) and '2026-07' < prev_competence:
              raise SystemExit(f"competencia regrediu: nova='2026-07' anterior={prev_competence!r}")

          prev_coverage = previous.get('coverage') if previous else None
          if isinstance(prev_coverage, int) and prev_coverage > 0:
              variation = (len(rows) - prev_coverage) / prev_coverage
              if abs(variation) > 0.15:
                  raise SystemExit(
                      f'variacao anormal de cobertura sem justificativa: {prev_coverage} -> {len(rows)} municipios ({variation:+.2%})'
                  )

          meta['resource'].update({
              'id': resource_id,
              'name': 'Jul26 - RNTRC',
              'url': official_url,
              'competence': '2026-07',
              'last_modified': '2026-08-10'
          })
          meta['sourcePage'] = 'https://dados.antt.gov.br/dataset/rntrc/resource/42a9f5fb-494f-4ad8-acc3-e8d836dbf0c3'
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for dataset in manifest['datasets']:
              if dataset['id'] == 'rntrc':
                  dataset.update({
                      'status': status,
                      'competence': '2026-07',
                      'downloadedAt': meta.get('downloadedAt'),
                      'sha256': meta.get('outputSha256'),
                      'coverage': len(rows),
                      'unmatchedRows': unmatched,
                      'unmatchedRate': round(unmatched_rate, 6),
                      'note': f"Snapshot oficial Jul/2026 processado em {len(rows)} municipios com transportadores; {unmatched} linhas ativas sem match IBGE ({unmatched_rate:.4%}). Base bruta permanece fora do bundle web."
                  })
                  break

          manifest['generatedAt'] = meta.get('downloadedAt') or manifest['generatedAt']
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'municipalities': len(rows),
              'active_rows': active,
              'unmatched_rows': unmatched,
              'unmatched_rate': unmatched_rate,
              'health': status,
              'competence': '2026-07',
              'raw_bytes': meta.get('rawBytes'),
              'raw_sha256': meta.get('rawSha256'),
              'derived_sha256': meta.get('outputSha256')
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish compact derived data via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas-market-data-bot"
          git config user.email "130610135+MaarksN@users.noreply.github.com"
          git add \
            public/tools/atlas-market-intelligence/data/rntrc_municipios.json \
            public/tools/atlas-market-intelligence/data/rntrc_municipios.metadata.json \
            public/tools/atlas-market-intelligence/data/manifest.json
          if git diff --cached --quiet; then
            echo "No derived-data changes to commit."
            exit 0
          fi
          BRANCH="data/market-intelligence-rntrc-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data(rntrc): atualiza snapshot municipal oficial"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(rntrc): atualiza snapshot municipal oficial" \
            --body "Snapshot RNTRC gerado automaticamente pelo workflow \`market-intelligence-rntrc.yml\` (run ${GITHUB_RUN_ID}). \`main\` é protegida e exige PR + check \`build\`, então este bot publica via PR em vez de push direto." \
            --base main --head "$BRANCH")
          echo "Pull request criado: $PR_URL"
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Auto-merge não habilitado ou PR requer aprovação manual — revisar $PR_URL."
