name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Fase Final 1 (Gate Único de Release): antes deste job, o xcarchive era gerado sem rodar
  # typecheck/lint/unit — mesmo padrão aplicado a deploy-pages.yml/android-build.yml. Roda em
  # ubuntu (mais barato/rápido que macos-latest) já que só valida código TS/JS, não empacota iOS.
  gate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Type Check
      run: npx tsc --noEmit

    - name: Run Lint
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test:unit

  build:
    runs-on: macos-latest
    needs: gate

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Build iOS App (Archive)
      working-directory: ./ios/App
      run: |
        xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' archive -archivePath "$PWD/build/App.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Upload iOS Archive
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: atlasgr-ios-xcarchive
        path: ios/App/build/App.xcarchive
