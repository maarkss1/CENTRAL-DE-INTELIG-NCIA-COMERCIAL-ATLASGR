name: Market Intelligence - SENATRAN Frota por Município

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-intelligence-senatran.yml'
      - 'public/tools/atlas-market-intelligence/etl_senatran_frota.py'
  schedule:
    # Dia 15 de cada mes, apos o SENATRAN costumar publicar a competencia do mes anterior.
    - cron: '30 6 15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-intelligence-senatran-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate-senatran:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Show Python runtime
        run: python3 --version

      - name: Descobrir e agregar frota SENATRAN por município e tipo
        run: |
          python3 public/tools/atlas-market-intelligence/etl_senatran_frota.py \
            --workdir .cache/market-intelligence/senatran \
            --output public/tools/atlas-market-intelligence/data/senatran_frota_municipios.json \
            --metadata public/tools/atlas-market-intelligence/data/senatran_frota_municipios.metadata.json

      - name: Validate derived dataset and update manifest health
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('public/tools/atlas-market-intelligence/data')
          data_path = root / 'senatran_frota_municipios.json'
          meta_path = root / 'senatran_frota_municipios.metadata.json'
          manifest_path = root / 'manifest.json'
          rows = json.loads(data_path.read_text(encoding='utf-8'))
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if not rows:
              raise SystemExit('SENATRAN derivado vazio')

          seen = set()
          for row in rows:
              code = str(row.get('ibgeCode', ''))
              if not code.isdigit() or len(code) != 7:
                  raise SystemExit(f'codigo IBGE invalido: {code!r}')
              if code in seen:
                  raise SystemExit(f'duplicidade municipal: {code}')
              seen.add(code)
              if row.get('cargoFleet', 0) < 0 or row.get('total', 0) < 0:
                  raise SystemExit(f'valor de frota invalido em {code}')

          stats = meta['stats']
          processed = max(int(stats.get('rows_processed') or 0), 1)
          unmatched = int(stats.get('rows_unmatched_geography') or 0)
          unmatched_rate = unmatched / processed
          status = 'ATUALIZADO' if unmatched_rate <= 0.02 else 'PARCIAL'
          competence = meta['resource'].get('competence') or 'MANUAL_NAO_INFORMADA'

          for dataset in manifest['datasets']:
              if dataset['id'] == 'fleet':
                  break
          else:
              dataset = {'id': 'fleet', 'label': 'Frota de veículos'}
              manifest['datasets'].append(dataset)

          dataset.update({
              'status': status,
              'source': 'SENATRAN / Ministério dos Transportes (Frota por município e tipo)',
              'geography': 'Município',
              'competence': competence,
              'downloadedAt': meta.get('downloadedAt'),
              'sha256': meta.get('outputSha256'),
              'municipalUse': 'OBSERVADO',
              'note': (
                  f"Snapshot oficial {competence} processado em {len(rows)} municipios; "
                  f"{unmatched} de {processed} linhas sem match IBGE ({unmatched_rate:.4%}). "
                  f"cargoFleet soma CAMINHAO + CAMINHAO TRATOR + REBOQUE + SEMI-REBOQUE; "
                  f"demais tipos de veiculo disponiveis em byType. Substitui a tentativa anterior via "
                  f"ANTT RNTRC-Dados de Veiculos (granularidade UF, recurso indisponivel -- ver FONTES.md)."
              ),
          })
          dataset.pop('probe', None)
          dataset.pop('probedAt', None)

          manifest['generatedAt'] = meta.get('downloadedAt') or manifest['generatedAt']
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'municipalities': len(rows),
              'rows_processed': processed,
              'unmatched_rows': unmatched,
              'unmatched_rate': unmatched_rate,
              'health': status,
              'competence': competence,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish compact derived data via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas-market-data-bot"
          git config user.email "130610135+MaarksN@users.noreply.github.com"
          git add \
            public/tools/atlas-market-intelligence/data/senatran_frota_municipios.json \
            public/tools/atlas-market-intelligence/data/senatran_frota_municipios.metadata.json \
            public/tools/atlas-market-intelligence/data/manifest.json
          if git diff --cached --quiet; then
            echo "No derived-data changes to commit."
            exit 0
          fi
          BRANCH="data/market-intelligence-senatran-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data(senatran): publica snapshot municipal oficial de frota"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(senatran): publica snapshot municipal oficial de frota" \
            --body "Snapshot SENATRAN gerado automaticamente pelo workflow \`market-intelligence-senatran.yml\` (run ${GITHUB_RUN_ID}). \`main\` é protegida e exige PR + check \`build\`, então este bot publica via PR em vez de push direto." \
            --base main --head "$BRANCH")
          echo "Pull request criado: $PR_URL"
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Auto-merge não habilitado ou PR requer aprovação manual — revisar $PR_URL."
