name: Market Intelligence - Movimentação de Cargas (CIOT)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-intelligence-mdfe.yml'
      - 'public/tools/atlas-market-intelligence/etl_mdfe_atlas.py'
  schedule:
    # Dia 20 de cada mes, apos a ANTT costumar publicar a competencia do mes anterior.
    - cron: '30 6 20 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-intelligence-mdfe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate-mdfe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Show Python runtime
        run: python3 --version

      - name: Descobrir e agregar CIOT (proxy de fluxo origem-destino) por município
        run: |
          python3 public/tools/atlas-market-intelligence/etl_mdfe_atlas.py \
            --output-dir public/tools/atlas-market-intelligence/data \
            --workdir .cache/market-intelligence/mdfe

      - name: Validate derived dataset and update manifest health
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('public/tools/atlas-market-intelligence/data')
          meta_path = root / 'mdfe.metadata.json'
          manifest_path = root / 'manifest.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          for name in ('mdfe_origens_municipios.json', 'mdfe_destinos_municipios.json', 'mdfe_corredores.json'):
              rows = json.loads((root / name).read_text(encoding='utf-8'))
              if not rows:
                  raise SystemExit(f'{name} vazio')

          stats = meta['stats']
          processed = max(int(stats.get('rowsRead') or 0), 1)
          unmatched = int(stats.get('unmatchedGeographyRows') or 0)
          unmatched_rate = unmatched / processed
          status = 'ATUALIZADO' if unmatched_rate <= 0.05 else 'PARCIAL'
          competence = meta.get('competence') or 'MANUAL_NAO_INFORMADA'

          for dataset in manifest['datasets']:
              if dataset['id'] == 'mdfe':
                  break
          else:
              dataset = {'id': 'mdfe', 'label': 'ANTT / MDF-e movimentação de cargas'}
              manifest['datasets'].append(dataset)

          dataset.update({
              'status': status,
              'source': f"ANTT / {meta.get('sourceKind')}",
              'geography': 'Origem / Destino / Corredor',
              'competence': competence,
              'downloadedAt': meta.get('processedAt'),
              'sha256': meta.get('outputs', {}).get('corridors', {}).get('sha256'),
              'note': (
                  f"Competencia {competence}: {stats.get('matchedRows')} de {processed} linhas casadas com IBGE "
                  f"({unmatched_rate:.4%} sem match), {stats.get('interstateRows')} interestaduais, "
                  f"{meta.get('cargoGroupsObserved')} grupos NCM observados. Fonte: {meta.get('sourceKind')}. "
                  "Nunca inclui contagem de MDF-e (manifests permanece null), apenas viagens/operacoes CIOT."
              ),
          })

          manifest['generatedAt'] = meta.get('processedAt') or manifest['generatedAt']
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'competence': competence, 'health': status, 'stats': stats,
              'sourceKind': meta.get('sourceKind'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish compact derived data via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas-market-data-bot"
          git config user.email "130610135+MaarksN@users.noreply.github.com"
          git add \
            public/tools/atlas-market-intelligence/data/mdfe_origens_municipios.json \
            public/tools/atlas-market-intelligence/data/mdfe_destinos_municipios.json \
            public/tools/atlas-market-intelligence/data/mdfe_corredores.json \
            public/tools/atlas-market-intelligence/data/mdfe.metadata.json \
            public/tools/atlas-market-intelligence/data/manifest.json
          if git diff --cached --quiet; then
            echo "No derived-data changes to commit."
            exit 0
          fi
          BRANCH="data/market-intelligence-mdfe-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data(mdfe): publica fluxo origem-destino (CIOT) por município"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(mdfe): publica fluxo origem-destino (CIOT) por município" \
            --body "Fluxo de carga gerado automaticamente pelo workflow \`market-intelligence-mdfe.yml\` (run ${GITHUB_RUN_ID}), a partir do CIOT (ANTT) -- proxy documentado de MDF-e, ver FONTES.md. \`main\` é protegida e exige PR + check \`build\`, então este bot publica via PR em vez de push direto." \
            --base main --head "$BRANCH")
          echo "Pull request criado: $PR_URL"
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Auto-merge não habilitado ou PR requer aprovação manual — revisar $PR_URL."
