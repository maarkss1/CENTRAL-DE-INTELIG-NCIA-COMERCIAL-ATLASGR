name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Papel NOSUPERUSER — nunca o superusuário de bootstrap (prospector) — pra que os testes de
      # integração de RLS (tests/integration/tenant-isolation-db001.test.ts e afins) rodem sob as
      # mesmas condições de produção. Ver N1 em docs/auditoria-divida-tecnica/08-PLANO-DE-SEGURANCA.md.
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      # better-auth precisa disto pra assinar cookie de sessão; test:e2e sobe o servidor Express
      # real (ver TEST-002/playwright.config.ts) e faz login de verdade contra ele.
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      # tests/e2e cria uma conta real por teste (ver tests/e2e/helpers.ts) e todos os 29 specs
      # rodam sequencialmente a partir do mesmo IP — o default de produção (20 POSTs/15min em
      # /api/auth, ver server.ts authLimiter) derrubava os testes depois dos ~19 primeiros com
      # 429, sem nenhuma falha de asserção real por trás (só timeout esperando a navegação pro
      # /app que o 429 nunca deixava acontecer).
      AUTH_RATE_LIMIT_MAX: 500

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Audit for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true # Known issue with better-auth pending upstream resolution

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage

      - name: Run Migrations (para testes de integração)
        run: npx prisma migrate deploy

      # vitest.integration.config.ts e o pretest:integration (dotenv -e .env.test) esperam este
      # arquivo — sem ele, localmente cai pro .env.test.example versionado, mas no CI não há
      # fallback, então escrevemos aqui com os valores reais do job (ver TEST-003 em
      # docs/auditoria-divida-tecnica/07-PLANO-DE-TESTES.md). scripts/test/prepare-integration-env.js
      # pula o docker-compose up no CI porque os service containers acima já ocupam essas portas.
      - name: Criar .env.test para os testes de integração e E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          EOF

      - name: Run Integration Tests
        run: npm run test:integration -- --coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # TEST-002 (docs/auditoria-divida-tecnica/07-PLANO-DE-TESTES.md): playwright.config.ts agora
      # sobe o servidor Express real (start:e2e) em vez do `vite preview` estático — os specs fazem
      # cadastro/login reais contra better-auth e CRUD real contra /api/leads.
      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
        if: failure()

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
        if: always()
      - name: Run Build
        run: npm run build
