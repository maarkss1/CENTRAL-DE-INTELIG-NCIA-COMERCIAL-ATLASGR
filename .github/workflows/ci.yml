# Workflow canônico de release da aplicação.
# A proteção da main exige o contexto GitHub Actions `build`; por isso esse nome é
# reservado exclusivamente ao agregador final deste workflow.
name: Central AtlasGR Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-atlasgr-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Central AtlasGR / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (varredura de segredo versionado)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Central AtlasGR / application gate
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500
      PLATFORM_OPERATOR_TOKEN: ci-test-operator-token-not-for-production
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Audit for vulnerabilities (waiver-aware)
        run: npm run security:audit-waivers

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Verificar working tree limpa após os gates de verificação
        # Nenhum gate de CI (lint, geração do Prisma Client, etc.) deve alterar
        # arquivos versionados. Autofix é um comando local explícito
        # (`npm run lint:fix`), nunca implícito no pipeline. Este passo é uma
        # rede de segurança: se algum gate futuro reintroduzir --fix/autofix (ou
        # outro efeito colateral que escreva no working tree), o CI falha aqui em
        # vez de mascarar a mudança silenciosamente.
        run: |
          if ! git diff --quiet -- . ':!node_modules'; then
            echo "::error::Os gates de verificação alteraram arquivos versionados. O CI deve apenas verificar, nunca corrigir automaticamente. Rode 'npm run lint:fix' localmente e commite o resultado."
            git diff --stat -- . ':!node_modules'
            exit 1
          fi

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Verificar deriva de OpenAPI
        run: npm run verify:openapi-drift

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage

      - name: Golden Dataset live regression gate
        if: ${{ env.GROQ_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        env:
          GOLDEN_EVAL_USE_LLM_JUDGE: 'true'
        run: npm run eval:golden

      - name: Run Migrations (para testes de integração)
        run: npx prisma migrate deploy

      - name: Criar .env.test para os testes de integração e E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          PLATFORM_OPERATOR_TOKEN=$PLATFORM_OPERATOR_TOKEN
          EOF

      - name: Run Integration Tests (auth, RBAC and tenant isolation)
        run: npm run test:integration -- --coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
        if: failure()

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: coverage/
        if: always()

      - name: Run Build
        run: npm run build

  # Este é o único job que deve publicar o contexto `build` exigido pela branch protection.
  # O if: always() transforma falha/cancelamento das dependências em FAIL explícito em vez de
  # deixar o required check ausente.
  build:
    name: build
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [secret-scan, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar veredito do repositório
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          APPLICATION_GATE_RESULT: ${{ needs.build-and-test.result }}
        run: |
          set -euo pipefail
          printf 'secret-scan=%s\napplication-gate=%s\n' \
            "$SECRET_SCAN_RESULT" "$APPLICATION_GATE_RESULT"
          test "$SECRET_SCAN_RESULT" = success
          test "$APPLICATION_GATE_RESULT" = success

  # Geração manual de baselines Linux. Não participa do required check `build`.
  visual-baselines:
    name: "Gerar baselines visuais Linux (manual)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500
      PLATFORM_OPERATOR_TOKEN: ci-test-operator-token-not-for-production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Criar .env.test para os testes E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          PLATFORM_OPERATOR_TOKEN=$PLATFORM_OPERATOR_TOKEN
          EOF

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Remover describe.skip temporariamente
        run: sed -i "s/test\.describe\.skip('Regressão visual'/test.describe('Regressão visual'/" tests/e2e/visual.spec.ts

      - name: Gerar baselines *-chromium-linux.png
        run: npm run test:e2e -- tests/e2e/visual.spec.ts --update-snapshots

      - name: Upload baselines geradas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-snapshots-linux
          path: tests/e2e/visual.spec.ts-snapshots/*-chromium-linux.png
          if-no-files-found: error

      - name: Upload Playwright report (se falhar)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-playwright-report
          path: playwright-report/
        if: failure()
