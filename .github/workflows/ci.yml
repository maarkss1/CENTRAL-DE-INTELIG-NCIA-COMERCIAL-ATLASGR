name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  # Só usado pelo job `visual-baselines` abaixo — disparo manual único para gerar as baselines
  # *-chromium-linux.png. Não afeta push/pull_request (job tem `if: github.event_name ==
  # 'workflow_dispatch'`, então em qualquer outro trigger ele simplesmente não roda).
  workflow_dispatch:

jobs:
  # Varredura de segredo versionado no diff do push/PR. Este repositório já teve credenciais reais
  # e PII versionadas por engano (ver commit 40a99c31 "fix(seguranca): expurga credenciais reais e
  # PII versionadas no repositorio") — este job existe para que isso não aconteça de novo em
  # silêncio. gitleaks-action@v2 funciona sem licença para repositórios de conta pessoal/
  # organização gratuita (o Enterprise/licença só é exigido para o dashboard "gitleaks Enterprise",
  # não para rodar o scanner em CI). Ver AGENTS.md → "Segurança e higiene" (varredura de segredo
  # obrigatória antes de finalizar qualquer onda).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (varredura de segredo versionado)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    # Fase Final 1 (Gate Único de Release): dependência explícita no próprio arquivo, não só
    # "os dois jobs existem" — sem isso, secret-scan e build-and-test rodam em paralelo e um
    # secret-scan que falha não impede build/test/publish de prosseguir. Ver .agents/runs/final-fase-1.md.
    needs: secret-scan

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Papel NOSUPERUSER — nunca o superusuário de bootstrap (prospector) — pra que os testes de
      # integração de RLS (tests/integration/tenant-isolation-db001.test.ts e afins) rodem sob as
      # mesmas condições de produção. Ver N1 em docs/auditoria-divida-tecnica/08-PLANO-DE-SEGURANCA.md.
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      # better-auth precisa disto pra assinar cookie de sessão; test:e2e sobe o servidor Express
      # real (ver TEST-002/playwright.config.ts) e faz login de verdade contra ele.
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      # tests/e2e cria uma conta real por teste (ver tests/e2e/helpers.ts) e todos os 29 specs
      # rodam sequencialmente a partir do mesmo IP — o default de produção (20 POSTs/15min em
      # /api/auth, ver server.ts authLimiter) derrubava os testes depois dos ~19 primeiros com
      # 429, sem nenhuma falha de asserção real por trás (só timeout esperando a navegação pro
      # /app que o 429 nunca deixava acontecer).
      AUTH_RATE_LIMIT_MAX: 500

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Generate Prisma Client
        run: npx prisma generate

      # Fase Final 1: gate real, não mais continue-on-error. Em 2026-08-16, `npm audit
      # --audit-level=high` já retorna 0 high/critical (só 2 moderate, uuid via exceljs, fora do
      # escopo de --audit-level=high) — o "known issue com better-auth" citado antes já foi
      # resolvido em versão anterior e o continue-on-error ficou vestigial, mascarando um gate que
      # já passava sozinho. Qualquer HIGH/CRITICAL futuro deve bloquear aqui; se for aceito
      # temporariamente, documentar em docs/security/AUDIT_WAIVERS.md antes de reintroduzir
      # continue-on-error — nunca silenciosamente.
      - name: Audit for vulnerabilities
        run: npm audit --audit-level=high

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage

      - name: Run Migrations (para testes de integração)
        run: npx prisma migrate deploy

      # vitest.integration.config.ts e o pretest:integration (dotenv -e .env.test) esperam este
      # arquivo — sem ele, localmente cai pro .env.test.example versionado, mas no CI não há
      # fallback, então escrevemos aqui com os valores reais do job (ver TEST-003 em
      # docs/auditoria-divida-tecnica/07-PLANO-DE-TESTES.md). scripts/test/prepare-integration-env.js
      # pula o docker-compose up no CI porque os service containers acima já ocupam essas portas.
      - name: Criar .env.test para os testes de integração e E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          EOF

      - name: Run Integration Tests
        run: npm run test:integration -- --coverage

      - name: Verify integrations
        run: npm run verify:integrations

      - name: Verify AI
        run: npm run verify:ai

      - name: Verify prod config
        run: npm run verify:prod

      - name: Run Market Intelligence Python ETL fixtures
        run: python3 -m unittest discover -s tests/python/market_intelligence -p 'test_*.py'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # TEST-002 (docs/auditoria-divida-tecnica/07-PLANO-DE-TESTES.md): playwright.config.ts agora
      # sobe o servidor Express real (start:e2e) em vez do `vite preview` estático — os specs fazem
      # cadastro/login reais contra better-auth e CRUD real contra /api/leads.
      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
        if: failure()

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: coverage/
        if: always()
      - name: Run Build
        run: npm run build

  # Job manual, único — gera as baselines de regressão visual *-chromium-linux.png que faltam em
  # tests/e2e/visual.spec.ts-snapshots/ (só existem as *-chromium-win32.png, geradas no Windows;
  # Playwright inclui a plataforma no nome do arquivo, então o CI ubuntu-latest nunca as encontra).
  # Handoff: .agents/handoffs/onda-6/14-para-08-baselines-visuais-linux.md.
  #
  # NÃO gera baseline em todo push/PR de propósito — só quando disparado manualmente via
  # Actions → CI → "Run workflow". Depois de rodar:
  #   1. baixe o artifact `visual-snapshots-linux` deste job;
  #   2. extraia o conteúdo em tests/e2e/visual.spec.ts-snapshots/ (mantendo os PNGs
  #      *-chromium-win32.png já commitados — não descarte a baseline Windows);
  #   3. remova `.skip` de `test.describe.skip('Regressão visual', ...)` em
  #      tests/e2e/visual.spec.ts (o comentário acima do describe explica o porquê do skip);
  #   4. commite os PNGs novos junto com a remoção do skip — a partir daí o job `build-and-test`
  #      acima volta a rodar `tests/e2e/visual.spec.ts` normalmente via `npm run test:e2e`.
  visual-baselines:
    name: "Gerar baselines visuais Linux (manual)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Mesma stack de serviços do job build-and-test acima (postgres/redis) — visual.spec.ts não
    # depende de busca (Meilisearch), então não sobe um container dedicado, igual ao job normal de
    # e2e (que também não sobe Meilisearch como service container, apesar de MEILI_HOST/
    # MEILI_MASTER_KEY estarem no env — ver comentário do job build-and-test).
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Criar .env.test para os testes E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          EOF

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # tests/e2e/visual.spec.ts está em describe.skip (baseline Linux nunca existiu — ver
      # comentário no topo do arquivo). --update-snapshots ainda respeita .skip (um teste pulado
      # não gera nem compara snapshot), então removemos o .skip só neste job, só neste checkout
      # efêmero — o arquivo do repositório não é alterado (nenhum commit sai daqui).
      - name: Remover describe.skip temporariamente (só para esta execução)
        run: sed -i "s/test\.describe\.skip('Regressão visual'/test.describe('Regressão visual'/" tests/e2e/visual.spec.ts

      - name: Gerar baselines *-chromium-linux.png
        run: npm run test:e2e -- tests/e2e/visual.spec.ts --update-snapshots

      - name: Upload baselines geradas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-snapshots-linux
          path: tests/e2e/visual.spec.ts-snapshots/*-chromium-linux.png
          if-no-files-found: error

      - name: Upload Playwright report (se falhar)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-playwright-report
          path: playwright-report/
        if: failure()

  trivy-fs-scan:
    name: "Trivy — scan de filesystem/dependências (HIGH/CRITICAL)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rodar Trivy (fs scan, HIGH/CRITICAL)
        id: trivy
        run: npm run security:trivy

  sonarcloud:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: coverage-reports
          path: coverage/

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@ad8210318ac8bb816e41990d5af2b304f7a6c213
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
