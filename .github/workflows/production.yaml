name: Production CI/CD

# LOCAL-FIRST: nenhum push/PR pode publicar artefato de produção enquanto a Central
# estiver em desenvolvimento local. Este workflow fica disponível somente sob ação
# humana explícita via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (varredura de segredo versionado)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test Code
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500
      PLATFORM_OPERATOR_TOKEN: ci-test-operator-token-not-for-production

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Prisma Generate
        run: npx prisma generate

      - name: Audit for vulnerabilities (waiver-aware)
        run: npm run security:audit-waivers

      - name: Run Lint
        run: npm run lint:ci

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Migrations (para testes de integração)
        run: npx prisma migrate deploy

      - name: Criar .env.test para os testes de integração e E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          PLATFORM_OPERATOR_TOKEN=$PLATFORM_OPERATOR_TOKEN
          EOF

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-playwright-report
          path: playwright-report/
        if: failure()

      - name: Build project
        run: npm run build

  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      packages: write
      # ITEM-10 (Onda 2): upload do SARIF do scan de imagem (job abaixo) para a aba Security.
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ITEM-11 (Onda 3 — SBOM e governança de dependências): todo release real produz um SBOM
      # CycloneDX correlacionável ao commit publicado. Ver docs/security/DEPENDENCY_POLICY.md.
      - name: Use Node.js 22 (para gerar o SBOM)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (para o SBOM)
        run: npm ci --no-audit --no-fund

      - name: Gerar SBOM (CycloneDX)
        run: npm run security:sbom

      - name: Nomear artefato do SBOM com o SHA curto do release
        id: sbom_name
        run: echo "name=sbom-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload do SBOM como artefato do release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.sbom_name.outputs.name }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Necessário para `cache-from`/`cache-to: type=gha` abaixo — o driver "docker" padrão (sem
      # este passo) não suporta o backend de cache remoto do GitHub Actions.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # ITEM-10 (Onda 2 — CodeQL/Trivy/Dependency Review bloqueantes): a imagem é construída e
      # carregada localmente (push: false, load: true) para ser escaneada ANTES de publicar no
      # registry — um achado HIGH/CRITICAL sem waiver impede o push, em vez de publicar primeiro e
      # descobrir depois. cache-from/cache-to (GitHub Actions cache) evitam pagar o build duas
      # vezes: o push abaixo reaproveita as camadas já construídas aqui.
      - name: Build Docker image (local, para scan antes do push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Selecionar tag primária para o scan
        id: primary_tag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      # `ignore-unfixed: true` só aqui (não no gate de PR de filesystem) — política deliberada:
      # imagens base (node/debian) frequentemente carregam CVE de pacote de SO sem fix upstream
      # disponível ainda; bloquear todo release por isso não é acionável. Achado com fix
      # disponível continua bloqueando normalmente. Ver .trivyignore.yaml para waivers explícitos
      # por advisory ID (não por severidade rebaixada globalmente).
      - name: Trivy — scan da imagem (HIGH/CRITICAL, bloqueante antes do push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.primary_tag.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          trivyignores: .trivyignore.yaml
          # Mesmo motivo do job trivy-fs-pr-gate em security-trivy.yml: sem isto, `format: sarif`
          # faz a trivy-action ignorar `severity: HIGH,CRITICAL` e avaliar (inclusive para o
          # exit-code) achados de qualquer severidade. Ver comentário completo lá.
          limit-severities-for-sarif: true

      - name: Upload SARIF do scan de imagem para a aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Upload SARIF do scan de imagem como artefato (auditoria/retenção)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 30
          if-no-files-found: warn

      # Só roda se o scan acima passou — o step de scan falha (exit-code 1) e interrompe o job
      # antes de chegar aqui quando há achado HIGH/CRITICAL sem waiver.
      - name: Push Docker image (imagem já escaneada)
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
