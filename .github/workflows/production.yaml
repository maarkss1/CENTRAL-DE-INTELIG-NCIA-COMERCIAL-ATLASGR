name: Production CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test Code
    runs-on: ubuntu-latest

    # Mesmos service containers do ci.yml — sem eles não dá pra rodar test:integration aqui.
    # DEVOPS-001: este job (não o ci.yml) é o gate real de quem decide publicar em produção;
    # workflows do GitHub Actions são independentes entre si, então o ci.yml passar não impede
    # este arquivo de publicar uma imagem com teste quebrado se este job não rodar os testes.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Papel NOSUPERUSER — nunca o superusuário de bootstrap (prospector) — pra que os testes de
      # integração de RLS (tests/integration/tenant-isolation-db001.test.ts e afins) rodem sob as
      # mesmas condições de produção. Ver N1 em docs/auditoria-divida-tecnica/08-PLANO-DE-SEGURANCA.md.
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Prisma Generate
        run: npx prisma generate

      - name: Audit for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true # Known issue with better-auth pending upstream resolution (ver ci.yml)

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Migrations (para testes de integração)
        run: npx prisma migrate deploy

      # Sem este arquivo, scripts/test/prepare-integration-env.js (pretest:integration) cai pro
      # .env.test.example versionado — cujas credenciais (prospector_app_pass) não batem com a
      # senha que "Bootstrap papel NOSUPERUSER da aplicação" configurou neste job
      # (ci_app_test_pass), e prospector_app fica com "password authentication failed" já na
      # primeira query de teste. Mesmo passo do ci.yml.
      - name: Criar .env.test para os testes de integração
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          EOF

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Build project
        run: npm run build

  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Gate de aprovação manual (DEVOPS-001): "production" precisa existir em
    # Settings > Environments com "Required reviewers" configurado — sem isso no lado do GitHub,
    # esta linha sozinha não bloqueia nada. Ver nota de configuração no PLANO-DE-SEGURANCA/checklist.
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
