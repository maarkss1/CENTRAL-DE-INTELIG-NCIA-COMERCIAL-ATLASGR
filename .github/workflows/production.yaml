name: Production CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # DEVOPS-001 (resolvido na Fase Final 1, ver .agents/runs/final-fase-1.md): este é o workflow que
  # decide o que vai pro GHCR/produção — antes rodava um subconjunto mais fraco de verificações que
  # o ci.yml (sem secret scan, sem E2E, com continue-on-error no audit). Agora roda o mesmo gate
  # completo, com dependência explícita (needs) dentro do próprio arquivo, porque GitHub Actions
  # trata workflows de arquivos diferentes como pipelines independentes — ci.yml passar não impede
  # este arquivo de publicar sozinho, então o gate tem que estar aqui dentro também, não só lá.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (varredura de segredo versionado)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test Code
    runs-on: ubuntu-latest
    needs: secret-scan

    # Mesmos service containers do ci.yml — sem eles não dá pra rodar test:integration/E2E aqui.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Papel NOSUPERUSER — nunca o superusuário de bootstrap (prospector) — pra que os testes de
      # integração de RLS (tests/integration/tenant-isolation-db001.test.ts e afins) rodem sob as
      # mesmas condições de produção. Ver N1 em docs/auditoria-divida-tecnica/08-PLANO-DE-SEGURANCA.md.
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      # Necessário para test:e2e (Fase Final 1) — mesmos valores de ci.yml, ver comentários lá.
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 500

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap papel NOSUPERUSER da aplicação
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Prisma Generate
        run: npx prisma generate

      # continue-on-error ativo: waiver "GHSA-ggr8-5vv4-36mx — deepmerge-ts via @prisma/config"
      # em docs/security/AUDIT_WAIVERS.md — ver comentário equivalente em ci.yml.
      - name: Audit for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true # waiver GHSA-ggr8-5vv4-36mx, ver docs/security/AUDIT_WAIVERS.md

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Migrations (para testes de integração)
        run: npx prisma migrate deploy

      # Sem este arquivo, scripts/test/prepare-integration-env.js (pretest:integration) cai pro
      # .env.test.example versionado — cujas credenciais (prospector_app_pass) não batem com a
      # senha que "Bootstrap papel NOSUPERUSER da aplicação" configurou neste job
      # (ci_app_test_pass), e prospector_app fica com "password authentication failed" já na
      # primeira query de teste. Mesmo passo do ci.yml.
      - name: Criar .env.test para os testes de integração e E2E
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          MEILI_HOST=$MEILI_HOST
          MEILI_MASTER_KEY=$MEILI_MASTER_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          AUTH_RATE_LIMIT_MAX=$AUTH_RATE_LIMIT_MAX
          EOF

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Fase Final 1: E2E agora faz parte do gate que decide o que vai pro GHCR — antes só rodava
      # no ci.yml, que não bloqueia este workflow.
      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-playwright-report
          path: playwright-report/
        if: failure()

      - name: Build project
        run: npm run build

  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Gate de aprovação manual (DEVOPS-001): "production" precisa existir em
    # Settings > Environments com "Required reviewers" configurado — sem isso no lado do GitHub,
    # esta linha sozinha não bloqueia nada. Ver nota de configuração no PLANO-DE-SEGURANCA/checklist.
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
