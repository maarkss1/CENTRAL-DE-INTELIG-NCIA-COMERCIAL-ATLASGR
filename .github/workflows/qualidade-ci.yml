name: Code Quality (Lint & Unit Tests)

# Diagnóstico sob demanda. O workflow canônico ci.yml já executa typecheck, lint e unit tests
# automaticamente em push/PR, portanto disparar esta mesma suíte em paralelo só duplica minutos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Type Check
      run: npx tsc --noEmit

    - name: Run Linter
      run: npm run lint:ci

    - name: Architecture tests (fronteiras de dependência e hotspots)
      run: npm run test:architecture

    - name: Run Unit Tests
      run: npm run test:unit
