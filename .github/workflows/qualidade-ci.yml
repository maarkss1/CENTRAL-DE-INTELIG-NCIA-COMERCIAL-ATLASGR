name: Code Quality (Lint & Unit Tests)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: 'npm'

    # O lockfile já é a fonte canônica da árvore de dependências. `npm install --legacy-peer-deps`
    # fazia este gate resolver uma árvore diferente dos demais workflows e, sob Node 20, gerava um
    # Prisma Client incompatível com os tipos produzidos no CI/Market Intelligence em Node 22.
    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npx tsc --noEmit

    - name: Run Linter
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test:unit
