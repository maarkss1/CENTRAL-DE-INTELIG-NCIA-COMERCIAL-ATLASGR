name: TEMP - Prettier Baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/prettier-baseline-20260828'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply repository Prettier baseline
        run: npx prettier --write "src/**/*.{ts,tsx}"

      - name: Verify whitespace integrity
        run: git diff --check

      - name: Commit format-only result
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: aplica baseline Prettier em src"
          git push origin HEAD:${{ github.head_ref }}
