name: Market Intelligence - Orquestrador de Refresh

on:
  schedule:
    # Mensal no dia 10 as 6h da manha (UTC)
    - cron: '0 6 10 * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset para atualizar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'ibge'
          - 'rntrc'
          - 'senatran'
          - 'receita'
          - 'mdfe'
          - 'mjsp'
          - 'competition'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: market-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Trigger workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The inputs.dataset is populated when manually triggered,
          # otherwise it defaults to 'all' via the schedule or empty string which we'll handle as 'all'
          DATASET="${{ github.event.inputs.dataset }}"
          if [ -z "$DATASET" ]; then
            DATASET="all"
          fi

          echo "Triggering dataset refresh for: $DATASET"

          trigger_workflow() {
            local workflow_file=$1
            local name=$2

            if [ -f ".github/workflows/$workflow_file" ]; then
              echo "Triggering $name ($workflow_file)..."
              gh workflow run "$workflow_file" --ref main || echo "::warning::Falha ao iniciar $workflow_file. Verifique as permissões de actions:write e se o workflow existe/possui workflow_dispatch."
            else
              echo "::warning::Workflow $workflow_file não encontrado."
            fi
          }

          if [[ "$DATASET" == "ibge" || "$DATASET" == "all" ]]; then
            trigger_workflow "market-intelligence-municipios.yml" "IBGE Geografia"
          fi

          if [[ "$DATASET" == "rntrc" || "$DATASET" == "all" ]]; then
            trigger_workflow "market-intelligence-rntrc.yml" "ANTT RNTRC"
          fi

          if [[ "$DATASET" == "senatran" || "$DATASET" == "all" ]]; then
            trigger_workflow "market-intelligence-senatran.yml" "SENATRAN Frota"
          fi

          if [[ "$DATASET" == "receita" || "$DATASET" == "all" ]]; then
            trigger_workflow "market-intelligence-cnpj.yml" "Receita CNPJ"
          fi

          if [[ "$DATASET" == "mdfe" || "$DATASET" == "all" ]]; then
            trigger_workflow "market-intelligence-mdfe.yml" "ANTT CIOT MDF-e"
          fi

          if [[ "$DATASET" == "mjsp" || "$DATASET" == "all" ]]; then
            trigger_workflow "market-intelligence-sinesp.yml" "MJSP Sinesp"
          fi

          # "competition" não possui um workflow no momento, portanto não disparamos nenhum script automático se não existir
          if [[ "$DATASET" == "competition" ]]; then
            echo "::notice::Workflow automático para Censo de Concorrência (competition) ainda não implementado na orquestração, mantido como PARCIAL."
          fi

          # Agregação final só deve ser disparada após todos estarem atualizados, mas como workflows são assíncronos via gh cli,
          # idealmente eles devem gerar PRs ou atualizar arquivos, a agregação deve rodar independentemente se todos terminarem,
          # O market-intelligence-aggregate.yml também pode ser disparado separadamente
          if [[ "$DATASET" == "all" ]]; then
            echo "::notice::Para agregação final, consulte 'market-intelligence-aggregate.yml'."
          fi

          echo "Orquestração concluída."
