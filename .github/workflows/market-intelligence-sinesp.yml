name: Market Intelligence - Risco Sinesp VDE

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-intelligence-sinesp.yml'
      - 'public/tools/atlas-market-intelligence/etl_sinesp_risco.py'
  schedule:
    # Dia 25 de cada mes, apos o Sinesp costumar atualizar o bancovde do ano vigente.
    - cron: '30 6 25 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-intelligence-sinesp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate-sinesp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Show Python runtime
        run: python3 --version

      - name: Descobrir e agregar risco Sinesp VDE por UF
        run: |
          python3 public/tools/atlas-market-intelligence/etl_sinesp_risco.py \
            --output public/tools/atlas-market-intelligence/data/risco_uf.json \
            --metadata public/tools/atlas-market-intelligence/data/risco_uf.metadata.json \
            --workdir .cache/market-intelligence/sinesp

      - name: Validate derived dataset and update manifest health
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('public/tools/atlas-market-intelligence/data')
          data_path = root / 'risco_uf.json'
          meta_path = root / 'risco_uf.metadata.json'
          manifest_path = root / 'manifest.json'
          rows = json.loads(data_path.read_text(encoding='utf-8'))
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if not rows:
              raise SystemExit('Risco Sinesp derivado vazio')

          seen = set()
          for row in rows:
              uf = row.get('uf', '')
              if not isinstance(uf, str) or len(uf) != 2:
                  raise SystemExit(f'UF invalida: {uf!r}')
              if uf in seen:
                  raise SystemExit(f'duplicidade de UF: {uf}')
              seen.add(uf)
              for key in ('cargoRobbery', 'vehicleRobbery', 'vehicleTheft'):
                  value = row.get(key)
                  if not isinstance(value, int) or value < 0:
                      raise SystemExit(f'valor invalido em {uf}/{key}: {value!r}')

          stats = meta['stats']
          ufs_matched = int(stats.get('ufs_matched') or 0)
          status = 'ATUALIZADO' if ufs_matched >= 27 else 'PARCIAL'
          competence = meta.get('competence') or 'MANUAL_NAO_INFORMADA'

          for dataset in manifest['datasets']:
              if dataset['id'] == 'risk':
                  break
          else:
              dataset = {'id': 'risk', 'label': 'MJSP / Sinesp VDE'}
              manifest['datasets'].append(dataset)

          dataset.update({
              'status': status,
              'source': 'MJSP / Sinesp (bancovde-<ano>.xlsx)',
              'geography': 'PROXY_UF (fonte não publica granularidade municipal para roubo de carga/veículo e furto de veículo)',
              'municipalUse': 'PROXY_UF',
              'competence': competence,
              'downloadedAt': meta.get('downloadedAt'),
              'sha256': meta.get('outputSha256'),
              'note': (
                  f"Competencia {competence}: {ufs_matched} UFs processadas, "
                  f"{stats.get('relevant_event_rows')} linhas relevantes ({stats.get('relevant_rows_with_municipal_detail')} com municipio real -- "
                  "confirma que a fonte so publica granularidade UF para estes 3 indicadores). "
                  "Aplicado como PROXY_UF por municipio, nunca como observacao municipal."
              ),
          })

          manifest['generatedAt'] = meta.get('downloadedAt') or manifest['generatedAt']
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'competence': competence, 'health': status, 'stats': stats,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish compact derived data via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas-market-data-bot"
          git config user.email "130610135+MaarksN@users.noreply.github.com"
          git add \
            public/tools/atlas-market-intelligence/data/risco_uf.json \
            public/tools/atlas-market-intelligence/data/risco_uf.metadata.json \
            public/tools/atlas-market-intelligence/data/manifest.json
          if git diff --cached --quiet; then
            echo "No derived-data changes to commit."
            exit 0
          fi
          BRANCH="data/market-intelligence-sinesp-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data(sinesp): publica risco por UF (roubo de carga/veiculo, furto de veiculo)"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(sinesp): publica risco por UF (roubo de carga/veiculo, furto de veiculo)" \
            --body "Risco Sinesp gerado automaticamente pelo workflow \`market-intelligence-sinesp.yml\` (run ${GITHUB_RUN_ID}). \`main\` é protegida e exige PR + check \`build\`, então este bot publica via PR em vez de push direto." \
            --base main --head "$BRANCH")
          echo "Pull request criado: $PR_URL"
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Auto-merge não habilitado ou PR requer aprovação manual — revisar $PR_URL."
