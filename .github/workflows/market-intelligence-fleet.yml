name: Market Intelligence - RNTRC Fleet Snapshot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-intelligence-fleet.yml'
      - 'public/tools/atlas-market-intelligence/etl_rntrc_veiculos_atlas.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-intelligence-fleet-${{ github.ref }}
  cancel-in-progress: true

env:
  FLEET_SOURCE_URL: https://dados.antt.gov.br/dataset/2b564396-5593-4b5c-ba2c-3de3fa0a92c0/resource/69b79c0a-6fc9-42be-b014-224dff171915/download/rntrc-veiculos.csv
  FLEET_RESOURCE_PAGE: https://dados.antt.gov.br/dataset/rntrc-veiculos/resource/69b79c0a-6fc9-42be-b014-224dff171915
  FLEET_DICTIONARY_URL: https://dados.antt.gov.br/dataset/2b564396-5593-4b5c-ba2c-3de3fa0a92c0/resource/f2451b92-f5d0-4d76-bda8-ce8137c365fd/download/dicionario-de-dados-veiculos.pdf
  HISTORICAL_JULY_RESOURCE_PAGE: https://dados.antt.gov.br/dataset/rntrc-veiculos/resource/7d348e97-d124-4eb6-951f-75b0506237ed

jobs:
  aggregate-fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Show Python runtime
        run: python3 --version

      - name: Probe current official Aug/2026 RNTRC vehicles resource
        id: probe
        shell: bash
        run: |
          mkdir -p .cache/market-intelligence/raw/rntrc/2026-08
          target="$PWD/.cache/market-intelligence/raw/rntrc/2026-08/rntrc-veiculos.csv"
          headers="$PWD/.cache/market-intelligence/raw/rntrc/2026-08/headers.txt"
          rm -f "$target" "$headers"

          set +e
          http_code=$(curl --silent --show-error --location \
            --connect-timeout 30 --max-time 180 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36' \
            --header 'Accept: text/csv,text/plain;q=0.9,*/*;q=0.8' \
            --header 'Accept-Encoding: identity' \
            --header "Referer: $FLEET_RESOURCE_PAGE" \
            --dump-header "$headers" \
            --output "$target" \
            --write-out '%{http_code}' \
            "$FLEET_SOURCE_URL")
          curl_status=$?
          set -e

          if [ -f "$target" ]; then
            bytes=$(wc -c < "$target")
            sha=$(sha256sum "$target" | awk '{print $1}')
            mime=$(file --brief --mime-type "$target" || true)
          else
            bytes=0
            sha=""
            mime=""
          fi

          echo "HTTP code: $http_code"
          echo "curl status: $curl_status"
          echo "observed bytes: $bytes"
          echo "observed mime: $mime"

          valid=false
          if [ "$curl_status" -eq 0 ] && [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] && [ "$bytes" -ge 1000000 ]; then
            case "$mime" in
              text/plain|text/csv|application/csv|application/octet-stream) valid=true ;;
            esac
          fi

          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"
          echo "curl_status=$curl_status" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "mime=$mime" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Aggregate fleet at official UF granularity
        if: steps.probe.outputs.valid == 'true'
        run: |
          python3 public/tools/atlas-market-intelligence/etl_rntrc_veiculos_atlas.py \
            --vehicles "${{ steps.probe.outputs.target }}" \
            --competence '2026-08' \
            --source-url "$FLEET_SOURCE_URL" \
            --dictionary-url "$FLEET_DICTIONARY_URL" \
            --output public/tools/atlas-market-intelligence/data/rntrc_frota_uf.json \
            --metadata public/tools/atlas-market-intelligence/data/rntrc_frota_uf.metadata.json

      - name: Record official fleet unavailability without inventing data
        if: steps.probe.outputs.valid != 'true'
        env:
          PROBE_HTTP_CODE: ${{ steps.probe.outputs.http_code }}
          PROBE_CURL_STATUS: ${{ steps.probe.outputs.curl_status }}
          PROBE_BYTES: ${{ steps.probe.outputs.bytes }}
          PROBE_SHA256: ${{ steps.probe.outputs.sha256 }}
          PROBE_MIME: ${{ steps.probe.outputs.mime }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('public/tools/atlas-market-intelligence/data')
          root.mkdir(parents=True, exist_ok=True)
          data_path = root / 'rntrc_frota_uf.json'
          meta_path = root / 'rntrc_frota_uf.metadata.json'
          manifest_path = root / 'manifest.json'

          # Nunca deixa um snapshot numérico antigo parecer atual quando o recurso vigente
          # não pode ser validado.
          if data_path.exists():
              data_path.unlink()

          now = datetime.now(timezone.utc).isoformat()
          observed_bytes = int(os.environ.get('PROBE_BYTES') or 0)
          metadata = {
              'dataset': 'ANTT RNTRC-Dados de Veículos',
              'competence': '2026-08',
              'probedAt': now,
              'health': 'NAO_DISPONIVEL',
              'sourceUrl': os.environ['FLEET_SOURCE_URL'],
              'sourcePage': os.environ['FLEET_RESOURCE_PAGE'],
              'dictionaryUrl': os.environ['FLEET_DICTIONARY_URL'],
              'geographyLevel': 'UF',
              'municipalUse': 'PROXY_UF',
              'probe': {
                  'httpCode': os.environ.get('PROBE_HTTP_CODE') or None,
                  'curlStatus': int(os.environ.get('PROBE_CURL_STATUS') or 0),
                  'observedBytes': observed_bytes,
                  'sha256': os.environ.get('PROBE_SHA256') or None,
                  'mimeType': os.environ.get('PROBE_MIME') or None,
                  'minimumAcceptedBytes': 1000000,
              },
              'historicalEvidence': {
                  'july2026ResourcePage': os.environ['HISTORICAL_JULY_RESOURCE_PAGE'],
                  'julyCatalogReportedSize': '10.5 MiB',
                  'julyPhysicalDownloadObservedOn': '2026-08-14',
                  'julyPhysicalDownloadResult': 'HTTP 404 / HTML; rejeitado pelo pipeline',
              },
              'limitations': [
                  'o recurso público oficial vigente não entregou um payload nacional validável no probe automatizado',
                  'o dicionário oficial possui granularidade geográfica UF, não município',
                  'o recurso público não fornece número RNTRC individual para join municipal',
                  'nenhum valor de frota municipal pode ser publicado como observado; uso municipal é somente PROXY_UF',
              ],
              'nextAction': 'reprocessar automaticamente quando o recurso oficial voltar a entregar CSV nacional válido',
          }
          meta_path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          blockers = manifest.get('decisionBlockers', [])
          stale = 'RNTRC e frota ainda não foram agregados nacionalmente por código IBGE nesta branch.'
          replacement = (
              'RNTRC municipal Jul/2026 está publicado; frota oficial permanece NÃO DISPONÍVEL no recurso vigente. '
              'Pelo dicionário ANTT, a frota pública tem granularidade UF e qualquer uso municipal é somente PROXY_UF.'
          )
          manifest['decisionBlockers'] = [replacement if item == stale else item for item in blockers]
          if replacement not in manifest['decisionBlockers']:
              manifest['decisionBlockers'].insert(0, replacement)

          for dataset in manifest['datasets']:
              if dataset['id'] == 'fleet':
                  dataset.update({
                      'status': 'NAO_DISPONIVEL',
                      'competence': '2026-08',
                      'downloadedAt': None,
                      'probedAt': now,
                      'sha256': None,
                      'geography': 'UF',
                      'municipalUse': 'PROXY_UF',
                      'note': (
                          f"Recurso oficial vigente auditado, porém payload não validável ({observed_bytes} bytes observados). "
                          'O recurso histórico Jul/2026, catalogado com 10.5 MiB, retornou HTTP 404 em 14/08/2026. '
                          'Nenhum número de frota foi inferido ou publicado.'
                      ),
                  })
                  break

          manifest['generatedAt'] = now
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: Validate available fleet dataset and update manifest
        if: steps.probe.outputs.valid == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('public/tools/atlas-market-intelligence/data')
          data_path = root / 'rntrc_frota_uf.json'
          meta_path = root / 'rntrc_frota_uf.metadata.json'
          manifest_path = root / 'manifest.json'
          rows = json.loads(data_path.read_text(encoding='utf-8'))
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          valid_ufs = {'AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'}
          if not rows:
              raise SystemExit('Frota RNTRC derivada vazia')
          seen = set()
          total = traction = implements = other = 0
          for row in rows:
              uf = row.get('uf')
              if uf not in valid_ufs or uf in seen:
                  raise SystemExit(f'UF inválida ou duplicada: {uf!r}')
              seen.add(uf)
              if row.get('geographyLevel') != 'UF' or row.get('municipalUse') != 'PROXY_UF':
                  raise SystemExit(f'governança geográfica inválida em {uf}')
              values = {key: row.get(key) for key in ('fleetTotal','tractionVehicles','implements','otherVehicleType')}
              if any(not isinstance(value, int) or value < 0 for value in values.values()):
                  raise SystemExit(f'valor de frota inválido em {uf}: {values!r}')
              if values['fleetTotal'] != values['tractionVehicles'] + values['implements'] + values['otherVehicleType']:
                  raise SystemExit(f'balanço de frota inconsistente em {uf}')
              total += values['fleetTotal']
              traction += values['tractionVehicles']
              implements += values['implements']
              other += values['otherVehicleType']

          if len(seen) < 20:
              raise SystemExit(f'cobertura UF materialmente incompleta: {len(seen)} UFs')

          # MI-005: mesmo gate de nao-regressao de competencia/cobertura dos outros dois
          # workflows de dados (ver market-intelligence-cnpj.yml) -- so se aplica aqui, no
          # ramo em que o recurso oficial ESTA disponivel; o ramo de indisponibilidade acima
          # (linha ~104) so declara ausencia, nunca sobrescreve um numero por outro numero.
          previous = next((d for d in manifest['datasets'] if d['id'] == 'fleet'), None)
          prev_competence = previous.get('competence') if previous else None
          if prev_competence and prev_competence not in ('MANUAL_NAO_INFORMADA',) and '2026-08' < prev_competence:
              raise SystemExit(f"competencia regrediu: nova='2026-08' anterior={prev_competence!r}")

          # 'coverage' mantem o mesmo significado espacial que tem em CNPJ/RNTRC (quanto do
          # universo geografico esta representado); a frota total (variavel de negocio, nao
          # geografica) usa seu proprio campo 'fleetTotal' para o gate de variacao anormal --
          # UFs sao no maximo 27, entao 15% de variacao em contagem de UF dispararia por
          # oscilacao trivial (1 UF a mais/menos), enquanto uma queda de 15% na frota total e
          # o sinal real de corrupcao/regressao de dado.
          prev_fleet_total = previous.get('fleetTotal') if previous else None
          if isinstance(prev_fleet_total, int) and prev_fleet_total > 0:
              variation = (total - prev_fleet_total) / prev_fleet_total
              if abs(variation) > 0.15:
                  raise SystemExit(
                      f'variacao anormal de frota total sem justificativa: {prev_fleet_total} -> {total} veiculos ({variation:+.2%})'
                  )

          status = meta.get('health', 'PARCIAL')
          for dataset in manifest['datasets']:
              if dataset['id'] == 'fleet':
                  dataset.update({
                      'status': status,
                      'competence': '2026-08',
                      'downloadedAt': meta.get('generatedAt'),
                      'probedAt': meta.get('generatedAt'),
                      'sha256': meta.get('outputSha256'),
                      'geography': 'UF',
                      'municipalUse': 'PROXY_UF',
                      'coverage': len(seen),
                      'fleetTotal': total,
                      'unmatchedRows': 0,
                      'unmatchedRate': 0.0,
                      'note': (
                          f"Snapshot oficial Ago/2026: {total} veículos em {len(seen)} UFs; "
                          f"tração={traction}, implementos={implements}, outros={other}. "
                          'O dicionário oficial não fornece município; uso municipal é sempre PROXY_UF.'
                      )
                  })
                  break

          manifest['generatedAt'] = meta.get('generatedAt') or manifest['generatedAt']
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish fleet health or compact derived data via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas-market-data-bot"
          git config user.email "130610135+MaarksN@users.noreply.github.com"
          git add \
            public/tools/atlas-market-intelligence/data/rntrc_frota_uf.metadata.json \
            public/tools/atlas-market-intelligence/data/manifest.json
          if [ -f public/tools/atlas-market-intelligence/data/rntrc_frota_uf.json ]; then
            git add public/tools/atlas-market-intelligence/data/rntrc_frota_uf.json
          fi

          if git diff --cached --quiet; then
            echo "No fleet-data health changes to commit."
            exit 0
          fi
          BRANCH="data/market-intelligence-fleet-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data(rntrc): registra saúde da frota oficial Ago/2026"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(rntrc): registra saúde da frota oficial Ago/2026" \
            --body "Snapshot/saúde da frota RNTRC gerado automaticamente pelo workflow \`market-intelligence-fleet.yml\` (run ${GITHUB_RUN_ID}). \`main\` é protegida e exige PR + check \`build\`, então este bot publica via PR em vez de push direto." \
            --base main --head "$BRANCH")
          echo "Pull request criado: $PR_URL"
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Auto-merge não habilitado ou PR requer aprovação manual — revisar $PR_URL."
