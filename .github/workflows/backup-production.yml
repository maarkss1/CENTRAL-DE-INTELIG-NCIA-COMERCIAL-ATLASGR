name: Backup de produção (ativação pendente)

# O pipeline está pronto, mas NÃO deve rodar agendado enquanto os pré-requisitos externos não
# existirem. A auditoria SRE confirmou Cloudflare R2 desabilitado (HTTP 403) e secrets de backup
# ainda não configurados; manter cron nessa condição só produz falhas diárias sem criar backup.
#
# Quando R2 + secrets estiverem configurados, valide primeiro por workflow_dispatch. Somente após
# uma execução real verde o cron diário deve ser reativado.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  backup:
    name: Dump + upload criptografado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validar pré-requisitos secretos
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          missing=0
          for name in BACKUP_DATABASE_URL BACKUP_ENCRYPTION_PASSPHRASE R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret obrigatório ausente: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Instalar postgresql-client 17 (mesma major do Postgres de produção)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump do banco de produção (papel somente-leitura, BYPASSRLS)
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "BACKUP_FILE=prospectordb_prod_${TIMESTAMP}.sql.gz" >> "$GITHUB_ENV"
          pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-acl | gzip -9 > "prospectordb_prod_${TIMESTAMP}.sql.gz"
          test -s "prospectordb_prod_${TIMESTAMP}.sql.gz"

      - name: Criptografar o dump (GPG simétrico) antes de sair do runner
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_PASSPHRASE" \
            --output "${BACKUP_FILE}.gpg" "$BACKUP_FILE"
          rm -f "$BACKUP_FILE"
          test -s "${BACKUP_FILE}.gpg"

      - name: Upload para Cloudflare R2 (S3-compatível)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "${BACKUP_FILE}.gpg" "s3://${R2_BUCKET}/${BACKUP_FILE}.gpg" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Retenção — remover backups com mais de 30 dias
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CUTOFF="$(date -u -d '30 days ago' +%Y-%m-%d)"
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$ENDPOINT" \
            --query "Contents[?LastModified<='${CUTOFF}'].Key" --output text | tr '\t' '\n' | \
          while read -r KEY; do
            if [ -n "$KEY" ] && [ "$KEY" != "None" ]; then
              echo "Removendo backup expirado: $KEY"
              aws s3 rm "s3://${R2_BUCKET}/${KEY}" --endpoint-url "$ENDPOINT"
            fi
          done

      - name: Confirmar backup do dia presente no bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 ls "s3://${R2_BUCKET}/${BACKUP_FILE}.gpg" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "### Backup de produção" >> "$GITHUB_STEP_SUMMARY"
          echo "- Arquivo: \`${BACKUP_FILE}.gpg\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Confirmado no bucket \`${R2_BUCKET}\` em $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
