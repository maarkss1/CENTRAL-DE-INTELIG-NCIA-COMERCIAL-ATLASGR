name: Market Intelligence - Cadastro Municipal (IBGE + BCIM)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-intelligence-municipios.yml'
      - 'public/tools/atlas-market-intelligence/etl_municipios_ibge.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: market-intelligence-municipios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-municipios:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Show Python runtime
        run: python3 --version

      - name: Gerar cadastro municipal (IBGE localidades + centroide BCIM)
        run: |
          python3 public/tools/atlas-market-intelligence/etl_municipios_ibge.py \
            --workdir .cache/market-intelligence/municipios \
            --output public/tools/atlas-market-intelligence/data/municipios.json \
            --metadata public/tools/atlas-market-intelligence/data/municipios.metadata.json

      - name: Validate derived dataset and update manifest health
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('public/tools/atlas-market-intelligence/data')
          data_path = root / 'municipios.json'
          meta_path = root / 'municipios.metadata.json'
          manifest_path = root / 'manifest.json'
          rows = json.loads(data_path.read_text(encoding='utf-8'))
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if not rows:
              raise SystemExit('Cadastro municipal derivado vazio')

          seen = set()
          for row in rows:
              code = str(row.get('ibgeCode', ''))
              if not code.isdigit() or len(code) != 7:
                  raise SystemExit(f'codigo IBGE invalido: {code!r}')
              if code in seen:
                  raise SystemExit(f'duplicidade municipal: {code}')
              seen.add(code)

          stats = meta['stats']
          total = int(stats.get('municipalities_total') or 0)
          missing = int(stats.get('municipalities_missing_centroid') or 0)
          if total < 5500:
              raise SystemExit(f'cadastro municipal incompleto: apenas {total} municipios')
          missing_rate = missing / total if total else 1
          status = 'ATUALIZADO' if missing_rate <= 0.01 else 'PARCIAL'

          for dataset in manifest['datasets']:
              if dataset['id'] == 'ibge':
                  break
          else:
              dataset = {'id': 'ibge', 'label': 'IBGE / geografia municipal', 'geography': 'Município / UF / Região'}
              manifest['datasets'].append(dataset)

          dataset.update({
              'status': status,
              'source': 'IBGE (Localidades) + IBGE BCIM (lim_municipio_a)',
              'downloadedAt': meta.get('processedAt'),
              'sha256': meta.get('outputSha256'),
              'note': (
                  f"Cadastro com {total} municipios; codigo IBGE, nome, UF e regiao do cadastro de "
                  f"localidades. Latitude/longitude sao o centroide geometrico do poligono municipal "
                  f"(BCIM 2016, camada lim_municipio_a, join por geocodigo -- nunca por nome). "
                  f"{missing} municipio(s) sem poligono correspondente permanecem sem coordenada."
              ),
          })

          manifest['generatedAt'] = meta.get('processedAt') or manifest['generatedAt']
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'municipalities_total': total,
              'municipalities_with_centroid': stats.get('municipalities_with_centroid'),
              'municipalities_missing_centroid': missing,
              'health': status,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish compact derived data via pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas-market-data-bot"
          git config user.email "130610135+MaarksN@users.noreply.github.com"
          git add \
            public/tools/atlas-market-intelligence/data/municipios.json \
            public/tools/atlas-market-intelligence/data/municipios.metadata.json \
            public/tools/atlas-market-intelligence/data/manifest.json
          if git diff --cached --quiet; then
            echo "No derived-data changes to commit."
            exit 0
          fi
          BRANCH="data/market-intelligence-municipios-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "data(municipios): publica cadastro municipal IBGE + centroide BCIM"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(municipios): publica cadastro municipal IBGE + centroide BCIM" \
            --body "Cadastro municipal gerado automaticamente pelo workflow \`market-intelligence-municipios.yml\` (run ${GITHUB_RUN_ID}). \`main\` é protegida e exige PR + check \`build\`, então este bot publica via PR em vez de push direto." \
            --base main --head "$BRANCH")
          echo "Pull request criado: $PR_URL"
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Auto-merge não habilitado ou PR requer aprovação manual — revisar $PR_URL."
