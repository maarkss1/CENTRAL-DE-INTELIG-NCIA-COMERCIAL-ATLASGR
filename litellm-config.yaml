model_list:
  # "local-llama3"/"local-llama3-fast" são os nomes lógicos usados em todo o app (ai.service.ts,
  # gateway.ts, ReportsHub) para "modelo de raciocínio" vs "modelo rápido". Ambos rodam de fato
  # contra o Ollama local (sem chave, sem custo, roda na própria máquina via host.docker.internal)
  # — nomes antigos "gemini-pro"/"gemini-flash" foram removidos por serem enganosos: davam a
  # entender que chamavam o Gemini real do Google, quando sempre rodaram contra Ollama por padrão
  # (ver IA-001). Se `GEMINI_API_KEY` estiver configurada, o app tem um caminho separado que fala
  # direto com a API do Google (ver embedFallbackDireto em src/lib/ai/gateway.ts) — mas os aliases
  # abaixo não usam essa chave, e não devem fingir que usam.
  - model_name: local-llama3
    litellm_params:
      model: ollama/llama3
      api_base: "http://host.docker.internal:11434"
  - model_name: local-llama3-fast
    litellm_params:
      model: ollama/llama3
      api_base: "http://host.docker.internal:11434"
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
  - model_name: ollama-llama3
    litellm_params:
      model: ollama/llama3
      api_base: "http://host.docker.internal:11434"
  - model_name: openrouter-mixtral
    litellm_params:
      model: openrouter/mistralai/mixtral-8x7b-instruct
  - model_name: qwen-coder
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b-instruct
      api_key: "os.environ/OPENROUTER_API_KEY"
  - model_name: deepseek-coder
    litellm_params:
      model: openrouter/deepseek/deepseek-coder
      api_key: "os.environ/OPENROUTER_API_KEY"


litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 60
  fallbacks: [{"local-llama3": ["local-llama3-fast"]}, {"gpt-4o": ["local-llama3"]}, {"claude-sonnet": ["local-llama3"]}]

router_settings:
  routing_strategy: usage-based-routing
  enable_pre_call_checks: true
