model_list:
  # Apelidos "gemini-pro"/"gemini-flash" mantidos de propósito — são os nomes lógicos usados em todo
  # o app (ai.service.ts, gateway.ts, ReportsHub) para "modelo de raciocínio" vs "modelo rápido".
  # Repontados para Groq (tier gratuito, sem cartão) em vez de Gemini (a chave do projeto ficou sem
  # crédito de prepagamento) — assim nenhum código de aplicação precisa mudar, só o roteamento aqui.
  - model_name: gemini-pro
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"
  - model_name: gemini-flash
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: "os.environ/GROQ_API_KEY"
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
  - model_name: ollama-llama3
    litellm_params:
      model: ollama/llama3
  - model_name: openrouter-mixtral
    litellm_params:
      model: openrouter/mistralai/mixtral-8x7b-instruct

litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 60
  fallbacks: [{"gemini-pro": ["gemini-flash"]}, {"gpt-4o": ["gemini-pro"]}, {"claude-sonnet": ["gemini-pro"]}]

router_settings:
  routing_strategy: usage-based-routing
  enable_pre_call_checks: true
